<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ALFA ZOMBIE SURVIVAL 3D</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050608;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#050608;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:10;
}

#topbar{
  position:absolute;
  top:18px;
  left:18px;
  right:18px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.panel{
  background:rgba(5,8,12,.78);
  border:1px solid rgba(255,255,255,.14);
  border-radius:12px;
  padding:12px 15px;
  backdrop-filter:blur(8px);
  box-shadow:0 8px 30px rgba(0,0,0,.35);
}

#stats{
  min-width:205px;
}

.stat{
  display:flex;
  justify-content:space-between;
  gap:25px;
  margin:4px 0;
  font-size:14px;
}

.label{
  color:#9ca3af;
}

.value{
  font-weight:bold;
}

#healthWrap{
  margin-top:8px;
  width:175px;
  height:9px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
}

#health{
  width:100%;
  height:100%;
  background:#39d353;
  transition:.15s;
}

#ammo{
  text-align:right;
  font-size:28px;
  font-weight:800;
  letter-spacing:1px;
}

#ammo small{
  color:#9ca3af;
  font-size:12px;
  font-weight:normal;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:25px;
  height:25px;
  transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:#fff;
  box-shadow:0 0 5px #000;
}

#crosshair:before{
  width:2px;
  height:25px;
  left:11px;
  top:0;
}

#crosshair:after{
  width:25px;
  height:2px;
  left:0;
  top:11px;
}

#damageFlash{
  position:absolute;
  inset:0;
  background:rgba(255,0,0,.35);
  opacity:0;
  transition:opacity .08s;
}

#message{
  position:absolute;
  left:50%;
  bottom:95px;
  transform:translateX(-50%);
  background:rgba(0,0,0,.65);
  padding:9px 16px;
  border-radius:9px;
  opacity:0;
  transition:.2s;
  font-size:14px;
}

#controls{
  position:absolute;
  left:18px;
  bottom:18px;
  font-size:12px;
  color:#b8c0ca;
}

#consoleButton{
  position:absolute;
  right:18px;
  bottom:18px;
  pointer-events:auto;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(8,12,18,.9);
  color:#fff;
  border-radius:10px;
  padding:11px 15px;
  font-weight:bold;
}

#console{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(700px,92vw);
  height:min(480px,78vh);
  background:rgba(2,5,8,.96);
  border:1px solid #303841;
  border-radius:14px;
  z-index:50;
  display:none;
  box-shadow:0 25px 80px rgba(0,0,0,.65);
}

#console.open{
  display:flex;
  flex-direction:column;
}

#consoleHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 15px;
  border-bottom:1px solid #252b32;
}

#consoleHead strong{
  color:#6ee7ff;
}

#closeConsole{
  cursor:pointer;
  border:0;
  background:#1b2229;
  color:#fff;
  border-radius:7px;
  padding:7px 11px;
}

#consoleOutput{
  flex:1;
  overflow:auto;
  padding:15px;
  font-family:Consolas,monospace;
  font-size:13px;
  line-height:1.6;
  color:#b8c7d9;
}

#consoleInputWrap{
  display:flex;
  border-top:1px solid #252b32;
}

#consoleInput{
  flex:1;
  border:0;
  outline:0;
  padding:13px;
  background:#070b10;
  color:#fff;
  font-family:Consolas,monospace;
}

#consoleRun{
  border:0;
  background:#16242c;
  color:#6ee7ff;
  padding:0 18px;
  cursor:pointer;
}

#startScreen{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,rgba(30,40,50,.35),#030506 70%);
}

.startBox{
  width:min(520px,90vw);
  text-align:center;
  padding:35px;
  background:rgba(7,10,14,.88);
  border:1px solid rgba(255,255,255,.13);
  border-radius:20px;
  box-shadow:0 30px 100px rgba(0,0,0,.7);
}

.startBox h1{
  font-size:clamp(30px,6vw,52px);
  letter-spacing:3px;
  margin-bottom:10px;
}

.startBox p{
  color:#a9b1bb;
  line-height:1.6;
  margin-bottom:25px;
}

#startBtn{
  border:0;
  border-radius:11px;
  padding:14px 28px;
  background:#e5e7eb;
  color:#050608;
  font-weight:800;
  cursor:pointer;
  font-size:15px;
}

#mobileControls{
  display:none;
  position:absolute;
  inset:0;
  pointer-events:none;
}

.mobileBtn{
  position:absolute;
  pointer-events:auto;
  width:60px;
  height:60px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(10,15,20,.65);
  color:#fff;
  font-weight:bold;
}

#shootBtn{
  right:25px;
  bottom:30px;
  width:80px;
  height:80px;
}

#reloadBtn{
  right:125px;
  bottom:40px;
}

@media(max-width:700px){
  #controls{
    display:none;
  }

  #mobileControls{
    display:block;
  }

  #topbar{
    top:10px;
    left:10px;
    right:10px;
  }

  .panel{
    padding:9px 11px;
  }

  #stats{
    min-width:155px;
  }

  #ammo{
    font-size:22px;
  }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">

  <div id="topbar">

    <div id="stats" class="panel">
      <div class="stat">
        <span class="label">HP</span>
        <span class="value" id="hpText">100</span>
      </div>

      <div id="healthWrap">
        <div id="health"></div>
      </div>

      <div class="stat">
        <span class="label">WAVE</span>
        <span class="value" id="waveText">1</span>
      </div>

      <div class="stat">
        <span class="label">ZOMBIE</span>
        <span class="value" id="zombieText">0</span>
      </div>

      <div class="stat">
        <span class="label">SCORE</span>
        <span class="value" id="scoreText">0</span>
      </div>
    </div>

    <div id="ammo" class="panel">
      <span id="ammoText">12</span>
      <small>/ 120</small>
    </div>

  </div>

  <div id="crosshair"></div>

  <div id="damageFlash"></div>

  <div id="message"></div>

  <div id="controls">
    WASD = Bergerak &nbsp; | &nbsp;
    Mouse = Lihat &nbsp; | &nbsp;
    Klik = Tembak &nbsp; | &nbsp;
    R = Reload &nbsp; | &nbsp;
    ~ = Console
  </div>

  <button id="consoleButton">CONSOLE</button>

  <div id="mobileControls">
    <button class="mobileBtn" id="shootBtn">FIRE</button>
    <button class="mobileBtn" id="reloadBtn">R</button>
  </div>

</div>

<div id="console">

  <div id="consoleHead">
    <strong>ALFA ZOMBIE // COMMAND CONSOLE</strong>
    <button id="closeConsole">CLOSE</button>
  </div>

  <div id="consoleOutput"></div>

  <div id="consoleInputWrap">
    <input
      id="consoleInput"
      autocomplete="off"
      spellcheck="false"
      placeholder="ketik help..."
    >
    <button id="consoleRun">RUN</button>
  </div>

</div>

<div id="startScreen">

  <div class="startBox">

    <h1>ALFA ZOMBIE</h1>

    <p>
      SURVIVAL 3D<br>
      Bertahan hidup dari gelombang zombie.
      Gunakan pistol dan command console untuk mengendalikan permainan.
    </p>

    <button id="startBtn">START GAME</button>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
"use strict";

/* =========================================================
   ALFA ZOMBIE SURVIVAL 3D
   V1
========================================================= */

const game = document.getElementById("game");

let scene;
let camera;
let renderer;
let clock;

let player;
let gun;

let zombies = [];

let keys = {};

let yaw = 0;
let pitch = 0;

let started = false;
let locked = false;

let hp = 100;
let ammo = 12;
let reserveAmmo = 120;
let score = 0;
let wave = 1;

let fireCooldown = 0;
let reloadTimer = 0;
let spawnTimer = 0;

const PLAYER_SPEED = 5.5;
const MAX_AMMO = 12;

const hpText = document.getElementById("hpText");
const healthBar = document.getElementById("health");
const ammoText = document.getElementById("ammoText");
const waveText = document.getElementById("waveText");
const zombieText = document.getElementById("zombieText");
const scoreText = document.getElementById("scoreText");

const damageFlash = document.getElementById("damageFlash");
const message = document.getElementById("message");

const consoleBox = document.getElementById("console");
const consoleOutput = document.getElementById("consoleOutput");
const consoleInput = document.getElementById("consoleInput");

const startScreen = document.getElementById("startScreen");

function init(){

  scene = new THREE.Scene();

  scene.background = new THREE.Color(0x050709);

  scene.fog = new THREE.FogExp2(
    0x050709,
    0.035
  );

  camera = new THREE.PerspectiveCamera(
    72,
    innerWidth / innerHeight,
    0.05,
    500
  );

  renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });

  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.8)
  );

  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

  renderer.outputColorSpace =
    THREE.SRGBColorSpace;

  game.appendChild(renderer.domElement);

  clock = new THREE.Clock();

  createWorld();
  createPlayer();
  createGun();

  for(let i=0;i<3;i++){
    spawnZombie();
  }

  updateHUD();

  animate();
}

/* =========================================================
   WORLD
========================================================= */

function createWorld(){

  const ambient =
    new THREE.HemisphereLight(
      0x9aa9b8,
      0x050505,
      0.55
    );

  scene.add(ambient);

  const moon =
    new THREE.DirectionalLight(
      0xc9d6ff,
      1.2
    );

  moon.position.set(
    -40,
    60,
    -30
  );

  moon.castShadow = true;

  moon.shadow.mapSize.width = 2048;
  moon.shadow.mapSize.height = 2048;

  moon.shadow.camera.left = -70;
  moon.shadow.camera.right = 70;
  moon.shadow.camera.top = 70;
  moon.shadow.camera.bottom = -70;

  scene.add(moon);

  const groundGeo =
    new THREE.PlaneGeometry(
      250,
      250
    );

  const groundMat =
    new THREE.MeshStandardMaterial({
      color:0x15181b,
      roughness:0.92,
      metalness:0.05
    });

  const ground =
    new THREE.Mesh(
      groundGeo,
      groundMat
    );

  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;

  scene.add(ground);

  createRoad(
    0,
    -10,
    8,
    220
  );

  createRoad(
    -20,
    0,
    220,
    7
  );

  for(let i=0;i<45;i++){
    createBuilding();
  }

  createStreetLights();

  createFogParticles();
}

function createRoad(
  x,
  z,
  width,
  depth
){

  const geo =
    new THREE.BoxGeometry(
      width,
      .04,
      depth
    );

  const mat =
    new THREE.MeshStandardMaterial({
      color:0x202428,
      roughness:1
    });

  const road =
    new THREE.Mesh(
      geo,
      mat
    );

  road.position.set(
    x,
    .02,
    z
  );

  road.receiveShadow = true;

  scene.add(road);
}

function createBuilding(){

  const w =
    5 + Math.random()*8;

  const h =
    4 + Math.random()*13;

  const d =
    5 + Math.random()*8;

  let x =
    (Math.random()-.5)*170;

  let z =
    (Math.random()-.5)*170;

  if(
    Math.abs(x)<15 &&
    Math.abs(z)<15
  ){
    x += 25;
  }

  const geo =
    new THREE.BoxGeometry(
      w,
      h,
      d
    );

  const mat =
    new THREE.MeshStandardMaterial({
      color:
        new THREE.Color(
          .06 + Math.random()*.07,
          .07 + Math.random()*.08,
          .08 + Math.random()*.1
        ),
      roughness:.88
    });

  const building =
    new THREE.Mesh(
      geo,
      mat
    );

  building.position.set(
    x,
    h/2,
    z
  );

  building.castShadow = true;
  building.receiveShadow = true;

  scene.add(building);

  if(Math.random()>.45){

    const windowMat =
      new THREE.MeshStandardMaterial({
        color:0x252b30,
        emissive:0x252b30,
        emissiveIntensity:.7
      });

    for(
      let y=2;
      y<h-1;
      y+=2.5
    ){

      const window =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            .7,
            .8,
            .08
          ),
          windowMat
        );

      window.position.set(
        x + (Math.random()-.5)*(w*.65),
        y,
        z + d/2+.04
      );

      scene.add(window);
    }
  }
}

function createStreetLights(){

  for(let i=-80;i<=80;i+=20){

    const pole =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .07,
          .1,
          5,
          8
        ),
        new THREE.MeshStandardMaterial({
          color:0x25282c,
          metalness:.7,
          roughness:.5
        })
      );

    pole.position.set(
      4,
      2.5,
      i
    );

    pole.castShadow = true;

    scene.add(pole);

    const lamp =
      new THREE.PointLight(
        0xffd18a,
        1.7,
        14
      );

    lamp.position.set(
      4,
      5,
      i
    );

    scene.add(lamp);
  }
}

function createFogParticles(){

  const geo =
    new THREE.BufferGeometry();

  const count = 700;

  const positions =
    new Float32Array(
      count*3
    );

  for(
    let i=0;
    i<count;
    i++
  ){

    positions[i*3] =
      (Math.random()-.5)*180;

    positions[i*3+1] =
      Math.random()*12;

    positions[i*3+2] =
      (Math.random()-.5)*180;
  }

  geo.setAttribute(
    "position",
    new THREE.BufferAttribute(
      positions,
      3
    )
  );

  const mat =
    new THREE.PointsMaterial({
      color:0x8b9299,
      size:.055,
      transparent:true,
      opacity:.22
    });

  scene.add(
    new THREE.Points(
      geo,
      mat
    )
  );
}

/* =========================================================
   PLAYER
========================================================= */

function createPlayer(){

  player =
    new THREE.Group();

  player.position.set(
    0,
    0,
    8
  );

  scene.add(player);

  /*
    First-person camera.
    Body remains available for future
    third-person mode.
  */

  camera.position.set(
    0,
    1.72,
    0
  );

  player.add(camera);

  const body =
    new THREE.Group();

  /*
    More natural humanoid proportions.
  */

  const torso =
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        .29,
        .62,
        5,
        12
      ),
      new THREE.MeshStandardMaterial({
        color:0x1e2930,
        roughness:.78
      })
    );

  torso.position.y=1.05;

  body.add(torso);

  const head =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .24,
        20,
        16
      ),
      new THREE.MeshStandardMaterial({
        color:0xb8896b,
        roughness:.8
      })
    );

  head.position.y=1.68;

  body.add(head);

  const armGeo =
    new THREE.CapsuleGeometry(
      .095,
      .46,
      5,
      8
    );

  const armMat =
    new THREE.MeshStandardMaterial({
      color:0x20272d
    });

  const leftArm =
    new THREE.Mesh(
      armGeo,
      armMat
    );

  leftArm.position.set(
    -.4,
    1.12,
    0
  );

  leftArm.rotation.z=.16;

  body.add(leftArm);

  const rightArm =
    new THREE.Mesh(
      armGeo,
      armMat
    );

  rightArm.position.set(
    .4,
    1.12,
    0
  );

  rightArm.rotation.z=-.16;

  body.add(rightArm);

  const legGeo =
    new THREE.CapsuleGeometry(
      .12,
      .62,
      5,
      8
    );

  const legMat =
    new THREE.MeshStandardMaterial({
      color:0x11171b
    });

  const leftLeg =
    new THREE.Mesh(
      legGeo,
      legMat
    );

  leftLeg.position.set(
    -.16,
    .4,
    0
  );

  body.add(leftLeg);

  const rightLeg =
    new THREE.Mesh(
      legGeo,
      legMat
    );

  rightLeg.position.set(
    .16,
    .4,
    0
  );

  body.add(rightLeg);

  body.visible = false;

  player.add(body);
}

/* =========================================================
   REALISTIC-STYLE PROCEDURAL PISTOL
========================================================= */

function createGun(){

  gun =
    new THREE.Group();

  /*
    Gun is attached to camera,
    giving proper FPS weapon position.
  */

  const metal =
    new THREE.MeshStandardMaterial({
      color:0x171a1d,
      metalness:.82,
      roughness:.26
    });

  const dark =
    new THREE.MeshStandardMaterial({
      color:0x0a0c0e,
      metalness:.55,
      roughness:.55
    });

  const gripMat =
    new THREE.MeshStandardMaterial({
      color:0x15181a,
      roughness:.82
    });

  const slide =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .16,
        .13,
        .62
      ),
      metal
    );

  slide.position.set(
    .31,
    -.22,
    -.55
  );

  gun.add(slide);

  const frame =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .18,
        .14,
        .42
      ),
      dark
    );

  frame.position.set(
    .31,
    -.3,
    -.43
  );

  gun.add(frame);

  const barrel =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .035,
        .035,
        .22,
        12
      ),
      metal
    );

  barrel.rotation.x =
    Math.PI/2;

  barrel.position.set(
    .31,
    -.22,
    -.91
  );

  gun.add(barrel);

  const grip =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .14,
        .4,
        .18
      ),
      gripMat
    );

  grip.position.set(
    .31,
    -.53,
    -.38
  );

  grip.rotation.x=-.18;

  gun.add(grip);

  const trigger =
    new THREE.Mesh(
      new THREE.TorusGeometry(
        .045,
        .012,
        6,
        12,
        Math.PI
      ),
      metal
    );

  trigger.rotation.x=Math.PI/2;

  trigger.position.set(
    .31,
    -.37,
    -.52
  );

  gun.add(trigger);

  const sight =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .035,
        .035,
        .07
      ),
      metal
    );

  sight.position.set(
    .31,
    -.145,
    -.84
  );

  gun.add(sight);

  gun.rotation.set(
    -.04,
    -.02,
    -.015
  );

  gun.position.set(
    0,
    0,
    0
  );

  camera.add(gun);
}

/* =========================================================
   ZOMBIE
========================================================= */

function createZombie(){

  const z =
    new THREE.Group();

  const skin =
    new THREE.MeshStandardMaterial({
      color:0x56645b,
      roughness:.92
    });

  const dark =
    new THREE.MeshStandardMaterial({
      color:0x171c1a,
      roughness:.9
    });

  const torso =
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        .34,
        .65,
        5,
        12
      ),
      skin
    );

  torso.position.y=1.12;

  torso.castShadow=true;

  z.add(torso);

  const head =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .28,
        16,
        12
      ),
      skin
    );

  head.position.y=1.78;

  head.scale.set(
    .9,
    1.08,
    .95
  );

  head.castShadow=true;

  z.add(head);

  /*
    Dark eyes
  */

  const eyeMat =
    new THREE.MeshStandardMaterial({
      color:0x080808,
      emissive:0x030303
    });

  for(
    const side of [-1,1]
  ){

    const eye =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .035,
          8,
          8
        ),
        eyeMat
      );

    eye.position.set(
      side*.1,
      1.82,
      -.255
    );

    z.add(eye);
  }

  const armGeo =
    new THREE.CapsuleGeometry(
      .1,
      .55,
      5,
      8
    );

  const leftArm =
    new THREE.Mesh(
      armGeo,
      skin
    );

  leftArm.position.set(
    -.45,
    1.08,
    0
  );

  leftArm.rotation.z=-.55;

  z.add(leftArm);

  const rightArm =
    new THREE.Mesh(
      armGeo,
      skin
    );

  rightArm.position.set(
    .45,
    1.08,
    0
  );

  rightArm.rotation.z=.55;

  z.add(rightArm);

  const legGeo =
    new THREE.CapsuleGeometry(
      .12,
      .65,
      5,
      8
    );

  const leftLeg =
    new THREE.Mesh(
      legGeo,
      dark
    );

  leftLeg.position.set(
    -.16,
    .42,
    0
  );

  z.add(leftLeg);

  const rightLeg =
    new THREE.Mesh(
      legGeo,
      dark
    );

  rightLeg.position.set(
    .16,
    .42,
    0
  );

  z.add(rightLeg);

  z.userData = {
    hp:100,
    speed:1.1+Math.random()*.55,
    attackCooldown:0,
    phase:Math.random()*10
  };

  return z;
}

function spawnZombie(){

  if(zombies.length >=
     Math.min(
       6 + wave*2,
       28
     )){
    return;
  }

  const z =
    createZombie();

  const angle =
    Math.random()*
    Math.PI*2;

  const distance =
    28 + Math.random()*35;

  z.position.set(
    player.position.x +
      Math.cos(angle)*distance,
    0,
    player.position.z +
      Math.sin(angle)*distance
  );

  scene.add(z);

  zombies.push(z);

  updateHUD();
}

function removeZombie(z){

  scene.remove(z);

  const index =
    zombies.indexOf(z);

  if(index>=0){
    zombies.splice(
      index,
      1
    );
  }

  score += 100;

  if(
    score % 1000 === 0
  ){
    showMessage(
      "WAVE " + wave +
      " SURVIVED"
    );
  }

  updateHUD();
}

/* =========================================================
   SHOOTING
========================================================= */

function shoot(){

  if(!started) return;

  if(reloadTimer>0) return;

  if(fireCooldown>0) return;

  if(ammo<=0){

    showMessage(
      "MAGAZINE EMPTY — PRESS R"
    );

    return;
  }

  ammo--;

  fireCooldown=.16;

  /*
    Recoil
  */

  gun.position.z += .07;

  setTimeout(()=>{
    if(gun){
      gun.position.z -= .07;
    }
  },70);

  /*
    Raycast from camera center.
  */

  const raycaster =
    new THREE.Raycaster();

  raycaster.setFromCamera(
    new THREE.Vector2(0,0),
    camera
  );

  const targets = [];

  zombies.forEach(z=>{
    z.traverse(obj=>{
      if(obj.isMesh){
        targets.push(obj);
      }
    });
  });

  const hits =
    raycaster.intersectObjects(
      targets,
      false
    );

  if(hits.length){

    let object =
      hits[0].object;

    let target=null;

    while(
      object &&
      object.parent
    ){

      if(
        zombies.includes(object)
      ){
        target=object;
        break;
      }

      object=object.parent;
    }

    if(target){

      target.userData.hp -= 50;

      /*
        Hit feedback
      */

      target.scale.multiplyScalar(
        .96
      );

      if(
        target.userData.hp<=0
      ){
        removeZombie(target);
      }
    }
  }

  createMuzzleFlash();
  updateHUD();
}

function createMuzzleFlash(){

  const light =
    new THREE.PointLight(
      0xffd36b,
      7,
      4
    );

  light.position.set(
    .31,
    -.22,
    -1.05
  );

  gun.add(light);

  setTimeout(()=>{
    gun.remove(light);
  },45);
}

function reload(){

  if(reloadTimer>0) return;

  if(ammo>=MAX_AMMO) return;

  if(reserveAmmo<=0){

    showMessage(
      "NO AMMUNITION"
    );

    return;
  }

  reloadTimer=1.15;

  showMessage(
    "RELOADING..."
  );

  setTimeout(()=>{

    const needed =
      MAX_AMMO-ammo;

    const amount =
      Math.min(
        needed,
        reserveAmmo
      );

    ammo += amount;
    reserveAmmo -= amount;

    reloadTimer=0;

    updateHUD();

  },1150);
}

/* =========================================================
   PLAYER DAMAGE
========================================================= */

function damagePlayer(amount){

  hp -= amount;

  hp =
    Math.max(
      0,
      hp
    );

  damageFlash.style.opacity="1";

  setTimeout(()=>{
    damageFlash.style.opacity="0";
  },100);

  updateHUD();

  if(hp<=0){

    hp=100;

    ammo=MAX_AMMO;

    player.position.set(
      0,
      0,
      8
    );

    score=Math.max(
      0,
      score-500
    );

    showMessage(
      "YOU DIED — RESPAWN"
    );

    updateHUD();
  }
}

/* =========================================================
   MOVEMENT
========================================================= */

function updatePlayer(dt){

  const direction =
    new THREE.Vector3();

  if(keys["KeyW"])
    direction.z-=1;

  if(keys["KeyS"])
    direction.z+=1;

  if(keys["KeyA"])
    direction.x-=1;

  if(keys["KeyD"])
    direction.x+=1;

  if(direction.length()>0){

    direction.normalize();

    const speed =
      PLAYER_SPEED*dt;

    direction.applyAxisAngle(
      new THREE.Vector3(0,1,0),
      yaw
    );

    player.position.addScaledVector(
      direction,
      speed
    );
  }

  /*
    Keep player inside map.
  */

  player.position.x =
    THREE.MathUtils.clamp(
      player.position.x,
      -105,
      105
    );

  player.position.z =
    THREE.MathUtils.clamp(
      player.position.z,
      -105,
      105
    );

  camera.rotation.order="YXZ";

  camera.rotation.y=0;
  camera.rotation.x=pitch;

  player.rotation.y=yaw;
}

/* =========================================================
   ZOMBIE AI
========================================================= */

function updateZombies(dt){

  zombies.forEach(z=>{

    const direction =
      new THREE.Vector3()
        .subVectors(
          player.position,
          z.position
        );

    const distance =
      direction.length();

    direction.y=0;

    if(distance>1.45){

      direction.normalize();

      z.position.addScaledVector(
        direction,
        z.userData.speed*dt
      );

      z.lookAt(
        player.position.x,
        z.position.y,
        player.position.z
      );

      /*
        Walking animation
      */

      z.position.y =
        Math.sin(
          performance.now()*.008 +
          z.userData.phase
        )*.018;

    }else{

      z.userData.attackCooldown -= dt;

      if(
        z.userData.attackCooldown<=0
      ){

        damagePlayer(
          7+Math.random()*5
        );

        z.userData.attackCooldown=.8;
      }
    }
  });
}

/* =========================================================
   WAVE SYSTEM
========================================================= */

function updateWave(dt){

  spawnTimer -= dt;

  const target =
    Math.min(
      5 + wave*2,
      28
    );

  if(
    spawnTimer<=0 &&
    zombies.length<target
  ){

    spawnZombie();

    spawnTimer =
      Math.max(
        .5,
        2.4-wave*.12
      );
  }

  if(
    zombies.length===0 &&
    score>0
  ){

    wave++;

    showMessage(
      "WAVE " + wave
    );

    for(
      let i=0;
      i<Math.min(
        3+wave,
        10
      );
      i++
    ){
      spawnZombie();
    }
  }
}

/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  hpText.textContent =
    Math.round(hp);

  healthBar.style.width =
    hp+"%";

  ammoText.textContent =
    ammo;

  waveText.textContent =
    wave;

  zombieText.textContent =
    zombies.length;

  scoreText.textContent =
    score;
}

function showMessage(text){

  message.textContent=text;

  message.style.opacity="1";

  clearTimeout(
    showMessage.timer
  );

  showMessage.timer =
    setTimeout(()=>{
      message.style.opacity="0";
    },1700);
}

/* =========================================================
   CONSOLE
========================================================= */

function openConsole(){

  consoleBox.classList.add("open");

  consoleInput.focus();

  logConsole(
    "ALFA ZOMBIE COMMAND CONSOLE"
  );

  logConsole(
    'Ketik "help" untuk daftar command.'
  );
}

function closeConsole(){

  consoleBox.classList.remove(
    "open"
  );

  if(started){
    renderer.domElement.requestPointerLock();
  }
}

function logConsole(text){

  const line =
    document.createElement("div");

  line.textContent =
    "> " + text;

  consoleOutput.appendChild(
    line
  );

  consoleOutput.scrollTop =
    consoleOutput.scrollHeight;
}

function runCommand(){

  const command =
    consoleInput.value
      .trim()
      .toLowerCase();

  if(!command) return;

  logConsole(command);

  consoleInput.value="";

  const parts =
    command.split(/\s+/);

  const cmd=parts[0];

  switch(cmd){

    case "help":

      logConsole(
        "help | ammo | heal | god | spawn zombie | clear | speed"
      );

      break;

    case "ammo":

      reserveAmmo=999;

      ammo=MAX_AMMO;

      updateHUD();

      logConsole(
        "AMMUNITION REFILLED."
      );

      break;

    case "heal":

      hp=100;

      updateHUD();

      logConsole(
        "PLAYER HP RESTORED."
      );

      break;

    case "god":

      window.godMode =
        !window.godMode;

      logConsole(
        "GOD MODE: " +
        (window.godMode ?
          "ON":"OFF")
      );

      break;

    case "spawn":

      if(
        parts[1]==="zombie"
      ){

        spawnZombie();

        logConsole(
          "ZOMBIE SPAWNED."
        );

      }else{

        logConsole(
          "Usage: spawn zombie"
        );
      }

      break;

    case "clear":

      zombies
        .slice()
        .forEach(removeZombie);

      logConsole(
        "ALL ZOMBIES CLEARED."
      );

      break;

    case "speed":

      if(parts[1]){

        const value =
          parseFloat(
            parts[1]
          );

        if(
          Number.isFinite(value)
        ){

          window.playerSpeed =
            THREE.MathUtils.clamp(
              value,
              1,
              15
            );

          logConsole(
            "PLAYER SPEED = " +
            window.playerSpeed
          );

        }else{

          logConsole(
            "Invalid speed."
          );
        }

      }else{

        logConsole(
          "Usage: speed 5"
        );
      }

      break;

    default:

      logConsole(
        "Unknown command. Type help."
      );
  }
}

/* =========================================================
   INPUT
========================================================= */

window.addEventListener(
  "keydown",
  e=>{

    keys[e.code]=true;

    if(
      e.code==="KeyR"
    ){
      reload();
    }

    if(
      e.code==="Backquote"
    ){

      if(
        consoleBox.classList.contains(
          "open"
        )
      ){
        closeConsole();
      }else{
        openConsole();
      }
    }
  }
);

window.addEventListener(
  "keyup",
  e=>{
    keys[e.code]=false;
  }
);

rendererSafeEvents();

function rendererSafeEvents(){

  document.addEventListener(
    "mousemove",
    e=>{

      if(
        !started ||
        !locked ||
        consoleBox.classList.contains(
          "open"
        )
      ) return;

      yaw -= e.movementX*.0022;

      pitch -= e.movementY*.0022;

      pitch =
        THREE.MathUtils.clamp(
          pitch,
          -1.35,
          1.35
        );
    }
  );

  document.addEventListener(
    "mousedown",
    e=>{

      if(
        e.button!==0
      ) return;

      if(
        consoleBox.classList.contains(
          "open"
        )
      ) return;

      if(
        started
      ){
        shoot();
      }
    }
  );
}

/* =========================================================
   POINTER LOCK
========================================================= */

document.addEventListener(
  "pointerlockchange",
  ()=>{
    locked =
      document.pointerLockElement ===
      renderer.domElement;
  }
);

/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
  "startBtn"
).addEventListener(
  "click",
  ()=>{

    started=true;

    startScreen.style.display="none";

    renderer.domElement.requestPointerLock();

    showMessage(
      "SURVIVE THE NIGHT"
    );
  }
);

document.getElementById(
  "consoleButton"
).addEventListener(
  "click",
  openConsole
);

document.getElementById(
  "closeConsole"
).addEventListener(
  "click",
  closeConsole
);

document.getElementById(
  "consoleRun"
).addEventListener(
  "click",
  runCommand
);

consoleInput.addEventListener(
  "keydown",
  e=>{
    if(e.key==="Enter"){
      runCommand();
    }
  }
);

document.getElementById(
  "shootBtn"
).addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    shoot();
  }
);

document.getElementById(
  "reloadBtn"
).addEventListener(
  "click",
  reload
);

/* =========================================================
   ANIMATION
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  const dt =
    Math.min(
      clock.getDelta(),
      .05
    );

  if(
    started &&
    !consoleBox.classList.contains(
      "open"
    )
  ){

    fireCooldown =
      Math.max(
        0,
        fireCooldown-dt
      );

    updatePlayer(dt);

    updateZombies(dt);

    updateWave(dt);
  }

  renderer.render(
    scene,
    camera
  );
}

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);

/* =========================================================
   START
========================================================= */

window.godMode=false;

window.playerSpeed=
  PLAYER_SPEED;

init();

</script>

</body>
</html>
