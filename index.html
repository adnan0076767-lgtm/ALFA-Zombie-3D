<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ALFA ZOMBIE 3D V4 | REALISTIC CITY SURVIVAL</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111827;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  user-select:none;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:20;
}

#topbar{
  position:absolute;
  top:14px;
  left:14px;
  right:14px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.panel{
  background:rgba(7,12,20,.78);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 8px 30px rgba(0,0,0,.3);
  backdrop-filter:blur(8px);
  border-radius:12px;
  padding:10px 13px;
}

#stats{
  min-width:210px;
}

.stat{
  margin:3px 0;
  font-size:13px;
  letter-spacing:.4px;
}

.stat b{
  color:#67e8f9;
}

#weaponHud{
  text-align:right;
  min-width:190px;
}

#ammo{
  font-size:30px;
  font-weight:900;
}

#ammo small{
  font-size:14px;
  color:#9ca3af;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:28px;
  height:28px;
  transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:rgba(255,255,255,.9);
  box-shadow:0 0 5px rgba(0,0,0,.8);
}

#crosshair:before{
  width:2px;
  height:28px;
  left:13px;
  top:0;
}

#crosshair:after{
  width:28px;
  height:2px;
  left:0;
  top:13px;
}

#crossDot{
  position:absolute;
  width:4px;
  height:4px;
  border-radius:50%;
  background:#ef4444;
  left:12px;
  top:12px;
}

#message{
  position:absolute;
  left:50%;
  top:16%;
  transform:translateX(-50%);
  font-weight:900;
  font-size:24px;
  text-shadow:0 3px 12px #000;
  opacity:0;
  transition:.2s;
  white-space:nowrap;
}

#damageFlash{
  position:absolute;
  inset:0;
  background:rgba(255,0,0,.25);
  opacity:0;
}

#hitMarker{
  position:absolute;
  left:50%;
  top:50%;
  width:30px;
  height:30px;
  transform:translate(-50%,-50%);
  opacity:0;
}

#hitMarker:before,
#hitMarker:after{
  content:"";
  position:absolute;
  width:28px;
  height:2px;
  top:14px;
  left:1px;
  background:white;
}

#hitMarker:before{transform:rotate(45deg)}
#hitMarker:after{transform:rotate(-45deg)}

#console{
  position:fixed;
  left:20px;
  bottom:20px;
  width:min(520px,calc(100vw - 40px));
  z-index:50;
  display:none;
  pointer-events:auto;
}

#consoleBox{
  background:rgba(3,7,18,.94);
  border:1px solid #22d3ee;
  border-radius:12px;
  padding:12px;
  box-shadow:0 0 35px rgba(34,211,238,.2);
}

#consoleOutput{
  height:180px;
  overflow:auto;
  font:12px Consolas,monospace;
  color:#67e8f9;
  white-space:pre-wrap;
  margin-bottom:8px;
}

#consoleInput{
  width:100%;
  padding:10px;
  background:#020617;
  color:#fff;
  border:1px solid #334155;
  border-radius:7px;
  outline:none;
}

#mobile{
  position:fixed;
  inset:0;
  z-index:30;
  pointer-events:none;
}

.touchBtn{
  pointer-events:auto;
  position:absolute;
  border:1px solid rgba(255,255,255,.3);
  background:rgba(5,10,20,.55);
  color:white;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:900;
  backdrop-filter:blur(5px);
}

#fireBtn{
  right:25px;
  bottom:35px;
  width:86px;
  height:86px;
  background:rgba(180,20,20,.62);
}

#reloadBtn{
  right:125px;
  bottom:45px;
  width:58px;
  height:58px;
}

#sprintBtn{
  left:130px;
  bottom:32px;
  width:60px;
  height:60px;
}

#crouchBtn{
  left:205px;
  bottom:32px;
  width:60px;
  height:60px;
}

#joy{
  position:absolute;
  left:25px;
  bottom:25px;
  width:105px;
  height:105px;
  border:2px solid rgba(255,255,255,.22);
  border-radius:50%;
  pointer-events:auto;
}

#joyKnob{
  position:absolute;
  width:45px;
  height:45px;
  left:28px;
  top:28px;
  border-radius:50%;
  background:rgba(255,255,255,.25);
}

#startScreen{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    linear-gradient(rgba(2,6,23,.62),rgba(2,6,23,.82)),
    radial-gradient(circle at center,#334155,#020617 75%);
}

.startCard{
  width:min(600px,92vw);
  padding:34px;
  border-radius:20px;
  background:rgba(2,6,23,.82);
  border:1px solid rgba(103,232,249,.4);
  box-shadow:0 0 80px rgba(0,0,0,.7);
  text-align:center;
}

.startCard h1{
  font-size:clamp(30px,7vw,62px);
  letter-spacing:3px;
  margin-bottom:8px;
}

.startCard h1 span{
  color:#22d3ee;
}

.startCard p{
  color:#cbd5e1;
  line-height:1.7;
  margin-bottom:20px;
}

#startBtn{
  border:0;
  padding:15px 35px;
  border-radius:10px;
  color:#001018;
  background:#22d3ee;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 0 30px rgba(34,211,238,.35);
}

#startBtn:hover{
  background:#67e8f9;
}

#loading{
  margin-top:15px;
  color:#67e8f9;
  display:none;
}

@media(max-width:700px){
  #topbar{
    top:8px;
    left:8px;
    right:8px;
  }

  .panel{
    padding:7px 9px;
  }

  #stats{
    min-width:145px;
  }

  .stat{
    font-size:10px;
  }

  #ammo{
    font-size:22px;
  }

  #message{
    font-size:18px;
  }
}

@media(min-width:701px){
  #mobile{
    display:none;
  }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
"use strict";

/* =========================================================
   ALFA ZOMBIE 3D V4
   ========================================================= */

let scene;
let camera;
let renderer;
let clock;

let player;
let weapon;

let zombies=[];
let bullets=[];
let shells=[];
let particles=[];
let pickups=[];
let buildings=[];
let cars=[];

let started=false;
let gameOver=false;

let hp=100;
let stamina=100;
let ammo=12;
let reserveAmmo=72;
let score=0;
let wave=1;

let godMode=false;
let playerSpeed=5;
let spawnTimer=0;
let waveKills=0;
let waveTarget=8;

let yaw=0;
let pitch=0;

let velocityY=0;
let grounded=true;

let sprinting=false;
let crouching=false;

let keys={};

let mouseDown=false;

let audioCtx=null;

let muzzleLight;
let muzzleFlashTimer=0;

let lastShot=0;
let recoil=0;
let weaponKick=0;

let footstepsTimer=0;

let joyX=0;
let joyY=0;

const raycaster=new THREE.Raycaster();
const centerScreen=new THREE.Vector2(0,0);

/* =========================================================
   DOM
   ========================================================= */

const $=id=>document.getElementById(id);

const hpEl=$("hp");
const staminaEl=$("stamina");
const waveEl=$("wave");
const zcountEl=$("zcount");
const scoreEl=$("score");
const ammoEl=$("ammo");
const messageEl=$("message");
const damageFlash=$("damageFlash");
const hitMarker=$("hitMarker");

function updateHUD(){
  hpEl.textContent=Math.max(0,Math.round(hp));
  staminaEl.textContent=Math.round(stamina);
  waveEl.textContent=wave;
  zcountEl.textContent=zombies.length;
  scoreEl.textContent=score;
  ammoEl.innerHTML=ammo+' <small>/ '+reserveAmmo+'</small>';
}

/* =========================================================
   AUDIO
   ========================================================= */

function initAudio(){
  if(audioCtx) return;

  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  }catch(e){}
}

function soundGun(){
  if(!audioCtx) return;

  const now=audioCtx.currentTime;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="sawtooth";
  osc.frequency.setValueAtTime(150,now);
  osc.frequency.exponentialRampToValueAtTime(55,now+.11);

  gain.gain.setValueAtTime(.0001,now);
  gain.gain.exponentialRampToValueAtTime(.55,now+.004);
  gain.gain.exponentialRampToValueAtTime(.0001,now+.13);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+.14);

  const noise=audioCtx.createBufferSource();
  const buffer=audioCtx.createBuffer(
    1,
    audioCtx.sampleRate*.08,
    audioCtx.sampleRate
  );

  const data=buffer.getChannelData(0);

  for(let i=0;i<data.length;i++){
    data[i]=(Math.random()*2-1)*(1-i/data.length);
  }

  noise.buffer=buffer;

  const ng=audioCtx.createGain();
  ng.gain.value=.35;

  noise.connect(ng);
  ng.connect(audioCtx.destination);

  noise.start(now);
}

function soundReload(){
  if(!audioCtx) return;

  const now=audioCtx.currentTime;

  [0,.18,.36].forEach((delay,i)=>{
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type="square";
    osc.frequency.value=190+i*55;

    gain.gain.setValueAtTime(.0001,now+delay);
    gain.gain.exponentialRampToValueAtTime(.12,now+delay+.01);
    gain.gain.exponentialRampToValueAtTime(.0001,now+delay+.07);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now+delay);
    osc.stop(now+delay+.08);
  });
}

function soundEmpty(){
  if(!audioCtx) return;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="square";
  osc.frequency.value=90;

  gain.gain.value=.09;

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime+.08);
}

function soundFootstep(){
  if(!audioCtx) return;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="triangle";
  osc.frequency.value=65+Math.random()*20;

  gain.gain.setValueAtTime(.0001,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.07,audioCtx.currentTime+.01);
  gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.08);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime+.09);
}

function soundZombie(){
  if(!audioCtx) return;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="sawtooth";
  osc.frequency.value=45+Math.random()*30;

  gain.gain.setValueAtTime(.0001,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.05,audioCtx.currentTime+.05);
  gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.5);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime+.52);
}

/* =========================================================
   BASIC MATERIALS
   ========================================================= */

function mat(color,rough=.8,metal=0){
  return new THREE.MeshStandardMaterial({
    color:color,
    roughness:rough,
    metalness:metal
  });
}

const MAT={
  road:mat(0x252a30,1),
  asphalt:mat(0x30353a,1),
  concrete:mat(0x777d82,1),
  sidewalk:mat(0x9ca3a8,.9),
  white:mat(0xe5e7eb,.7),
  black:mat(0x101418,.65),
  glass:mat(0x193b52,.25,.3),
  glass2:mat(0x316b86,.22,.25),
  brick:mat(0x765d54,.9),
  building:mat(0xb7b2a8,.9),
  building2:mat(0x8d969e,.9),
  blue:mat(0x3f6378,.65),
  yellow:mat(0xd8a928,.7),
  red:mat(0xa92c2c,.65),
  green:mat(0x46694e,.85),
  skin:mat(0x8b6a5a,.95),
  zombieSkin:mat(0x70806f,1),
  zombieDark:mat(0x3f4d42,1),
  blood:mat(0x8e1111,.8),
  metal:mat(0x30353a,.4,.7),
  gun:mat(0x17191c,.3,.8),
  gunGrip:mat(0x24201d,.9),
  casing:mat(0xc58b32,.3,.7)
};

/* =========================================================
   SCENE
   ========================================================= */

function initScene(){

  scene=new THREE.Scene();

  scene.background=new THREE.Color(0x9fb5c5);

  scene.fog=new THREE.Fog(0x9fb5c5,55,260);

  camera=new THREE.PerspectiveCamera(
    72,
    innerWidth/innerHeight,
    .05,
    500
  );

  camera.rotation.order="YXZ";

  renderer=new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });

  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));

  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;

  document.body.appendChild(renderer.domElement);

  clock=new THREE.Clock();

  createLights();
  createWorld();
  createWeapon();

  player=new THREE.Object3D();
  player.position.set(0,1.7,12);

  scene.add(player);
  player.add(camera);

  camera.position.set(0,0,0);

  window.addEventListener("resize",onResize);

  animate();
}

/* =========================================================
   LIGHT
   ========================================================= */

function createLights(){

  const hemi=new THREE.HemisphereLight(
    0xdceeff,
    0x52606b,
    1.8
  );

  scene.add(hemi);

  const sun=new THREE.DirectionalLight(
    0xfff3d1,
    2.5
  );

  sun.position.set(60,100,30);
  sun.castShadow=true;

  sun.shadow.mapSize.width=2048;
  sun.shadow.mapSize.height=2048;

  sun.shadow.camera.left=-120;
  sun.shadow.camera.right=120;
  sun.shadow.camera.top=120;
  sun.shadow.camera.bottom=-120;

  scene.add(sun);
}

/* =========================================================
   WORLD
   ========================================================= */

function createWorld(){

  const ground=new THREE.Mesh(
    new THREE.PlaneGeometry(500,500),
    MAT.concrete
  );

  ground.rotation.x=-Math.PI/2;
  ground.receiveShadow=true;

  scene.add(ground);

  createRoad(0,0,18,500,true);
  createRoad(0,0,500,18,true);

  createRoad(-55,0,16,500,true);
  createRoad(55,0,16,500,true);

  createRoad(0,-60,500,15,true);
  createRoad(0,60,500,15,true);

  createRoad(0,0,10,160,false,90);

  createBuildings();
  createCars();
  createStreetLights();
  createRoadDetails();
  createCoverObjects();
}

function createRoad(x,z,w,d,vertical=true,rot=0){

  const road=new THREE.Mesh(
    new THREE.BoxGeometry(
      vertical?w:d,
      .08,
      vertical?d:w
    ),
    MAT.road
  );

  road.position.set(x,.02,z);
  road.rotation.y=rot;
  road.receiveShadow=true;

  scene.add(road);

  if(vertical){

    for(let p=-d/2+8;p<d/2;p+=12){

      const line=new THREE.Mesh(
        new THREE.BoxGeometry(.25,.035,5),
        MAT.yellow
      );

      line.position.set(x,.075,z+p);

      scene.add(line);
    }

  }else{

    for(let p=-d/2+8;p<d/2;p+=12){

      const line=new THREE.Mesh(
        new THREE.BoxGeometry(5,.035,.25),
        MAT.yellow
      );

      line.position.set(x+p,.075,z);

      scene.add(line);
    }
  }
}

/* =========================================================
   CLEAR BUILDING SHAPES
   ========================================================= */

function createBuildings(){

  const layouts=[
    [-38,-35,25,28,10],
    [38,-35,25,28,14],
    [-38,35,25,28,16],
    [38,35,25,28,11],

    [-82,-30,28,35,18],
    [82,-30,28,35,12],
    [-82,30,28,35,15],
    [82,30,28,35,20],

    [-125,-70,35,30,17],
    [125,-70,35,30,14],
    [-125,70,35,30,19],
    [125,70,35,30,13],

    [-32,-105,30,28,9],
    [32,-105,30,28,12],
    [-32,105,30,28,10],
    [32,105,30,28,15]
  ];

  layouts.forEach((b,i)=>{
    createBuilding(
      b[0],
      b[1],
      b[2],
      b[3],
      b[4],
      i
    );
  });
}

function createBuilding(x,z,w,d,h,index){

  const group=new THREE.Group();

  group.position.set(x,0,z);

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    index%2?MAT.building:MAT.building2
  );

  body.position.y=h/2;
  body.castShadow=true;
  body.receiveShadow=true;

  group.add(body);

  /* roof */
  const roof=new THREE.Mesh(
    new THREE.BoxGeometry(w+1,.5,d+1),
    MAT.black
  );

  roof.position.y=h+.25;

  group.add(roof);

  /* entrance */
  const door=new THREE.Mesh(
    new THREE.BoxGeometry(2.5,4,.15),
    MAT.black
  );

  door.position.set(0,2,d/2+.08);

  group.add(door);

  const doorFrame=new THREE.Mesh(
    new THREE.BoxGeometry(3,4.5,.18),
    MAT.white
  );

  doorFrame.position.set(0,2.2,d/2+.02);

  group.add(doorFrame);

  /* windows */
  const floors=Math.max(2,Math.floor(h/4));

  for(let fy=1;fy<floors;fy++){

    const y=fy*3.5;

    for(let wx=-w/2+3;wx<w/2-1;wx+=5){

      createWindow(group,wx,y,d/2+.09);
      createWindow(group,wx,y,-d/2-.09);

    }
  }

  /* side windows */
  for(let fy=1;fy<floors;fy++){

    const y=fy*3.5;

    for(let wz=-d/2+4;wz<d/2-2;wz+=6){

      const win=createWindowSide(group,-w/2-.09,y,wz);
      const win2=createWindowSide(group,w/2+.09,y,wz);

    }
  }

  /* balcony */
  if(index%3===0){

    const balcony=new THREE.Mesh(
      new THREE.BoxGeometry(7,.25,2),
      MAT.concrete
    );

    balcony.position.set(0,5,d/2+1);

    group.add(balcony);

    const railMat=MAT.black;

    for(let i=-3;i<=3;i+=1.5){

      const post=new THREE.Mesh(
        new THREE.BoxGeometry(.12,1.2,.12),
        railMat
      );

      post.position.set(i,5.65,d/2+1.8);

      group.add(post);
    }
  }

  /* sign */
  const sign=new THREE.Mesh(
    new THREE.BoxGeometry(7,1.3,.15),
    index%2?MAT.blue:MAT.red
  );

  sign.position.set(0,h-2,d/2+.12);

  group.add(sign);

  buildings.push(group);
  scene.add(group);
}

function createWindow(parent,x,y,z){

  const frame=new THREE.Mesh(
    new THREE.BoxGeometry(3.1,2.2,.14),
    MAT.black
  );

  frame.position.set(x,y,z);

  parent.add(frame);

  const glass=new THREE.Mesh(
    new THREE.BoxGeometry(2.5,1.65,.08),
    MAT.glass
  );

  glass.position.set(x,y,z+(z>0?.09:-.09));

/* =========================================================
   SHOOT
   ========================================================= */

function shoot(){

  if(gameOver || !started) return;

  const now=performance.now();

  if(now-lastShot<150) return;

  lastShot=now;

  if(ammo<=0){

    soundEmpty();
    showMessage("EMPTY");
    return;
  }

  ammo--;

  soundGun();

  weaponKick=.12;
  recoil=.035;

  weapon.userData.slide.position.z=.07;

  setTimeout(()=>{
    if(weapon && weapon.userData.slide){
      weapon.userData.slide.position.z=0;
    }
  },65);

  muzzleFlashTimer=.06;
  muzzleLight.intensity=6;

  ejectShell();
  muzzleSmoke();

  /* raycast */
  raycaster.setFromCamera(centerScreen,camera);

  const targets=[];

  zombies.forEach(z=>{
    z.traverse(o=>{
      if(o.isMesh){
        targets.push(o);
      }
    });
  });

  const hits=raycaster.intersectObjects(targets,false);

  if(hits.length){

    let obj=hits[0].object;
    let z=obj.userData.zombie;

    if(!z){

      let p=obj.parent;

      while(p && !z){
        if(p.userData && p.userData.hp!==undefined){
          z=p;
          break;
        }
        p=p.parent;
      }
    }

    if(z && !z.userData.dead){

      const isHead=obj.userData.part==="head";

      const damage=isHead?150:40;

      z.userData.hp-=damage;

      z.userData.hitFlash=.12;

      /* reaction */
      if(z.userData.leftArm){
        z.userData.leftArm.rotation.x=-.4;
        z.userData.rightArm.rotation.x=-.4;
      }

      bloodBurst(hits[0].point);

      showHitMarker(isHead);

      if(z.userData.hp<=0){
        killZombie(z,isHead);
      }

      updateHealthBar(z);
    }
  }

  updateHUD();
}

function showHitMarker(head){

  hitMarker.style.opacity="1";
  hitMarker.style.transform=
    "translate(-50%,-50%) scale("+(head?1.5:1)+")";

  setTimeout(()=>{
    hitMarker.style.opacity="0";
  },100);

  if(head) showMessage("HEADSHOT");
}

function killZombie(z,head){

  if(z.userData.dead) return;

  z.userData.dead=true;
  z.userData.deathTime=0;

  score+=z.userData.score+(head?50:0);
  waveKills++;

  bloodBurst(
    z.position.clone().add(new THREE.Vector3(0,2.5,0))
  );

  updateHUD();
}

/* =========================================================
   HEALTH BAR
   ========================================================= */

function updateHealthBar(z){

  const ratio=Math.max(
    0,
    z.userData.hp/z.userData.maxHp
  );

  z.userData.healthBar.scale.x=ratio;

  z.userData.healthBar.position.x=
    -(1-ratio)*.5;
}

/* =========================================================
   ZOMBIE UPDATE
   ========================================================= */

function updateZombies(dt){

  for(let i=zombies.length-1;i>=0;i--){

    const z=zombies[i];

    if(!z) continue;

    if(z.userData.dead){

      z.userData.deathTime+=dt;

      z.rotation.z=
        Math.min(
          Math.PI/2,
          z.userData.deathTime*4
        );

      z.position.y=
        Math.max(
          0,
          1.2-z.userData.deathTime*1.4
        );

      if(z.userData.deathTime>1.5){

        createPickup(z.position);

        scene.remove(z);

        zombies.splice(i,1);
      }

      continue;
    }

    const dx=player.position.x-z.position.x;
    const dz=player.position.z-z.position.z;

    const dist=Math.sqrt(dx*dx+dz*dz);

    if(dist>1.7){

      let nx=dx/dist;
      let nz=dz/dist;

      /* slight wandering */
      const side=Math.sin(
        z.userData.walkTime*.8+
        z.position.x
      )*.12;

      nx+=-nz*side;
      nz+=nx*side;

      const len=Math.sqrt(nx*nx+nz*nz);

      nx/=len;
      nz/=len;

      z.position.x+=nx*z.userData.speed*dt;
      z.position.z+=nz*z.userData.speed*dt;

      z.rotation.y=Math.atan2(nx,nz);

      z.userData.walkTime+=dt*5;

      const swing=Math.sin(z.userData.walkTime)*.55;

      z.userData.leftArm.rotation.x=swing;
      z.userData.rightArm.rotation.x=-swing;

      z.userData.leftLeg.rotation.x=-swing*.7;
      z.userData.rightLeg.rotation.x=swing*.7;

    }else{

      z.userData.attackCooldown-=dt;

      if(z.userData.attackCooldown<=0){

        z.userData.attackCooldown=1.1;

        if(!godMode){
          takeDamage(
            z.userData.type==="tank"?14:
            z.userData.type==="fast"?9:7
          );
        }

        soundZombie();
      }
    }

    /* face camera */
    if(z.userData.hitFlash>0){

      z.userData.hitFlash-=dt;

      z.traverse(o=>{
        if(o.isMesh && o.material){
          o.material.emissive=new THREE.Color(0x551111);
        }
      });

    }else{

      z.traverse(o=>{
        if(o.isMesh && o.material){
          o.material.emissive=new THREE.Color(0x000000);
        }
      });
    }
  }
}

/* =========================================================
   PICKUPS
   ========================================================= */

function createPickup(pos){

  const type=Math.random()<.65?"ammo":"medkit";

  const group=new THREE.Group();

  group.position.copy(pos);
  group.position.y=.5;

  if(type==="ammo"){

    const box=new THREE.Mesh(
      new THREE.BoxGeometry(.55,.35,.8),
      MAT.yellow
    );

    group.add(box);

    const label=new THREE.Mesh(
      new THREE.BoxGeometry(.35,.12,.02),
      MAT.black
    );

    label.position.set(0,.08,.41);

    group.add(label);

  }else{

    const box=new THREE.Mesh(
      new THREE.BoxGeometry(.7,.45,.7),
      MAT.white
    );

    group.add(box);

    const plus1=new THREE.Mesh(
      new THREE.BoxGeometry(.12,.5,.05),
      MAT.red
    );

    const plus2=new THREE.Mesh(
      new THREE.BoxGeometry(.5,.12,.05),
      MAT.red
    );

    plus1.position.z=.37;
    plus2.position.z=.38;

    group.add(plus1,plus2);
  }

  group.userData={
    type:type,
    life:60
  };

  scene.add(group);
  pickups.push(group);
}

function updatePickups(dt){

  for(let i=pickups.length-1;i>=0;i--){

    const p=pickups[i];

    p.userData.life-=dt;

    p.rotation.y+=dt*1.5;
    p.position.y=.5+Math.sin(
      performance.now()*.003+i
    )*.12;

    if(
      p.position.distanceTo(player.position)<2
    ){

      if(p.userData.type==="ammo"){
        reserveAmmo+=24;
        showMessage("+24 AMMO");
      }else{
        hp=Math.min(100,hp+30);
        showMessage("+30 HP");
      }

      scene.remove(p);
      pickups.splice(i,1);
      updateHUD();
      continue;
    }

    if(p.userData.life<=0){

      scene.remove(p);
      pickups.splice(i,1);
    }
  }
}

/* =========================================================
   DAMAGE
   ========================================================= */

function takeDamage(amount){

  hp-=amount;

  damageFlash.style.opacity=".7";

  setTimeout(()=>{
    damageFlash.style.opacity="0";
  },120);

  updateHUD();

  if(hp<=0){
    endGame();
  }
}

/* =========================================================
   MOVEMENT
   ========================================================= */

function updatePlayer(dt){

  if(gameOver) return;

  let forward=0;
  let side=0;

  if(keys["KeyW"]) forward+=1;
  if(keys["KeyS"]) forward-=1;
  if(keys["KeyA"]) side-=1;
  if(keys["KeyD"]) side+=1;

  forward+=-joyY;
  side+=joyX;

  const moving=Math.abs(forward)+Math.abs(side)>0.05;

  sprinting=
    (keys["ShiftLeft"]||
     keys["ShiftRight"]||
     sprinting) &&
    moving &&
    stamina>0 &&
    !crouching;

  if(sprinting){

    stamina-=25*dt;

  }else{

    stamina+=16*dt;
  }

  stamina=Math.max(0,Math.min(100,stamina));

  let speed=playerSpeed;

  if(sprinting) speed*=1.65;
  if(crouching) speed*=.45;

  const length=Math.sqrt(
    forward*forward+side*side
  );

  if(length>1){
    forward/=length;
    side/=length;
  }

  const sin=Math.sin(yaw);
  const cos=Math.cos(yaw);

  const dx=(side*cos+forward*sin)*speed*dt;
  const dz=(side*sin-forward*cos)*speed*dt;

  player.position.x+=dx;
  player.position.z+=dz;

  /* ground */
  if(!grounded){

    velocityY-=18*dt;
    player.position.y+=velocityY*dt;

    if(player.position.y<=1.15){

      player.position.y=1.15;
      grounded=true;
      velocityY=0;
    }
  }

  if(moving && grounded){

    footstepsTimer-=dt;

    if(footstepsTimer<=0){

      footstepsTimer=sprinting?.28:
        crouching?.55:.42;

      soundFootstep();
    }

  }else{
    footstepsTimer=0;
  }

  /* head bob */
  if(moving){

    const bobSpeed=sprinting?13:8;

    const bob=Math.sin(
      performance.now()*.001*bobSpeed
    )*(sprinting?.035:.018);

    camera.position.y=
      bob+
      (crouching?-.42:0);

  }else{

    camera.position.y=
      THREE.MathUtils.lerp(
        camera.position.y,
        crouching?-.42:0,
        .12
      );
  }

  /* weapon sway */
  weapon.rotation.y=
    THREE.MathUtils.lerp(
      weapon.rotation.y,
      -.03-side*.035,
      .08
    );

  weapon.rotation.x=
    THREE.MathUtils.lerp(
      weapon.rotation.x,
      -.04+forward*.025,
      .08
    );

  /* weapon recoil */
  weapon.position.z=
    THREE.MathUtils.lerp(
      weapon.position.z,
      -.72+weaponKick,
      .25
    );

  weaponKick*=.75;

  updateHUD();
}

/* =========================================================
   RELOAD
   ========================================================= */

function reload(){

  if(ammo>=12 || reserveAmmo<=0) return;

  const needed=12-ammo;

  const give=Math.min(
    needed,
    reserveAmmo
  );

  ammo+=give;
  reserveAmmo-=give;

  soundReload();

  showMessage("RELOAD");

  weapon.rotation.x=-.35;

  setTimeout(()=>{
    weapon.rotation.x=-.04;
  },350);

  updateHUD();
}

/* =========================================================
   CONSOLE
   ========================================================= */

function toggleConsole(){

  const con=$("console");

  if(con.style.display==="block"){

    con.style.display="none";

  }else{

    con.style.display="block";
    $("consoleInput").focus();
  }
}

function consolePrint(txt){

  const out=$("consoleOutput");

  out.textContent+="\n"+txt;
  out.scrollTop=out.scrollHeight;
}

function executeCommand(command){

  const cmd=command.trim().toLowerCase();

  if(!cmd) return;

  consolePrint("> "+cmd);

  if(cmd==="help"){

    consolePrint(
`COMMANDS:
help
status
ammo
heal
god
spawn zombie
spawn fast
spawn tank
clear
speed 5
give medkit
give weapon
night
day
wave`
    );

  }else if(cmd==="status"){

    consolePrint(
      "HP="+Math.round(hp)+
      " | AMMO="+ammo+
      " | RESERVE="+reserveAmmo+
      " | WAVE="+wave+
      " | SCORE="+score
    );

  }else if(cmd==="ammo"){

    ammo=12;
    reserveAmmo=999;

    consolePrint("AMMO MAX");

  }else if(cmd==="heal"){

    hp=100;

    consolePrint("HP RESTORED");

  }else if(cmd==="god"){

    godMode=!godMode;

    consolePrint(
      "GOD MODE: "+(godMode?"ON":"OFF")
    );

  }else if(cmd==="spawn zombie"){

    spawnZombie("normal");
    consolePrint("NORMAL ZOMBIE SPAWNED");

  }else if(cmd==="spawn fast"){

    spawnZombie("fast");
    consolePrint("FAST ZOMBIE SPAWNED");

  }else if(cmd==="spawn tank"){

    spawnZombie("tank");
    consolePrint("TANK ZOMBIE SPAWNED");

  }else if(cmd==="clear"){

    zombies.forEach(z=>scene.remove(z));
    zombies=[];

    consolePrint("ZOMBIES CLEARED");

  }else if(cmd.startsWith("speed")){

    const value=parseFloat(cmd.split(" ")[1]);

    if(!isNaN(value)){
      playerSpeed=Math.max(1,Math.min(30,value));
    }

    consolePrint("SPEED="+playerSpeed);

  }else if(cmd==="give medkit"){

    hp=100;

    consolePrint("MEDKIT USED");

  }else if(cmd==="give weapon"){

    ammo=12;
    reserveAmmo=999;

    consolePrint("WEAPON AMMO RESTORED");

  }else if(cmd==="night"){

    scene.background.set(0x050b16);
    scene.fog.color.set(0x08111c);

    consolePrint("NIGHT MODE");

  }else if(cmd==="day"){

    scene.background.set(0x9fb5c5);
    scene.fog.color.set(0x9fb5c5);

    consolePrint("DAY MODE");

  }else if(cmd==="wave"){

    wave++;
    spawnWave();

  }else{

    consolePrint("UNKNOWN COMMAND");
  }

  updateHUD();
}

/* =========================================================
   MESSAGE
   ========================================================= */

let messageTimeout;

function showMessage(txt){

  messageEl.textContent=txt;
  messageEl.style.opacity="1";

  clearTimeout(messageTimeout);

  messageTimeout=setTimeout(()=>{
    messageEl.style.opacity="0";
  },1000);
}

/* =========================================================
   MOUSE
   ========================================================= */

function lockPointer(){

  if(renderer.domElement.requestPointerLock){
    renderer.domElement.requestPointerLock();
  }
}

document.addEventListener("mousemove",e=>{

  if(
    document.pointerLockElement!==renderer.domElement
    || !started
    || gameOver
  ) return;

  yaw-=e.movementX*.0022;
  pitch-=e.movementY*.0022;

  pitch=Math.max(
    -1.35,
    Math.min(1.35,pitch)
  );

  player.rotation.y=yaw;
  camera.rotation.x=pitch;
});

rendererMouseSetup();

function rendererMouseSetup(){

  document.addEventListener("mousedown",e=>{

    if(!started || gameOver) return;

    if(e.button===0){

      if(
        document.pointerLockElement!==renderer.domElement
      ){
        lockPointer();
      }

      mouseDown=true;
      shoot();
    }
  });

  document.addEventListener("mouseup",e=>{
    if(e.button===0) mouseDown=false;
  });
}

/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener("keydown",e=>{

  keys[e.code]=true;

  if(e.code==="Backquote"){
    e.preventDefault();
    toggleConsole();
  }

  if(e.code==="KeyR"){
    reload();
  }

  if(e.code==="KeyC"){
    crouching=!crouching;
  }

  if(e.code==="Space" && grounded){

    grounded=false;
    velocityY=7;
  }
});

document.addEventListener("keyup",e=>{
  keys[e.code]=false;
});

/* =========================================================
   CONSOLE INPUT
   ========================================================= */

$("consoleInput").addEventListener("keydown",e=>{

  if(e.key==="Enter"){

    executeCommand(e.target.value);
    e.target.value="";
  }

  if(e.key==="Escape"){
    toggleConsole();
  }
});

/* =========================================================
   MOBILE
   ========================================================= */

$("fireBtn").addEventListener("touchstart",e=>{
  e.preventDefault();
  shoot();
},{passive:false});

$("reloadBtn").addEventListener("touchstart",e=>{
  e.preventDefault();
  reload();
},{passive:false});

$("sprintBtn").addEventListener("touchstart",e=>{
  e.preventDefault();
  sprinting=true;
},{passive:false});

$("sprintBtn").addEventListener("touchend",e=>{
  e.preventDefault();
  sprinting=false;
},{passive:false});

$("crouchBtn").addEventListener("touchstart",e=>{
  e.preventDefault();
  crouching=!crouching;
},{passive:false});

const joy=$("joy");
const knob=$("joyKnob");

joy.addEventListener("touchmove",e=>{

  e.preventDefault();

  const touch=e.touches[0];

  const r=joy.getBoundingClientRect();

  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;

  let dx=touch.clientX-cx;
  let dy=touch.clientY-cy;

  const max=40;

  const len=Math.sqrt(dx*dx+dy*dy);

  if(len>max){

    dx=dx/len*max;
    dy=dy/len*max;
  }

  joyX=dx/max;
  joyY=dy/max;

  knob.style.transform=
    `translate(${dx}px,${dy}px)`;

},{passive:false});

joy.addEventListener("touchend",e=>{

  joyX=0;
  joyY=0;

  knob.style.transform="translate(0,0)";
});

/* =========================================================
   START
   ========================================================= */

$("startBtn").addEventListener("click",()=>{

  $("loading").style.display="block";

  initAudio();

  if(audioCtx && audioCtx.state==="suspended"){
    audioCtx.resume();
  }

  setTimeout(()=>{

    $("startScreen").style.display="none";

    started=true;

    spawnWave();

    lockPointer();

  },500);
});

/* =========================================================
   GAME OVER
   ========================================================= */

function endGame(){

  gameOver=true;

  showMessage("YOU DIED");

  setTimeout(()=>{

    const card=document.createElement("div");

    card.style.position="fixed";
    card.style.inset="0";
    card.style.zIndex="200";
    card.style.display="flex";
    card.style.alignItems="center";
    card.style.justifyContent="center";
    card.style.background="rgba(0,0,0,.75)";

    card.innerHTML=`
      <div style="
        background:#020617;
        border:1px solid #ef4444;
        border-radius:18px;
        padding:35px;
        text-align:center;
        min-width:280px;
      ">
        <h1 style="font-size:42px;color:#ef4444;margin-bottom:10px">
          YOU DIED
        </h1>
        <p style="margin-bottom:20px">
          SCORE: ${score}<br>
          WAVE: ${wave}
        </p>
        <button id="restartBtn" style="
          padding:13px 28px;
          border:0;
          border-radius:8px;
          background:#22d3ee;
          font-weight:900;
          cursor:pointer;
        ">RESTART</button>
      </div>
    `;

    document.body.appendChild(card);

    $("restartBtn").onclick=()=>{
      location.reload();
    };

  },800);
}

/* =========================================================
   WAVE LOGIC
   ========================================================= */

function updateWave(){

  if(
    zombies.length===0 &&
    waveKills>=waveTarget &&
    started &&
    !gameOver
  ){

    wave++;

    setTimeout(()=>{
      if(!gameOver) spawnWave();
    },1500);
  }
}

/* =========================================================
   PARTICLE UPDATE
   ========================================================= */

function updateParticles(dt){

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.userData.life-=dt;

    p.position.x+=p.userData.vx*dt;
    p.position.y+=p.userData.vy*dt;
    p.position.z+=p.userData.vz*dt;

    p.userData.vy-=7*dt;

    p.scale.multiplyScalar(.98);

    if(p.userData.life<=0){

      scene.remove(p);
      particles.splice(i,1);
    }
  }
}

/* =========================================================
   SHELL UPDATE
   ========================================================= */

function updateShells(dt){

  for(let i=shells.length-1;i>=0;i--){

    const s=shells[i];

    s.userData.life-=dt;

    s.position.x+=s.userData.vx*dt;
    s.position.y+=s.userData.vy*dt;
    s.position.z+=s.userData.vz*dt;

    s.userData.vy-=7*dt;

    s.rotation.x+=s.userData.spin*dt;
    s.rotation.z+=s.userData.spin*.7*dt;

    if(s.position.y<.1){

      s.position.y=.1;
      s.userData.vy*=-.25;
      s.userData.vx*=.8;
      s.userData.vz*=.8;
    }

    if(s.userData.life<=0){

      scene.remove(s);
      shells.splice(i,1);
    }
  }
}

/* =========================================================
   AUTO FIRE
   ========================================================= */

function updateAutoFire(){

  if(
    mouseDown &&
    document.pointerLockElement===renderer.domElement
  ){
    shoot();
  }
}

/* =========================================================
   MUZZLE
   ========================================================= */

function updateMuzzle(dt){

  if(muzzleFlashTimer>0){

    muzzleFlashTimer-=dt;

    muzzleLight.intensity=8;

  }else{

    muzzleLight.intensity=0;
  }
}

/* =========================================================
   RESPAWN POSITION / SIMPLE WORLD COLLISION
   ========================================================= */

function worldBounds(){

  player.position.x=
    Math.max(-230,Math.min(230,player.position.x));

  player.position.z=
    Math.max(-230,Math.min(230,player.position.z));
}

/* =========================================================
   RESIZE
   ========================================================= */

function onResize(){

  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );
}

/* =========================================================
   ANIMATION
   ========================================================= */

function animate(){

  requestAnimationFrame(animate);

  const dt=Math.min(
    .05,
    clock.getDelta()
  );

  if(started && !gameOver){

    updatePlayer(dt);
    updateZombies(dt);
    updatePickups(dt);
    updateParticles(dt);
    updateShells(dt);
    updateMuzzle(dt);
    updateAutoFire();

    worldBounds();
    updateWave();
  }

  renderer.render(scene,camera);
}

/* =========================================================
   INITIALIZE
   ========================================================= */

initScene();
updateHUD();

</script>
