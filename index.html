<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ALFA ZOMBIE 3D V5 | CHARACTER & WEAPON UPGRADE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111827;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:20;
}

#topbar{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.panel{
  background:rgba(4,10,18,.80);
  border:1px solid rgba(255,255,255,.18);
  border-radius:12px;
  padding:10px 13px;
  backdrop-filter:blur(8px);
  box-shadow:0 8px 28px rgba(0,0,0,.3);
}

.stat{
  font-size:13px;
  margin:3px 0;
}

.stat b{
  color:#67e8f9;
}

#stats{
  min-width:205px;
}

#weaponHud{
  min-width:235px;
  text-align:right;
}

#weaponName{
  font-size:12px;
  color:#94a3b8;
  letter-spacing:1px;
}

#ammo{
  font-size:29px;
  font-weight:900;
}

#ammo small{
  color:#94a3b8;
  font-size:13px;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:28px;
  height:28px;
  transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:white;
  box-shadow:0 1px 5px #000;
}

#crosshair:before{
  width:2px;
  height:28px;
  left:13px;
}

#crosshair:after{
  width:28px;
  height:2px;
  top:13px;
}

#dot{
  position:absolute;
  left:12px;
  top:12px;
  width:4px;
  height:4px;
  border-radius:50%;
  background:#ef4444;
}

#message{
  position:absolute;
  top:17%;
  left:50%;
  transform:translateX(-50%);
  font-size:24px;
  font-weight:900;
  text-shadow:0 3px 12px #000;
  opacity:0;
  transition:.15s;
  white-space:nowrap;
}

#damageFlash{
  position:absolute;
  inset:0;
  background:rgba(255,0,0,.25);
  opacity:0;
}

#hitMarker{
  position:absolute;
  width:28px;
  height:28px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  opacity:0;
}

#hitMarker:before,
#hitMarker:after{
  content:"";
  position:absolute;
  width:27px;
  height:2px;
  top:13px;
  background:white;
}

#hitMarker:before{
  transform:rotate(45deg);
}

#hitMarker:after{
  transform:rotate(-45deg);
}

#console{
  display:none;
  position:fixed;
  left:18px;
  bottom:18px;
  width:min(540px,calc(100vw - 36px));
  z-index:100;
  pointer-events:auto;
}

#consoleBox{
  background:rgba(2,6,23,.95);
  border:1px solid #22d3ee;
  border-radius:12px;
  padding:12px;
  box-shadow:0 0 35px rgba(34,211,238,.2);
}

#consoleOutput{
  height:190px;
  overflow:auto;
  color:#67e8f9;
  font:12px Consolas,monospace;
  white-space:pre-wrap;
  margin-bottom:8px;
}

#consoleInput{
  width:100%;
  background:#020617;
  border:1px solid #334155;
  color:#fff;
  border-radius:7px;
  padding:10px;
  outline:none;
}

#mobile{
  position:fixed;
  inset:0;
  z-index:40;
  pointer-events:none;
}

.touchBtn{
  position:absolute;
  pointer-events:auto;
  width:60px;
  height:60px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:900;
  background:rgba(4,10,18,.62);
  border:1px solid rgba(255,255,255,.3);
  backdrop-filter:blur(5px);
}

#fireBtn{
  width:88px;
  height:88px;
  right:22px;
  bottom:28px;
  background:rgba(150,20,20,.68);
}

#reloadBtn{
  right:125px;
  bottom:42px;
}

#switchBtn{
  right:125px;
  bottom:112px;
}

#sprintBtn{
  left:130px;
  bottom:28px;
}

#crouchBtn{
  left:205px;
  bottom:28px;
}

#joy{
  position:absolute;
  left:22px;
  bottom:22px;
  width:108px;
  height:108px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.22);
  pointer-events:auto;
}

#joyKnob{
  position:absolute;
  left:30px;
  top:30px;
  width:44px;
  height:44px;
  border-radius:50%;
  background:rgba(255,255,255,.25);
}

#startScreen{
  position:fixed;
  inset:0;
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,#475569 0,#111827 50%,#020617 100%);
}

.startCard{
  width:min(620px,92vw);
  padding:35px;
  border-radius:20px;
  text-align:center;
  background:rgba(2,6,23,.88);
  border:1px solid rgba(34,211,238,.4);
  box-shadow:0 0 80px rgba(0,0,0,.7);
}

.startCard h1{
  font-size:clamp(32px,7vw,62px);
  letter-spacing:3px;
  margin-bottom:10px;
}

.startCard h1 span{
  color:#22d3ee;
}

.startCard p{
  color:#cbd5e1;
  line-height:1.7;
  margin-bottom:22px;
}

#startBtn{
  border:0;
  border-radius:9px;
  padding:15px 35px;
  background:#22d3ee;
  color:#001018;
  font-weight:900;
  font-size:16px;
  cursor:pointer;
}

#loading{
  display:none;
  margin-top:14px;
  color:#67e8f9;
}

@media(min-width:701px){
  #mobile{
    display:none;
  }
}

@media(max-width:700px){
  #stats{
    min-width:145px;
  }

  .stat{
    font-size:10px;
  }

  #weaponHud{
    min-width:145px;
  }

  #ammo{
    font-size:21px;
  }

  #message{
    font-size:18px;
  }
}
</style>
</head>

<body>

<div id="startScreen">
  <div class="startCard">
    <h1>ALFA <span>ZOMBIE</span> 3D</h1>
    <p>
      V5 — CHARACTER & WEAPON UPGRADE<br>
      Human-like zombie • 4 weapons • Clear city • Survival combat
    </p>
    <button id="startBtn">START SURVIVAL</button>
    <div id="loading">LOADING CITY & CHARACTER ENGINE...</div>
  </div>
</div>

<div id="hud">

  <div id="topbar">

    <div id="stats" class="panel">
      <div class="stat">HP: <b id="hp">100</b></div>
      <div class="stat">STAMINA: <b id="stamina">100</b></div>
      <div class="stat">WAVE: <b id="wave">1</b></div>
      <div class="stat">ZOMBIES: <b id="zcount">0</b></div>
      <div class="stat">SCORE: <b id="score">0</b></div>
    </div>

    <div id="weaponHud" class="panel">
      <div id="weaponName">PISTOL</div>
      <div id="ammo">12 <small>/ 72</small></div>

  </div>

  <div id="crosshair">
    <div id="dot"></div>
  </div>

  <div id="message"></div>
  <div id="damageFlash"></div>
  <div id="hitMarker"></div>

</div>

<div id="console">
  <div id="consoleBox">
    <div id="consoleOutput">ALFA COMMAND CONSOLE
Type "help" for commands.</div>
    <input id="consoleInput" placeholder="Enter command..." autocomplete="off">
  </div>
</div>

<div id="mobile">

  <div id="joy">
    <div id="joyKnob"></div>
  </div>

  <div id="sprintBtn" class="touchBtn">RUN</div>
  <div id="crouchBtn" class="touchBtn">C</div>
  <div id="reloadBtn" class="touchBtn">R</div>
  <div id="switchBtn" class="touchBtn">GUN</div>
  <div id="fireBtn" class="touchBtn">FIRE</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
"use strict";

/* =========================================================
   ALFA ZOMBIE 3D V5
   ========================================================= */

let scene;
let camera;
let renderer;
let clock;

let player;
let weapon;

let zombies=[];
let particles=[];
let shells=[];
let pickups=[];
let buildings=[];
let cars=[];

let started=false;
let gameOver=false;

let hp=100;
let stamina=100;
let score=0;
let wave=1;

let yaw=0;
let pitch=0;

let grounded=true;
let velocityY=0;

let sprinting=false;
let crouching=false;

let keys={};
let mouseDown=false;

let joyX=0;
let joyY=0;

let godMode=false;
let playerSpeed=5;

let lastShot=0;
let weaponKick=0;
let muzzleFlashTime=0;

let waveKills=0;
let waveTarget=8;

let audioCtx=null;

const raycaster=new THREE.Raycaster();
const center=new THREE.Vector2(0,0);

/* =========================================================
   DOM
   ========================================================= */

const $=id=>document.getElementById(id);

function updateHUD(){

  $("hp").textContent=Math.max(0,Math.round(hp));
  $("stamina").textContent=Math.round(stamina);
  $("wave").textContent=wave;
  $("zcount").textContent=zombies.length;
  $("score").textContent=score;

  const w=weapons[currentWeapon];

  $("weaponName").textContent=w.name;

  $("ammo").innerHTML=
    w.ammo+" <small>/ "+w.reserve+"</small>";
}

/* =========================================================
   MATERIALS
   ========================================================= */

function material(color,rough=.8,metal=0){

  return new THREE.MeshStandardMaterial({
    color:color,
    roughness:rough,
    metalness:metal
  });
}

const M={
  road:material(0x292f35,1),
  ground:material(0x858b8f,.95),
  sidewalk:material(0xb1b4b4,.9),
  white:material(0xe5e7eb,.7),
  black:material(0x11151a,.7),
  glass:material(0x2d6176,.25,.3),
  glassDark:material(0x17384b,.2,.35),
  metal:material(0x454b52,.3,.8),
  gun:material(0x17191c,.25,.75),
  grip:material(0x26211e,.95),
  skin:material(0x7e685d,.95),
  zombie:material(0x687969,.95),
  zombieDark:material(0x3d4b41,.95),
  pants:material(0x293039,.95),
  blood:material(0x841515,.8),
  teeth:material(0xe5dcc0,.8),
  tongue:material(0x8e2631,.9),
  casing:material(0xc78a2d,.3,.75),
  yellow:material(0xd6ad2e,.7),
  red:material(0xb52b2b,.7)
};

/* =========================================================
   WEAPON SYSTEM
   ========================================================= */

const weapons={

  pistol:{
    name:"PISTOL",
    damage:42,
    headDamage:160,
    fireRate:230,
    magazine:12,
    ammo:12,
    reserve:72,
    reload:850,
    recoil:.055,
    spread:.004,
    pellets:1,
    automatic:false,
    color:0x17191c
  },

  smg:{
    name:"SMG",
    damage:25,
    headDamage:110,
    fireRate:85,
    magazine:30,
    ammo:30,
    reserve:120,
    reload:1050,
    recoil:.032,
    spread:.018,
    pellets:1,
    automatic:true,
    color:0x25292d
  },

  shotgun:{
    name:"SHOTGUN",
    damage:30,
    headDamage:90,
    fireRate:700,
    magazine:6,
    ammo:6,
    reserve:42,
    reload:1200,
    recoil:.13,
    spread:.085,
    pellets:7,
    automatic:false,
    color:0x4b3020
  },

  rifle:{
    name:"ASSAULT RIFLE",
    damage:34,
    headDamage:135,
    fireRate:105,
    magazine:30,
    ammo:30,
    reserve:150,
    reload:1200,
    recoil:.042,
    spread:.012,
    pellets:1,
    automatic:true,
    color:0x25282b
  }

};

let currentWeapon="pistol";
let weaponGroup=null;
let muzzleLight=null;

function createWeapon(type){

  if(weaponGroup){

    camera.remove(weaponGroup);
    weaponGroup=null;
  }

  weaponGroup=new THREE.Group();

  const w=weapons[type];

  weaponGroup.position.set(.42,-.37,-.78);

  camera.add(weaponGroup);

  let slide=null;

  /* =====================================================
     PISTOL
     ===================================================== */

  if(type==="pistol"){

    const frame=new THREE.Mesh(
      new THREE.BoxGeometry(.24,.27,.72),
      M.gun
    );

    frame.position.y=0;
    weaponGroup.add(frame);

    slide=new THREE.Mesh(
      new THREE.BoxGeometry(.27,.21,.82),
      M.metal
    );

    slide.position.set(0,.15,0);
    weaponGroup.add(slide);

    for(let i=-3;i<=3;i++){

      const serr=new THREE.Mesh(
        new THREE.BoxGeometry(.012,.13,.035),
        M.black
      );

      serr.position.set(
        (i%2)*.01,
        .15,
        -.12+i*.075
      );

      weaponGroup.add(serr);
    }

    addGrip(weaponGroup,.21,.55,.28);

    addBarrel(weaponGroup,.30);

    addTrigger(weaponGroup);

    addSight(weaponGroup);

  }

  /* =====================================================
     SMG
     ===================================================== */

  if(type==="smg"){

    const body=new THREE.Mesh(
      new THREE.BoxGeometry(.27,.30,1.0),
      M.gun
    );

    body.position.y=.03;

    weaponGroup.add(body);

    slide=new THREE.Mesh(
      new THREE.BoxGeometry(.30,.20,.72),
      M.metal
    );

    slide.position.set(0,.21,.03);

    weaponGroup.add(slide);

    const front=new THREE.Mesh(
      new THREE.BoxGeometry(.32,.23,.36),
      M.metal
    );

    front.position.set(0,.12,-.62);

    weaponGroup.add(front);

    addBarrel(weaponGroup,.46);

    addGrip(weaponGroup,.23,.65,.30);

    const magazine=new THREE.Mesh(
      new THREE.BoxGeometry(.16,.48,.28),
      M.black
    );

    magazine.position.set(0,-.35,-.05);
    magazine.rotation.x=-.12;

    weaponGroup.add(magazine);

    addTrigger(weaponGroup);

  }

  /* =====================================================
     SHOTGUN
     ===================================================== */

  if(type==="shotgun"){

    const receiver=new THREE.Mesh(
      new THREE.BoxGeometry(.30,.34,.65),
      M.metal
    );

    receiver.position.set(0,.04,.08);

    weaponGroup.add(receiver);

    const barrel=new THREE.Mesh(
      new THREE.CylinderGeometry(.075,.075,1.45,16),
      M.black
    );

    barrel.rotation.x=Math.PI/2;
    barrel.position.set(0,.15,-.75);

    weaponGroup.add(barrel);

    const pump=new THREE.Mesh(
      new THREE.BoxGeometry(.34,.23,.55),
      material(0x4c3222,.9)
    );

    pump.position.set(0,.04,-.63);

    weaponGroup.add(pump);

    addGrip(weaponGroup,.26,.65,.33);

    addTrigger(weaponGroup);

  }

  /* =====================================================
     ASSAULT RIFLE
     ===================================================== */

  if(type==="rifle"){

    const receiver=new THREE.Mesh(
      new THREE.BoxGeometry(.32,.35,.75),
      M.gun
    );

    receiver.position.set(0,.04,.1);

    weaponGroup.add(receiver);

    const upper=new THREE.Mesh(
      new THREE.BoxGeometry(.30,.22,1.0),
      M.metal
    );

    upper.position.set(0,.23,-.12);

    weaponGroup.add(upper);

    slide=upper;

    const handguard=new THREE.Mesh(
      new THREE.BoxGeometry(.34,.28,.72),
      M.black
    );

    handguard.position.set(0,.18,-.72);

    weaponGroup.add(handguard);

    const barrel=new THREE.Mesh(
      new THREE.CylinderGeometry(.045,.045,.5,12),
      M.metal
    );

    barrel.rotation.x=Math.PI/2;
    barrel.position.set(0,.18,-1.25);

    weaponGroup.add(barrel);

    addGrip(weaponGroup,.25,.62,.31);

    const magazine=new THREE.Mesh(
      new THREE.BoxGeometry(.20,.62,.32),
      M.black
    );

    magazine.position.set(0,-.40,.0);
    magazine.rotation.x=-.18;

    weaponGroup.add(magazine);

    addTrigger(weaponGroup);

  }

  weaponGroup.userData.slide=slide;

  muzzleLight=new THREE.PointLight(
    0xffb52b,
    0,
    7
  );

  muzzleLight.position.set(0,.15,-1.35);

  weaponGroup.add(muzzleLight);

  updateHUD();
}

function addGrip(group,width,height,depth){

  const grip=new THREE.Mesh(
    new THREE.BoxGeometry(width,height,depth),
    M.grip
  );

  grip.position.set(0,-.36,.18);
  grip.rotation.x=-.14;

  group.add(grip);

  for(let y=-.58;y<-.14;y+=.09){

    const line=new THREE.Mesh(
      new THREE.BoxGeometry(width+.015,.025,depth+.015),
      M.black
    );

    line.position.set(0,y,.18);
    line.rotation.x=-.14;

    group.add(line);
  }
}

function addBarrel(group,length){

  const barrel=new THREE.Mesh(
    new THREE.CylinderGeometry(.055,.055,length,12),
    M.black
  );

  barrel.rotation.x=Math.PI/2;
  barrel.position.set(0,.14,-.58);

  group.add(barrel);
}

function addTrigger(group){

  const guard=new THREE.Mesh(
    new THREE.TorusGeometry(.10,.025,8,16,Math.PI),
    M.metal
  );

  guard.rotation.z=Math.PI;
  guard.position.set(0,-.10,-.05);

  group.add(guard);

  const trigger=new THREE.Mesh(
    new THREE.BoxGeometry(.04,.14,.04),
    M.metal
  );

  trigger.position.set(0,-.10,-.05);

  group.add(trigger);
}

function addSight(group){

  const rear=new THREE.Mesh(
    new THREE.BoxGeometry(.16,.07,.07),
    M.black
  );

  rear.position.set(0,.28,.18);

  group.add(rear);

  const front=new THREE.Mesh(
    new THREE.BoxGeometry(.06,.11,.06),
    M.black
  );

  front.position.set(0,.27,-.43);

  group.add(front);
}

/* =========================================================
   AUDIO
   ========================================================= */

function initAudio(){

  if(audioCtx) return;

  try{
    audioCtx=new(
      window.AudioContext||
      window.webkitAudioContext
    )();
  }catch(e){}
}

function oscSound(freq,duration,type="sawtooth",volume=.1){

  if(!audioCtx) return;

  const now=audioCtx.currentTime;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type=type;
  osc.frequency.setValueAtTime(freq,now);

  gain.gain.setValueAtTime(.0001,now);
  gain.gain.exponentialRampToValueAtTime(volume,now+.005);
  gain.gain.exponentialRampToValueAtTime(.0001,now+duration);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+duration+.01);
}

function gunSound(type){

  if(!audioCtx) return;

  if(type==="pistol"){
    oscSound(150,.12,"sawtooth",.48);
  }

  if(type==="smg"){
    oscSound(180,.08,"square",.32);
  }

  if(type==="shotgun"){
    oscSound(95,.22,"sawtooth",.7);
  }

  if(type==="rifle"){
    oscSound(135,.10,"sawtooth",.48);
  }
}

function emptySound(){
  oscSound(80,.08,"square",.09);
}

function reloadSound(){

  if(!audioCtx) return;

  oscSound(210,.07,"square",.1);

  setTimeout(()=>{
    oscSound(145,.07,"square",.1);
  },180);

  setTimeout(()=>{
    oscSound(250,.08,"square",.1);
  },360);
}

function footSound(){

  if(!audioCtx) return;

  oscSound(
    60+Math.random()*20,
    .08,
    "triangle",
    .06
  );
}

function growlSound(){

  if(!audioCtx) return;

  oscSound(
    45+Math.random()*25,
    .45,
    "sawtooth",
    .045
  );
}

/* =========================================================
   SCENE
   ========================================================= */

function initScene(){

  scene=new THREE.Scene();

  scene.background=new THREE.Color(0x9fb6c6);

  scene.fog=new THREE.Fog(
    0x9fb6c6,
    55,
    270
  );

  camera=new THREE.PerspectiveCamera(
    72,
    innerWidth/innerHeight,
    .05,
    500
  );

  camera.rotation.order="YXZ";

  renderer=new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.6)
  );

  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;

  document.body.appendChild(
    renderer.domElement
  );

  clock=new THREE.Clock();

  createLights();
  createWorld();

  player=new THREE.Object3D();

  player.position.set(0,1.7,14);

  scene.add(player);

  player.add(camera);

  createWeapon("pistol");

  addEvents();

  animate();
}

/* =========================================================
   LIGHT
   ========================================================= */

function createLights(){

  const hemi=new THREE.HemisphereLight(
    0xe6f4ff,
    0x59636a,
    1.8
  );

  scene.add(hemi);

  const sun=new THREE.DirectionalLight(
    0xfff1d2,
    2.7
  );

  sun.position.set(70,110,30);

  sun.castShadow=true;

  sun.shadow.mapSize.width=2048;
  sun.shadow.mapSize.height=2048;

  sun.shadow.camera.left=-130;
  sun.shadow.camera.right=130;
  sun.shadow.camera.top=130;
  sun.shadow.camera.bottom=-130;

  scene.add(sun);
}

/* =========================================================
   WORLD
   ========================================================= */

function createWorld(){

  const ground=new THREE.Mesh(
    new THREE.PlaneGeometry(500,500),
    M.ground
  );

  ground.rotation.x=-Math.PI/2;
  ground.receiveShadow=true;

  scene.add(ground);

  createRoad(0,0,18,500,true);
  createRoad(0,0,500,18,false);

  createRoad(-55,0,16,500,true);
  createRoad(55,0,16,500,true);

  createRoad(0,-60,500,15,false);
  createRoad(0,60,500,15,false);

  createBuildings();
  createCars();
  createLightsWorld();
  createRoadDetails();
  createCover();
}

/* =========================================================
   ROAD
   ========================================================= */

function createRoad(x,z,w,d,vertical){

  const road=new THREE.Mesh(
    new THREE.BoxGeometry(
      vertical?w:d,
      .08,
      vertical?d:w
    ),
    M.road
  );

  road.position.set(x,.03,z);
  road.receiveShadow=true;

  scene.add(road);

  for(
    let p=-d/2+8;
    p<d/2;
    p+=12
  ){

    const line=new THREE.Mesh(
      vertical
      ?new THREE.BoxGeometry(.24,.035,5)
      :new THREE.BoxGeometry(5,.035,.24),
      M.yellow
    );

    if(vertical){
      line.position.set(x,.075,z+p);
    }else{
      line.position.set(x+p,.075,z);
    }

    scene.add(line);
  }
}

function createBuildings(){

  const list=[
    [-38,-35,25,28,10],
    [38,-35,25,28,14],
    [-38,35,25,28,16],
    [38,35,25,28,11],
    [-82,-30,28,35,18],
    [82,-30,28,35,12],
    [-82,30,28,35,15],
    [82,30,28,35,20],
    [-125,-70,35,30,17],
    [125,-70,35,30,14],
    [-125,70,35,30,19],
    [125,70,35,30,13],
    [-32,-105,30,28,9],
    [32,-105,30,28,12],

  ];

  list.forEach((b,i)=>{

function createBuilding(x,z,w,d,h,index){

  const g=new THREE.Group();

  g.position.set(x,0,z);

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    material(
      index%2?0x8f979b:0xb8b2a8,
      .9
    )
  );

  body.position.y=h/2;
  body.castShadow=true;
  body.receiveShadow=true;

  g.add(body);

  const roof=new THREE.Mesh(
    new THREE.BoxGeometry(
      w+1,.5,d+1
    ),
    M.black
  );

  roof.position.y=h+.25;

  g.add(roof);

  /* door */
  const doorFrame=new THREE.Mesh(
    new THREE.BoxGeometry(3,4.5,.18),
    M.white
  );

  doorFrame.position.set(
    0,2.25,d/2+.08
  );

  g.add(doorFrame);

  const door=new THREE.Mesh(
    new THREE.BoxGeometry(2.5,4,.12),
    M.black
  );

  door.position.set(
    0,2.05,d/2+.15
  );

  g.add(door);

  /* front windows */
  const floors=Math.max(
    2,
    Math.floor(h/3.6)
  );

  for(let f=1;f<floors;f++){

    const yy=f*3.5;

    for(
      let xx=-w/2+3;
      xx<w/2-1;
      xx+=5
    ){

      addFrontWindow(
        g,xx,yy,d/2+.10
      );
    }
  }

  /* side windows */
  for(let f=1;f<floors;f++){

    const yy=f*3.5;

    for(
      let zz=-d/2+4;
      zz<d/2-2;
      zz+=6
    ){

      addSideWindow(
        g,-w/2-.10,yy,zz
      );

      addSideWindow(
        g,w/2+.10,yy,zz
      );
    }
  }

  /* sign */
  const sign=new THREE.Mesh(
    new THREE.BoxGeometry(7,1.2,.16),
    index%2?M.red:M.glass
  );

  sign.position.set(
    0,h-1.8,d/2+.14
  );

  g.add(sign);

  /* balcony */
  if(index%3===0){

    const balcony=new THREE.Mesh(
      new THREE.BoxGeometry(7,.25,2.2),
      M.sidewalk
    );

    balcony.position.set(
      0,5,d/2+1
    );

    g.add(balcony);

    for(let i=-3;i<=3;i+=1.5){

      const post=new THREE.Mesh(
        new THREE.BoxGeometry(.10,1.2,.10),
        M.black
      );

      post.position.set(
        i,5.65,d/2+1.8
      );

      g.add(post);
    }
  }

  buildings.push(g);
  scene.add(g);
}

function addFrontWindow(parent,x,y,z){

  const frame=new THREE.Mesh(
    new THREE.BoxGeometry(3.1,2.2,.14),
    M.black
  );

  frame.position.set(x,y,z);

  parent.add(frame);

  const glass=new THREE.Mesh(
    new THREE.BoxGeometry(2.5,1.65,.08),
    M.glass
  );

  glass.position.set(
    x,y,z+(z>0?.09:-.09)
  );

  parent.add(glass);

  const bar=new THREE.Mesh(
    new THREE.BoxGeometry(.08,1.6,.1),
    M.white
  );

  bar.position.set(
    x,y,
    glass.position.z
  );

  parent.add(bar);
}

function addSideWindow(parent,x,y,z){

  const frame=new THREE.Mesh(
    new THREE.BoxGeometry(.14,2.2,3.1),
    M.black
  );

  frame.position.set(x,y,z);

  parent.add(frame);

  const glass=new THREE.Mesh(
    new THREE.BoxGeometry(.08,1.65,2.5),
    M.glass
  );

  glass.position.set(
    x+(x>0?.09:-.09),
    y,
    z
  );

  parent.add(glass);
}

function createCars(){

  const list=[
    [-10,28,0x263c55,0],
    [12,-25,0x8b2525,Math.PI/2],

function createCar(x,z,color,rot){

  const car=new THREE.Group();

  car.position.set(x,.1,z);
  car.rotation.y=rot;

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(5,1.15,9),
    material(color,.55,.18)
  );

  body.position.y=1.05;
  body.castShadow=true;

  car.add(body);

  const hood=new THREE.Mesh(
    new THREE.BoxGeometry(4.7,.3,2.3),
    material(color,.55,.12)
  );

  hood.position.set(0,1.65,3);

  car.add(hood);

  const cabin=new THREE.Mesh(
    new THREE.BoxGeometry(4.25,1.65,4.5),
    M.black
  );

  cabin.position.set(0,2.15,-.2);

  car.add(cabin);

  const windshield=new THREE.Mesh(
    new THREE.BoxGeometry(3.85,1.35,.10),
    M.glass
  );

  windshield.position.set(
    0,2.34,2.08
  );

  windshield.rotation.x=-.12;

  car.add(windshield);

  const rear=windshield.clone();

  rear.position.z=-2.42;
  rear.rotation.x=.12;

  car.add(rear);

  [-2.18,2.18].forEach(xx=>{

    const side=new THREE.Mesh(
      new THREE.BoxGeometry(.08,1.2,3.2),
      M.glassDark
    );

    side.position.set(
      xx,2.3,-.2
    );

    car.add(side);
  });

  const wheelGeo=new THREE.CylinderGeometry(
    .75,.75,.48,20
  );

  [
    [-2.55,.75,3],
    [2.55,.75,3],
    [-2.55,.75,-3],
    [2.55,.75,-3]
  ].forEach(p=>{

    const wheel=new THREE.Mesh(
      wheelGeo,
      M.black
    );

    wheel.rotation.z=Math.PI/2;
    wheel.position.set(...p);
    wheel.castShadow=true;

    car.add(wheel);

    const hub=new THREE.Mesh(
      new THREE.CylinderGeometry(
        .27,.27,.5,16
      ),
      M.metal
    );

    hub.rotation.z=Math.PI/2;
    hub.position.set(...p);

    car.add(hub);
  });

  [-1.6,1.6].forEach(xx=>{

    const light=new THREE.Mesh(
      new THREE.BoxGeometry(1,.42,.12),
      material(0xffefaa,.25,.1)
    );

    light.position.set(
      xx,1.25,4.58
    );

    car.add(light);

    const rearLight=light.clone();

    rearLight.material=material(
      0xff2222,.3,.1
    );

    rearLight.position.z=-4.58;

    car.add(rearLight);
  });

  const bumper1=new THREE.Mesh(
    new THREE.BoxGeometry(5.2,.32,.35),
    M.black
  );

  bumper1.position.set(
    0,.72,4.55
  );

  car.add(bumper1);

  const bumper2=bumper1.clone();

  bumper2.position.z=-4.55;

  car.add(bumper2);

  cars.push(car);
  scene.add(car);
}

/* =========================================================
   WORLD LIGHTS
   ========================================================= */

function createLightsWorld(){

  for(let z=-110;z<=110;z+=22){

    addStreetLight(-12,z);
    addStreetLight(12,z);
  }

  for(let x=-110;x<=110;x+=22){

    addStreetLight(x,-12);
    addStreetLight(x,12);
  }
}

function addStreetLight(x,z){

  const g=new THREE.Group();

  g.position.set(x,0,z);

  const pole=new THREE.Mesh(
    new THREE.CylinderGeometry(.12,.16,7,10),
    M.metal
  );

  pole.position.y=3.5;

  g.add(pole);

  const arm=new THREE.Mesh(
    new THREE.BoxGeometry(1.8,.12,.12),
    M.metal
  );

  arm.position.set(.75,6.8,0);

  g.add(arm);

  const lamp=new THREE.Mesh(
    new THREE.BoxGeometry(.5,.3,.5),
    material(0xffeaa5,.25)
  );

  lamp.position.set(1.6,6.6,0);

  g.add(lamp);

  const light=new THREE.PointLight(
    0xffd477,
    .45,
    18
  );

  light.position.set(1.6,6.2,0);

  g.add(light);

  scene.add(g);
}

      new THREE.BoxGeometry(

      ),

    stripe.position.set(
      j*2.6,
      .09,
      8
    );

    scene.add(stripe);
  }
}

function spawnZombie(type="normal"){

}

function spawnWave(){

  const count=Math.min(
    5+wave*2,
    30
  );

  waveKills=0;
  waveTarget=count;

  for(let i=0;i<count;i++){

    let type="normal";

    const r=Math.random();

    if(wave>=3 && r>.76){
      type="fast";
    }

    if(wave>=5 && r>.91){
      type="tank";
    }

    setTimeout(()=>{
      if(!gameOver){
        spawnZombie(type);
      }
    },i*330);
  }

  showMessage(
    "WAVE "+wave+
    " — "+count+" ZOMBIES"
  );
}

/* =========================================================
   SHOOT
   ========================================================= */

function shoot(){

  if(!started || gameOver) return;

  const w=weapons[currentWeapon];

  const now=performance.now();

  if(now-lastShot<w.fireRate) return;

  lastShot=now;

  if(w.ammo<=0){

    emptySound();
    showMessage("EMPTY — PRESS R");
    return;
  }

  w.ammo--;

  gunSound(currentWeapon);

  weaponKick=w.recoil;
  muzzleFlashTime=.055;

  if(muzzleLight){
    muzzleLight.intensity=8;
  }

  /* slide */
  if(
    weaponGroup &&
    weaponGroup.userData.slide
  ){

    weaponGroup.userData.slide.position.z=.075;

    setTimeout(()=>{

      if(
        weaponGroup &&
        weaponGroup.userData.slide
      ){
        weaponGroup.userData.slide.position.z=0;
      }

    },60);
  }

  /* casing */
  ejectShell();

  /* muzzle smoke */
  smokeBurst();

  for(let pellet=0;pellet<w.pellets;pellet++){

    const spreadX=
      (Math.random()-.5)*w.spread;

    const spreadY=
      (Math.random()-.5)*w.spread;

    raycaster.setFromCamera(
      new THREE.Vector2(
        spreadX,
        spreadY
      ),
      camera
    );

    const targets=[];

    zombies.forEach(z=>{
      z.traverse(o=>{
        if(
          o.isMesh &&
          !o.userData.pickup
        ){
          targets.push(o);
        }
      });
    });

    const hits=
      raycaster.intersectObjects(
        targets,
        false
      );

    if(hits.length){

      const hit=hits[0];

      let object=hit.object;
      let z=object.userData.zombie;

      if(!z){

        let parent=object.parent;

        while(parent){

          if(
            parent.userData &&
            parent.userData.hp!==undefined
          ){
            z=parent;
            break;
          }

          parent=parent.parent;
        }
      }

      if(
        z &&
        !z.userData.dead
      ){

        const isHead=
          object.userData.part==="head" ||
          isObjectInsideHead(object,z);

        const damage=
          isHead
          ?w.headDamage
          :w.damage;

        z.userData.hp-=damage;

        z.userData.hitFlash=.10;

        bloodBurst(
          hit.point,
          isHead?1.6:1
        );

        /* recoil reaction */
        z.position.x+=
          (z.position.x-player.position.x)*
          .002;

        if(isHead){
          showHit(true);
        }else{
          showHit(false);
        }

        if(
          z.userData.hp<=0
        ){
          killZombie(
            z,
            isHead
          );
        }

        updateHealthBar(z);
      }
    }
  }

  updateHUD();
}

function isObjectInsideHead(object,z){

  let p=object;

  while(p){

    if(p===z.userData.head){
      return true;
    }

    p=p.parent;
  }

  return false;
}

/* =========================================================
   ZOMBIE UPDATE
   ========================================================= */

function updateZombies(dt){

  for(
    let i=zombies.length-1;
    i>=0;
    i--
  ){

    const z=zombies[i];

    if(!z) continue;

    if(z.userData.dead){

      z.userData.deathTime+=dt;

      z.rotation.z=
        Math.min(
          Math.PI/2,
          z.userData.deathTime*4
        );

      z.position.y=
        Math.max(
          0,
          1.15-
          z.userData.deathTime*1.5
        );

      if(
        z.userData.deathTime>1.45
      ){

        createPickup(
          z.position
        );

        scene.remove(z);

        zombies.splice(i,1);
      }

      continue;
    }

    const dx=
      player.position.x-
      z.position.x;

    const dz=
      player.position.z-
      z.position.z;

    const dist=Math.sqrt(
      dx*dx+dz*dz
    );

    if(dist>1.75){

      let nx=dx/dist;
      let nz=dz/dist;

      const side=
        Math.sin(
          z.userData.walkTime*.75+
          z.position.x
        )*.10;

      nx+=-nz*side;
      nz+=nx*side;

      const len=Math.sqrt(
        nx*nx+nz*nz
      );

      nx/=len;
      nz/=len;

      z.position.x+=
        nx*z.userData.speed*dt;

      z.position.z+=
        nz*z.userData.speed*dt;

      z.rotation.y=
        Math.atan2(nx,nz);

      z.userData.walkTime+=
        dt*5.5;

      const swing=
        Math.sin(
          z.userData.walkTime
        )*.55;

      z.userData.leftArm.rotation.x=
        swing;

      z.userData.rightArm.rotation.x=
        -swing;

      z.userData.leftLeg.rotation.x=
        -swing*.7;

      z.userData.rightLeg.rotation.x=
        swing*.7;

    }else{

      z.userData.attackCooldown-=dt;

      if(
        z.userData.attackCooldown<=0
      ){

        z.userData.attackCooldown=
          1.1;

        if(!godMode){

          const damage=
            z.userData.type==="tank"
            ?16
            :z.userData.type==="fast"
            ?9
            :7;

          takeDamage(damage);
        }

        growlSound();
      }
    }

    /* health bar always faces camera */
    if(z.userData.healthBar){

      z.userData.healthBar.parent.quaternion.copy(
        camera.getWorldQuaternion(
          new THREE.Quaternion()
        )
      );
    }

    /* flash */
    if(z.userData.hitFlash>0){

      z.userData.hitFlash-=dt;

      z.traverse(o=>{

        if(
          o.isMesh &&
          o.material &&
          o.material.emissive
        ){
          o.material.emissive.set(
            0x441111
          );
        }
      });

    }else{

      z.traverse(o=>{

        if(
          o.isMesh &&
          o.material &&
          o.material.emissive
        ){
          o.material.emissive.set(
            0x000000
          );
        }
      });
    }
  }
}

      new THREE.BoxGeometry(

    );

    g.add(stripe);

    const box=new THREE.Mesh(
      new THREE.BoxGeometry(

      ),

    );

    g.add(box);

    const v=new THREE.Mesh(
      new THREE.BoxGeometry(

      ),
      M.red

    g.add(v);

function updatePickups(dt){

  for(
    let i=pickups.length-1;
    i>=0;
    i--
  ){

    const p=pickups[i];

    p.userData.life-=dt;

    p.rotation.y+=dt*1.5;

    p.position.y=
      .55+
      Math.sin(
        performance.now()*.003+i
      )*.10;

    if(
      p.position.distanceTo(
        player.position
      )<2
    ){

      if(
        p.userData.type==="ammo"
      ){

        weapons.pistol.reserve+=24;
        weapons.smg.reserve+=45;
        weapons.shotgun.reserve+=12;
        weapons.rifle.reserve+=45;

        showMessage("+ AMMO");

      }else{

        hp=Math.min(
          100,
          hp+30
        );

        showMessage("+30 HP");
      }

      scene.remove(p);
      pickups.splice(i,1);

      updateHUD();
      continue;
    }

    if(p.userData.life<=0){

      scene.remove(p);
      pickups.splice(i,1);
    }
  }
}

/* =========================================================
   PLAYER MOVEMENT
   ========================================================= */

function updatePlayer(dt){

  if(gameOver) return;

  let forward=0;
  let side=0;

  if(keys.KeyW) forward+=1;
  if(keys.KeyS) forward-=1;
  if(keys.KeyA) side-=1;
  if(keys.KeyD) side+=1;

  forward+=-joyY;
  side+=joyX;

  const moving=
    Math.abs(forward)+
    Math.abs(side)>.05;

  const sprintKey=
    keys.ShiftLeft||
    keys.ShiftRight||
    sprinting;

  sprinting=
    sprintKey &&
    moving &&
    stamina>0 &&
    !crouching;

  if(sprinting){

    stamina-=27*dt;

  }else{

    stamina+=17*dt;
  }

  stamina=Math.max(
    0,
    Math.min(100,stamina)
  );

  let speed=playerSpeed;

  if(sprinting) speed*=1.65;
  if(crouching) speed*=.45;

  const len=Math.sqrt(
    forward*forward+
    side*side
  );

  if(len>1){

    forward/=len;
    side/=len;
  }

  const sin=Math.sin(yaw);
  const cos=Math.cos(yaw);

  player.position.x+=
    (side*cos+forward*sin)*
    speed*dt;

  player.position.z+=
    (side*sin-forward*cos)*
    speed*dt;

  /* jump */
  if(!grounded){

    velocityY-=18*dt;

    player.position.y+=
      velocityY*dt;

    if(player.position.y<=1.15){

      player.position.y=1.15;
      grounded=true;
      velocityY=0;
    }
  }

  /* head bob */
  if(moving){

    const rate=
      sprinting?13:8;

    const bob=
      Math.sin(
        performance.now()*.001*rate
      )*
      (sprinting?.035:.018);

    camera.position.y=
      bob+
      (crouching?-.42:0);

  }else{

    camera.position.y=
      THREE.MathUtils.lerp(
        camera.position.y,
        crouching?-.42:0,
        .12
      );
  }

  /* weapon movement */
  if(weaponGroup){

    weaponGroup.rotation.y=
      THREE.MathUtils.lerp(
        weaponGroup.rotation.y,
        -.03-side*.04,
        .08
      );

    weaponGroup.rotation.x=
      THREE.MathUtils.lerp(
        weaponGroup.rotation.x,
        -.04+forward*.025,
        .08
      );

    weaponGroup.position.z=
      THREE.MathUtils.lerp(
        weaponGroup.position.z,
        -.78+weaponKick,
        .25
      );

    weaponKick*=.76;
  }

  /* footsteps */
  if(
    moving &&
    grounded
  ){

    if(!updatePlayer.footTimer){
      updatePlayer.footTimer=0;
    }

    updatePlayer.footTimer-=dt;

    if(
      updatePlayer.footTimer<=0
    ){

      updatePlayer.footTimer=
        sprinting?.28:
        crouching?.55:
        .43;

      footSound();
    }

  }else{

    updatePlayer.footTimer=0;
  }

  player.position.x=
    Math.max(
      -230,
      Math.min(230,player.position.x)
    );

  player.position.z=
    Math.max(
      -230,
      Math.min(230,player.position.z)
    );

  updateHUD();
}

/* =========================================================
   RELOAD
   ========================================================= */

function reload(){

  const w=weapons[currentWeapon];

  if(
    w.ammo>=w.magazine ||
    w.reserve<=0
  ) return;

  const amount=Math.min(
    w.magazine-w.ammo,
    w.reserve
  );

  w.ammo+=amount;
  w.reserve-=amount;

  reloadSound();

  showMessage(
    "RELOADING "+w.name
  );

  if(weaponGroup){

    weaponGroup.rotation.x=-.35;

    setTimeout(()=>{

      if(weaponGroup){
        weaponGroup.rotation.x=-.04;
      }

    },w.reload*.5);
  }

  updateHUD();
}

  currentWeapon=type;

}

ammo
heal
god
spawn zombie
spawn fast
spawn tank
clear
speed 5
give weapon
give medkit
pistol
smg
shotgun
rifle
night
day
wave`

      "FAST ZOMBIE SPAWNED"
    );

  }else if(cmd==="spawn tank"){

    spawnZombie("tank");

    printConsole(
      "TANK ZOMBIE SPAWNED"
    );

  }else if(cmd==="clear"){

    zombies.forEach(z=>{
      scene.remove(z);
    });

    zombies=[];

    printConsole(
      "ZOMBIES CLEARED"
    );

  }else if(cmd.startsWith("speed")){

    const value=
      parseFloat(
        cmd.split(" ")[1]
      );

    if(!isNaN(value)){

      playerSpeed=
        Math.max(
          1,
          Math.min(30,value)
        );
    }

    printConsole(
      "SPEED="+playerSpeed
    );

  }else if(cmd==="give weapon"){

    Object.keys(weapons).forEach(k=>{
      weapons[k].reserve=999;
      weapons[k].ammo=
        weapons[k].magazine;
    });

    printConsole(
      "ALL WEAPONS READY"
    );

  }else if(cmd==="give medkit"){

    hp=100;

    printConsole(
      "MEDKIT USED"
    );

  }else if(
    cmd==="pistol"||
    cmd==="smg"||
    cmd==="shotgun"||
    cmd==="rifle"
  ){

    switchWeapon(cmd);

    printConsole(
      "WEAPON="+
      weapons[cmd].name
    );

  }else if(cmd==="night"){

    scene.background.set(
      0x050b16
    );

    scene.fog.color.set(
      0x08111c
    );

    printConsole(
      "NIGHT MODE"
    );

  }else if(cmd==="day"){

    scene.background.set(
      0x9fb6c6
    );

    scene.fog.color.set(
      0x9fb6c6
    );

    printConsole(
      "DAY MODE"
    );

  }else if(cmd==="wave"){

    wave++;

    spawnWave();

  }else{

    printConsole(
      "UNKNOWN COMMAND"
    );
  }

  updateHUD();
}

/* =========================================================
   MESSAGE
   ========================================================= */

let messageTimer;

function showMessage(text){

  $("message").textContent=text;
  $("message").style.opacity="1";

  clearTimeout(messageTimer);

  messageTimer=setTimeout(()=>{
    $("message").style.opacity="0";
  },1100);
}

/* =========================================================
   MOUSE LOOK
   ========================================================= */

function lockPointer(){

  if(
    renderer.domElement.requestPointerLock
  ){
    renderer.domElement.requestPointerLock();
  }
}

function mouseEvents(){

  document.addEventListener(
    "mousemove",
    e=>{

      if(
        document.pointerLockElement===
        renderer.domElement &&
        started &&
        !gameOver
      ){

        yaw-=e.movementX*.0022;

        pitch-=e.movementY*.0022;

        pitch=Math.max(
          -1.35,
          Math.min(1.35,pitch)
        );

        player.rotation.y=yaw;
        camera.rotation.x=pitch;
      }
    }
  );

  document.addEventListener(
    "mousedown",
    e=>{

      if(
        !started||
        gameOver||
        e.button!==0
      ) return;

      if(
        document.pointerLockElement!==
        renderer.domElement
      ){

        lockPointer();
      }

      mouseDown=true;

      shoot();
    }
  );

  document.addEventListener(
    "mouseup",
    e=>{

      if(e.button===0){
        mouseDown=false;
      }
    }
  );
}

/* =========================================================
   KEYBOARD
   ========================================================= */

function keyboardEvents(){

  document.addEventListener(
    "keydown",
    e=>{

      keys[e.code]=true;

      if(e.code==="Backquote"){

        e.preventDefault();

        toggleConsole();

        return;
      }

      if(
        e.code==="Digit1"
      ){
        switchWeapon("pistol");
      }

      if(
        e.code==="Digit2"
      ){
        switchWeapon("smg");
      }

      if(
        e.code==="Digit3"
      ){
        switchWeapon("shotgun");
      }

      if(
        e.code==="Digit4"
      ){
        switchWeapon("rifle");
      }

      if(e.code==="KeyR"){
        reload();
      }

      if(e.code==="KeyC"){
        crouching=!crouching;
      }

      if(
        e.code==="Space" &&
        grounded
      ){

        grounded=false;
        velocityY=7;
      }
    }
  );

  document.addEventListener(
    "keyup",
    e=>{
      keys[e.code]=false;
    }
  );
}

/* =========================================================
   MOBILE
   ========================================================= */

function mobileEvents(){

  $("fireBtn").addEventListener(
    "touchstart",
    e=>{
      e.preventDefault();
      shoot();
    },
    {passive:false}
  );

  $("reloadBtn").addEventListener(
    "touchstart",
    e=>{
      e.preventDefault();
      reload();
    },
    {passive:false}
  );

  $("switchBtn").addEventListener(
    "touchstart",
    e=>{
      e.preventDefault();

      const order=[
        "pistol",
        "smg",
        "shotgun",
        "rifle"
      ];

      const i=
        order.indexOf(
          currentWeapon
        );

      switchWeapon(
        order[
          (i+1)%order.length
        ]
      );
    },
    {passive:false}
  );

  $("sprintBtn").addEventListener(
    "touchstart",
    e=>{
      e.preventDefault();
      sprinting=true;
    },
    {passive:false}
  );

  $("sprintBtn").addEventListener(
    "touchend",
    e=>{
      e.preventDefault();
      sprinting=false;
    },
    {passive:false}
  );

  $("crouchBtn").addEventListener(
    "touchstart",
    e=>{
      e.preventDefault();
      crouching=!crouching;
    },
    {passive:false}
  );

  const joy=$("joy");
  const knob=$("joyKnob");

  joy.addEventListener(
    "touchmove",
    e=>{

      e.preventDefault();

      const t=e.touches[0];

      const r=
        joy.getBoundingClientRect();

      const cx=
        r.left+r.width/2;

      const cy=
        r.top+r.height/2;

      let dx=
        t.clientX-cx;

      let dy=
        t.clientY-cy;

      const max=40;

      const len=Math.sqrt(
        dx*dx+dy*dy
      );

      if(len>max){

        dx=dx/len*max;
        dy=dy/len*max;
      }

      joyX=dx/max;
      joyY=dy/max;

      knob.style.transform=
        "translate("+dx+"px,"+
        dy+"px)";

    },
    {passive:false}
  );

  joy.addEventListener(
    "touchend",
    ()=>{

      joyX=0;
      joyY=0;

      knob.style.transform=
        "translate(0,0)";
    }
  );
}

/* =========================================================
   CONSOLE INPUT
   ========================================================= */

function consoleEvents(){

  $("consoleInput").addEventListener(
    "keydown",
    e=>{

      if(e.key==="Enter"){

        command(
          e.target.value
        );

        e.target.value="";
      }

      if(e.key==="Escape"){
        toggleConsole();
      }
    }
  );
}

/* =========================================================
   START
   ========================================================= */

$("startBtn").addEventListener(
  "click",
  ()=>{

    $("loading").style.display=
      "block";

    initAudio();

    if(
      audioCtx &&
      audioCtx.state==="suspended"
    ){
      audioCtx.resume();
    }

    setTimeout(()=>{

      $("startScreen").style.display=
        "none";

      started=true;

      spawnWave();

      lockPointer();

    },500);
  }
);

/* =========================================================
   PARTICLES
   ========================================================= */

function updateParticles(dt){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=particles[i];

    p.userData.life-=dt;

    p.position.x+=
      p.userData.vx*dt;

    p.position.y+=
      p.userData.vy*dt;

    p.position.z+=
      p.userData.vz*dt;

    p.userData.vy-=7*dt;

    p.scale.multiplyScalar(.98);

    if(
      p.userData.life<=0
    ){

      scene.remove(p);

      particles.splice(i,1);
    }
  }
}

/* =========================================================
   SHELL UPDATE
   ========================================================= */

function updateShells(dt){

  for(
    let i=shells.length-1;
    i>=0;
    i--
  ){

    const s=shells[i];

    s.userData.life-=dt;

    s.position.x+=
      s.userData.vx*dt;

    s.position.y+=
      s.userData.vy*dt;

    s.position.z+=
      s.userData.vz*dt;

    s.userData.vy-=7*dt;

    s.rotation.x+=
      s.userData.spin*dt;

    s.rotation.z+=
      s.userData.spin*.7*dt;

    if(s.position.y<.1){

      s.position.y=.1;

      s.userData.vy*=-.25;

      s.userData.vx*=.8;
      s.userData.vz*=.8;
    }

    if(
      s.userData.life<=0
    ){

      scene.remove(s);

      shells.splice(i,1);
    }
  }
}

/* =========================================================
   MUZZLE
   ========================================================= */

function updateMuzzle(dt){

  if(muzzleFlashTime>0){

    muzzleFlashTime-=dt;

    if(muzzleLight){
      muzzleLight.intensity=8;
    }

  }else{

    if(muzzleLight){
      muzzleLight.intensity=0;
    }
  }
}

/* =========================================================
   AUTO FIRE
   ========================================================= */

function autoFire(){

  if(
    mouseDown &&
    started &&
    !gameOver
  ){

    const w=weapons[currentWeapon];

    if(w.automatic){
      shoot();
    }
  }
}

/* =========================================================
   WAVE
   ========================================================= */

function updateWave(){

  if(
    started &&
    !gameOver &&
    zombies.length===0 &&
    waveKills>=waveTarget
  ){

    wave++;

    setTimeout(()=>{

      if(!gameOver){
        spawnWave();
      }

    },1500);
  }
}

/* =========================================================
   GAME OVER
   ========================================================= */

function endGame(){

  gameOver=true;

  showMessage("YOU DIED");

  setTimeout(()=>{

    const overlay=
      document.createElement("div");

    overlay.id="gameOverOverlay";

    overlay.style.position="fixed";
    overlay.style.inset="0";
    overlay.style.zIndex="300";
    overlay.style.display="flex";
    overlay.style.alignItems="center";
    overlay.style.justifyContent="center";
    overlay.style.background=
      "rgba(0,0,0,.78)";

    overlay.innerHTML=`
      <div style="
        background:#020617;
        border:1px solid #ef4444;
        border-radius:18px;
        padding:35px;
        min-width:290px;
        text-align:center;
      ">
        <h1 style="
          color:#ef4444;
          font-size:42px;
          margin-bottom:12px;
        ">YOU DIED</h1>

        <p style="
          line-height:1.8;
          margin-bottom:20px;
        ">
          SCORE: ${score}<br>
          WAVE: ${wave}
        </p>

        <button id="restartBtn" style="
          border:0;
          border-radius:8px;
          padding:13px 28px;
          background:#22d3ee;
          color:#001018;
          font-weight:900;
          cursor:pointer;
        ">
          RESTART
        </button>
      </div>
    `;

    document.body.appendChild(
      overlay
    );

    $("restartBtn").onclick=()=>{
      location.reload();
    };

  },700);
}

/* =========================================================
   EVENTS
   ========================================================= */

function addEvents(){

  mouseEvents();
  keyboardEvents();
  mobileEvents();
  consoleEvents();

  window.addEventListener(
    "resize",
    ()=>{

      camera.aspect=
        innerWidth/innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        innerWidth,
        innerHeight
      );
    }
  );
}

/* =========================================================
   ANIMATION
   ========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  const dt=Math.min(
    .05,
    clock.getDelta()
  );

  if(
    started &&
    !gameOver
  ){

    updatePlayer(dt);
    updateZombies(dt);
    updatePickups(dt);
    updateParticles(dt);
    updateShells(dt);
    updateMuzzle(dt);
    autoFire();
    updateWave();
  }

  renderer.render(
    scene,
    camera
  );
}

/* =========================================================
   START ENGINE
   ========================================================= */

initScene();
updateHUD();

</script>
