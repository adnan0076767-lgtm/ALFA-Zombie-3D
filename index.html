<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ALFA ZOMBIE 3D V4.1 | CITY SURVIVAL</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#9db2c4;
  font-family:Arial,Helvetica,sans-serif;
  user-select:none;
}

#game{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  color:white;
  text-shadow:0 2px 5px #000;
}

#topLeft{
  position:absolute;
  left:18px;
  top:18px;
  font-size:15px;
  line-height:1.6;
}

#topRight{
  position:absolute;
  right:18px;
  top:18px;
  text-align:right;
  font-weight:bold;
}

#weaponName{
  font-size:22px;
  letter-spacing:1px;
}

#ammo{
  font-size:34px;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:24px;
  height:24px;
  transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:white;
  box-shadow:0 0 4px #000;
}

#crosshair:before{
  width:2px;
  height:24px;
  left:11px;
  top:0;
}

#crosshair:after{
  width:24px;
  height:2px;
  left:0;
  top:11px;
}

#hitmarker{
  position:absolute;
  left:50%;
  top:50%;
  width:32px;
  height:32px;
  transform:translate(-50%,-50%) rotate(45deg);
  border:3px solid transparent;
  opacity:0;
}

#healthBox{
  position:absolute;
  left:18px;
  bottom:20px;
  width:260px;
}

.bar{
  width:100%;
  height:18px;
  border:2px solid rgba(255,255,255,.8);
  background:rgba(0,0,0,.45);
  border-radius:8px;
  overflow:hidden;
  margin-top:5px;
}

.barFill{
  height:100%;
  width:100%;
  transition:.15s;
}

#healthFill{
  background:#e53935;
}

#staminaFill{
  background:#29b6f6;
}

#status{
  margin-top:7px;
  font-size:13px;
}

#message{
  position:absolute;
  left:50%;
  bottom:115px;
  transform:translateX(-50%);
  font-size:18px;
  font-weight:bold;
  opacity:0;
  transition:.2s;
}

#console{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(700px,92vw);
  background:rgba(3,7,18,.96);
  border:1px solid #20d8ff;
  box-shadow:0 0 35px rgba(0,200,255,.25);
  color:#8ff4ff;
  padding:18px;
  display:none;
  z-index:20;
}

#consoleLog{
  height:250px;
  overflow:auto;
  font-family:monospace;
  font-size:13px;
  white-space:pre-wrap;
  margin-bottom:10px;
}

#consoleInput{
  width:100%;
  padding:12px;
  background:#020617;
  color:#fff;
  border:1px solid #20d8ff;
  outline:none;
  font-family:monospace;
}

#startScreen{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 35%,rgba(25,100,160,.25),transparent 35%),
    linear-gradient(180deg,#14283b,#07111d);
  color:white;
  text-align:center;
}

.startCard{
  width:min(620px,92vw);
  padding:32px;
  border:1px solid rgba(100,220,255,.45);
  background:rgba(2,8,18,.84);
  box-shadow:0 0 60px rgba(0,180,255,.18);
  border-radius:18px;
}

.startCard h1{
  font-size:clamp(28px,6vw,58px);
  letter-spacing:4px;
  margin-bottom:8px;
}

.startCard p{
  color:#b9d6e7;
  line-height:1.6;
  margin:10px 0 22px;
}

#startBtn{
  border:0;
  background:#18aee8;
  color:white;
  font-weight:bold;
  padding:15px 30px;
  border-radius:10px;
  cursor:pointer;
  font-size:17px;
  box-shadow:0 0 25px rgba(24,174,232,.4);
}

#mobile{
  display:none;
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:10;
}

.mobileBtn{
  pointer-events:auto;
  position:absolute;
  width:64px;
  height:64px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.5);
  background:rgba(0,0,0,.38);
  color:white;
  font-weight:bold;
  touch-action:none;
}

#fireBtn{
  right:25px;
  bottom:100px;
  width:90px;
  height:90px;
  background:rgba(190,30,30,.5);
}

#reloadBtn{
  right:30px;
  bottom:30px;
}

#switchBtn{
  right:105px;
  bottom:30px;
}

#sprintBtn{
  left:110px;
  bottom:35px;
}

@media(max-width:800px){
  #mobile{display:block}
  #topLeft{font-size:11px}
  #topRight{right:10px;top:10px}
  #weaponName{font-size:15px}
  #ammo{font-size:25px}
  #healthBox{width:190px}
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">

  <div id="topLeft">
    <div>WAVE: <b id="wave">1</b></div>
    <div>ZOMBIES: <b id="zombies">0</b></div>
    <div>SCORE: <b id="score">0</b></div>
  </div>

  <div id="topRight">
    <div id="weaponName">PISTOL</div>
    <div id="ammo">12 / 72</div>
  </div>

  <div id="crosshair"></div>
  <div id="hitmarker"></div>

  <div id="message"></div>

  <div id="healthBox">
    <div>HEALTH</div>
    <div class="bar">
      <div id="healthFill" class="barFill"></div>
    </div>

    <div>STAMINA</div>
    <div class="bar">
      <div id="staminaFill" class="barFill"></div>
    </div>

    <div id="status">DAYLIGHT CITY SURVIVAL</div>
  </div>

</div>

<div id="console">
  <div id="consoleLog">ALFA COMMAND CONSOLE V4.1</div>
  <input id="consoleInput" autocomplete="off" placeholder="help">
</div>

<div id="mobile">
  <button class="mobileBtn" id="fireBtn">FIRE</button>
  <button class="mobileBtn" id="reloadBtn">R</button>
  <button class="mobileBtn" id="switchBtn">WEAPON</button>
  <button class="mobileBtn" id="sprintBtn">RUN</button>
</div>

<div id="startScreen">
  <div class="startCard">
    <h1>ALFA ZOMBIE 3D</h1>
    <h2>V4.1 CITY SURVIVAL</h2>
    <p>
      REALISTIC PROCEDURAL CITY • ZOMBIE SURVIVAL • 4 WEAPONS
      <br>
      WASD • SHIFT • CTRL • MOUSE • 1-4 • R • `
    </p>
    <button id="startBtn">CLICK / TAP TO START</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
"use strict";

/* =========================================================
   ALFA ZOMBIE 3D V4.1
   ========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x9fb8ca);
scene.fog = new THREE.Fog(0x9fb8ca,45,180);

const camera = new THREE.PerspectiveCamera(
  72,
  innerWidth / innerHeight,
  0.05,
  500
);

camera.position.set(0,1.7,8);

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.getElementById("game").appendChild(renderer.domElement);

/* =========================================================
   LIGHTING
   ========================================================= */

const hemi = new THREE.HemisphereLight(
  0xdcefff,
  0x52616b,
  2.0
);

scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffffff,2.8);
sun.position.set(-50,80,30);
sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.left = -120;
sun.shadow.camera.right = 120;
sun.shadow.camera.top = 120;
sun.shadow.camera.bottom = -120;

scene.add(sun);

const fill = new THREE.DirectionalLight(0x9edbff,0.7);
fill.position.set(40,20,-40);
scene.add(fill);

/* =========================================================
   MATERIALS
   ========================================================= */

const MAT = {
  road:new THREE.MeshStandardMaterial({
    color:0x343a40,
    roughness:.95
  }),

  sidewalk:new THREE.MeshStandardMaterial({
    color:0x8b9298,
    roughness:.9
  }),

  building1:new THREE.MeshStandardMaterial({
    color:0x68747c,
    roughness:.85
  }),

  building2:new THREE.MeshStandardMaterial({
    color:0x9a8f82,
    roughness:.85
  }),

  concrete:new THREE.MeshStandardMaterial({
    color:0x737b80,
    roughness:1
  }),

  glass:new THREE.MeshStandardMaterial({
    color:0x153d56,
    metalness:.25,
    roughness:.2
  }),

  windowLight:new THREE.MeshStandardMaterial({
    color:0xdcecff,
    emissive:0x4c7390,
    emissiveIntensity:.45
  }),

  black:new THREE.MeshStandardMaterial({
    color:0x111417,
    roughness:.7,
    metalness:.25
  }),

  metal:new THREE.MeshStandardMaterial({
    color:0x4d555b,
    roughness:.35,
    metalness:.8
  }),

  darkMetal:new THREE.MeshStandardMaterial({
    color:0x181c20,
    roughness:.28,
    metalness:.8
  }),

  rubber:new THREE.MeshStandardMaterial({
    color:0x111111,
    roughness:1
  }),

  red:new THREE.MeshStandardMaterial({
    color:0xa71919,
    roughness:.65
  }),

  zombieSkin:new THREE.MeshStandardMaterial({
    color:0x65715e,
    roughness:1
  }),

  zombieSkinDark:new THREE.MeshStandardMaterial({
    color:0x485342,
    roughness:1
  }),

  zombieShirt:new THREE.MeshStandardMaterial({
    color:0x384957,
    roughness:1
  }),

  zombiePants:new THREE.MeshStandardMaterial({
    color:0x252d35,
    roughness:1
  }),

  eye:new THREE.MeshStandardMaterial({
    color:0xffffff,
    emissive:0x441111,
    emissiveIntensity:.6
  }),

  mouth:new THREE.MeshStandardMaterial({
    color:0x180b0b,
    roughness:1
  }),

  teeth:new THREE.MeshStandardMaterial({
    color:0xd8d0b7,
    roughness:.8
  })
};

/* =========================================================
   HELPERS
   ========================================================= */

function box(w,h,d,mat){
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    mat
  );
  m.castShadow=true;
  m.receiveShadow=true;
  return m;
}

function cyl(r1,r2,h,mat,segments=12){
  const m = new THREE.Mesh(
    new THREE.CylinderGeometry(r1,r2,h,segments),
    mat
  );
  m.castShadow=true;
  m.receiveShadow=true;
  return m;
}

function sphere(r,mat){
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(r,18,14),
    mat
  );
  m.castShadow=true;
  m.receiveShadow=true;
  return m;
}

function addPart(parent,obj,name,part){
  obj.name=name;
  obj.userData.part=part || name;
  parent.add(obj);
  return obj;
}

/* =========================================================
   GROUND / CITY
   ========================================================= */

const ground = box(300,.2,300,MAT.concrete);
ground.position.y=-.15;
ground.receiveShadow=true;
scene.add(ground);

const road = box(22,.12,280,MAT.road);
road.position.set(0,.01,0);
scene.add(road);

const road2 = box(280,.12,18,MAT.road);
road2.position.set(0,.02,-35);
scene.add(road2);

/* lane markings */

for(let z=-130;z<140;z+=12){

  const mark = box(.25,.025,6,new THREE.MeshStandardMaterial({
    color:0xd9d9d9,
    roughness:.8
  }));

  mark.position.set(0,.09,z);
  scene.add(mark);
}

for(let x=-135;x<140;x+=12){

  const mark = box(6,.025,.25,new THREE.MeshStandardMaterial({
    color:0xe5e5e5
  }));

  mark.position.set(x,.1,-35);
  scene.add(mark);
}

/* sidewalks */

for(const x of [-15,15]){

  const s = box(8,.5,280,MAT.sidewalk);
  s.position.set(x,.15,0);
  scene.add(s);
}

for(const z of [-47,-23]){

  const s = box(280,.5,6,MAT.sidewalk);
  s.position.set(0,.15,z);
  scene.add(s);
}

/* =========================================================
   BUILDINGS
   ========================================================= */

function createBuilding(x,z,w,h,d,type=1){

  const g = new THREE.Group();

  const body = box(
    w,
    h,
    d,
    type===1 ? MAT.building1 : MAT.building2
  );

  body.position.y=h/2;
  g.add(body);

  /* roof */

  const roof = box(
    w+.25,
    .35,
    d+.25,
    MAT.concrete
  );

  roof.position.y=h+.17;
  g.add(roof);

  /* windows */

  const cols=Math.max(2,Math.floor(w/3));
  const rows=Math.max(2,Math.floor(h/3));

  for(let ix=0;ix<cols;ix++){

    const px=-w/2+1.5+ix*((w-3)/(cols-1));

    for(let iy=0;iy<rows;iy++){

      const py=2+iy*2.7;

      if(py>h-1.5) continue;

      for(const side of [-1,1]){

        const win=box(
          1.35,
          1.25,
          .08,
          MAT.windowLight
        );

        win.position.set(
          px,
          py,
          side*(d/2+.045)
        );

        g.add(win);
      }
    }
  }

  /* entrance */

  const door=box(
    1.7,
    2.7,
    .12,
    MAT.darkMetal
  );

  door.position.set(0,1.35,d/2+.08);
  g.add(door);

  const sign=box(
    Math.min(4,w*.45),
    .45,
    .1,
    MAT.glass
  );

  sign.position.set(0,h-1,d/2+.08);
  g.add(sign);

  g.position.set(x,0,z);

  scene.add(g);
  return g;
}

/* guaranteed visible city */

createBuilding(-31,-20,14,16,14,1);
createBuilding(31,-20,14,22,14,2);

createBuilding(-34,20,18,12,16,2);
createBuilding(34,20,18,18,16,1);

createBuilding(-34,60,18,26,18,1);
createBuilding(34,60,18,14,18,2);

createBuilding(-34,105,20,18,20,2);
createBuilding(34,105,20,28,20,1);

createBuilding(-34,-85,18,20,18,1);
createBuilding(34,-85,18,15,18,2);

/* =========================================================
   STREET LIGHTS
   ========================================================= */

function createStreetLight(x,z){

  const g=new THREE.Group();

  const pole=cyl(.09,.13,6,MAT.darkMetal,10);
  pole.position.y=3;
  g.add(pole);

  const arm=box(1.5,.08,.08,MAT.darkMetal);
  arm.position.set(x<0?0.65:-.65,6,0);
  g.add(arm);

  const lamp=sphere(.18,MAT.windowLight);
  lamp.position.set(x<0?1.35:-1.35,5.85,0);
  g.add(lamp);

  g.position.set(x,z===undefined?0:z);
  scene.add(g);

  return g;
}

for(let z=-120;z<130;z+=22){
  createStreetLight(-11,z);
  createStreetLight(11,z);
}

/* =========================================================
   CAR
   ========================================================= */

function createCar(x,z,color=0x9d2020,rotation=0){

  const g=new THREE.Group();

  const body=box(3.7,.9,6.4,new THREE.MeshStandardMaterial({
    color,
    roughness:.65,
    metalness:.25
  }));

  body.position.y=.9;
  g.add(body);

  const hood=box(3.45,.38,1.7,new THREE.MeshStandardMaterial({
    color,
    roughness:.65,
    metalness:.25
  }));

  hood.position.set(0,1.48,2.0);
  g.add(hood);

  const cabin=box(3.15,1.25,2.9,MAT.glass);
  cabin.position.set(0,1.75,-.35);
  g.add(cabin);

  const roof=box(3.05,.15,2.8,MAT.black);
  roof.position.set(0,2.42,-.35);
  g.add(roof);

  const bumper1=box(3.8,.3,.25,MAT.black);
  bumper1.position.set(0,.65,3.22);
  g.add(bumper1);

  const bumper2=box(3.8,.3,.25,MAT.black);
  bumper2.position.set(0,.65,-3.22);
  g.add(bumper2);

  for(const xx of [-1.7,1.7]){
    for(const zz of [-2.15,2.15]){

      const wheel=cyl(
        .58,
        .58,
        .35,
        MAT.rubber,
        18
      );

      wheel.rotation.z=Math.PI/2;
      wheel.position.set(xx,.62,zz);
      g.add(wheel);

      const hub=cyl(
        .24,
        .24,
        .37,
        MAT.metal,
        16
      );

      hub.rotation.z=Math.PI/2;
      hub.position.set(xx,.62,zz);
      g.add(hub);
    }
  }

  for(const xx of [-1.2,1.2]){

    const head=sphere(.2,new THREE.MeshStandardMaterial({
      color:0xfff4cc,
      emissive:0xffd77a,
      emissiveIntensity:1.2
    }));

    head.position.set(xx,1.15,3.27);
    g.add(head);
  }

  for(const xx of [-1.2,1.2]){

    const tail=sphere(.18,new THREE.MeshStandardMaterial({
      color:0xff1515,
      emissive:0x550000,
      emissiveIntensity:.8
    }));

    tail.position.set(xx,1.15,-3.27);
    g.add(tail);
  }

  g.position.set(x,0,z);
  g.rotation.y=rotation;

  scene.add(g);

  return g;
}

/* visible cars */

createCar(-6,-12,0x263f6b,.08);
createCar(7,28,0x8d2525,-.05);
createCar(-6,72,0x777b80,.03);
createCar(7,96,0x345f42,-.08);

/* =========================================================
   ZOMBIES
   ========================================================= */

const zombies=[];

function createZombie(type="normal",position){

  const root=new THREE.Group();

  let scale=1;
  let hp=100;
  let speed=1.25;
  let shirt=MAT.zombieShirt;
  let skin=MAT.zombieSkin;

  if(type==="fast"){
    scale=.9;
    hp=75;
    speed=2.35;
    shirt=new THREE.MeshStandardMaterial({
      color:0x5c3030,
      roughness:1
    });
  }

  if(type==="tank"){
    scale=1.35;
    hp=260;
    speed=.7;
    shirt=new THREE.MeshStandardMaterial({
      color:0x252d29,
      roughness:1
    });
    skin=MAT.zombieSkinDark;
  }

  /* pelvis */

  const pelvis=box(
    1.0*scale,
    .65*scale,
    .65*scale,
    MAT.zombiePants
  );

  pelvis.position.y=1.05*scale;
  addPart(root,pelvis,"pelvis","body");

  /* torso */

  const torso=box(
    1.35*scale,
    1.65*scale,
    .7*scale,
    shirt
  );

  torso.position.y=2.05*scale;
  addPart(root,torso,"torso","body");

  /* neck */

  const neck=cyl(
    .23*scale,
    .27*scale,
    .38*scale,
    skin,
    12
  );

  neck.position.y=3.02*scale;
  addPart(root,neck,"neck","body");

  /* head */

  const head=sphere(
    .57*scale,
    skin
  );

  head.position.set(0,3.65*scale,0);
  head.scale.set(1,.98,.92);

  addPart(root,head,"HEAD","head");

  /* cheeks */

  const cheekL=sphere(.34*scale,skin);
  cheekL.position.set(-.32*scale,3.53*scale,.37*scale);
  cheekL.scale.set(1,.9,.6);
  addPart(root,cheekL,"cheekL","face");

  const cheekR=sphere(.34*scale,skin);
  cheekR.position.set(.32*scale,3.53*scale,.37*scale);
  cheekR.scale.set(1,.9,.6);
  addPart(root,cheekR,"cheekR","face");

  /* eyes */

  for(const side of [-1,1]){

    const eye=sphere(
      .105*scale,
      MAT.eye
    );

    eye.position.set(
      side*.21*scale,
      3.78*scale,
      .50*scale
    );

    addPart(root,eye,"eye","face");
  }

  /* pupils */

  for(const side of [-1,1]){

    const pupil=sphere(
      .045*scale,
      MAT.mouth
    );

    pupil.position.set(
      side*.21*scale,
      3.78*scale,
      .59*scale
    );

    addPart(root,pupil,"pupil","face");
  }

  /* nose */

  const nose=box(
    .16*scale,
    .23*scale,
    .28*scale,
    skin
  );

  nose.position.set(
    0,
    3.56*scale,
    .54*scale
  );

  addPart(root,nose,"nose","face");

  /* mouth */

  const mouth=box(
    .52*scale,
    .18*scale,
    .10*scale,
    MAT.mouth
  );

  mouth.position.set(
    0,
    3.31*scale,
    .52*scale
  );

  addPart(root,mouth,"mouth","face");

  /* teeth */

  for(let i=-2;i<=2;i++){

    const tooth=box(
      .075*scale,
      .09*scale,
      .035*scale,
      MAT.teeth
    );

    tooth.position.set(
      i*.10*scale,
      3.36*scale,
      .59*scale
    );

    addPart(root,tooth,"tooth","face");
  }

  /* ears */

  for(const side of [-1,1]){

    const ear=sphere(
      .18*scale,
      skin
    );

    ear.position.set(
      side*.55*scale,
      3.63*scale,
      0
    );

    addPart(root,ear,"ear","face");
  }

  /* arms */

  const armGroups=[];

  for(const side of [-1,1]){

    const ag=new THREE.Group();

    const upper=cyl(
      .20*scale,
      .24*scale,
      .95*scale,
      skin,
      12
    );

    upper.rotation.z=side*.16;
    upper.position.y=-.47*scale;
    ag.add(upper);

    const lower=cyl(
      .16*scale,
      .20*scale,
      .9*scale,
      skin,
      12
    );

    lower.position.y=-1.25*scale;
    lower.rotation.z=side*.12;
    ag.add(lower);

    const hand=sphere(
      .24*scale,
      skin
    );

    hand.position.y=-1.77*scale;
    ag.add(hand);

    ag.position.set(
      side*.9*scale,
      2.65*scale,
      0
    );

    root.add(ag);
    armGroups.push(ag);
  }

  /* legs */

  const legGroups=[];

  for(const side of [-1,1]){

    const lg=new THREE.Group();

    const thigh=cyl(
      .24*scale,
      .29*scale,
      .9*scale,
      MAT.zombiePants,
      12
    );

    thigh.position.y=-.55*scale;
    lg.add(thigh);

    const shin=cyl(
      .17*scale,
      .22*scale,
      .95*scale,
      MAT.zombiePants,
      12
    );

    shin.position.y=-1.4*scale;
    lg.add(shin);

    const foot=box(
      .38*scale,
      .22*scale,
      .65*scale,
      MAT.black
    );

    foot.position.set(
      0,
      -1.93*scale,
      .16*scale
    );

    lg.add(foot);

    lg.position.set(
      side*.38*scale,
      1.05*scale,
      0
    );

    root.add(lg);
    legGroups.push(lg);
  }

  root.scale.setScalar(1);

  if(position){
    root.position.copy(position);
  }

  root.userData = {
    type,
    hp,
    maxHp:hp,
    speed,
    scale,
    armGroups,
    legGroups,
    dead:false,
    deathTimer:0,
    attackTimer:0,
    hitFlash:0
  };

  root.traverse(o=>{
    if(o.isMesh){
      o.userData.zombie=root;
    }
  });

  scene.add(root);
  zombies.push(root);

  return root;
}

let audioCtx=null;

function initAudio(){

  if(audioCtx) return;

  audioCtx=new (
    window.AudioContext ||
    window.webkitAudioContext
  )();

  if(audioCtx.state==="suspended"){
    audioCtx.resume();
  }
}

function noiseBuffer(duration=.15){

  const length=Math.floor(
    audioCtx.sampleRate*duration
  );

  const buffer=audioCtx.createBuffer(
    1,
    length,
    audioCtx.sampleRate
  );

  const data=buffer.getChannelData(0);

  for(let i=0;i<length;i++){
    data[i]=(Math.random()*2-1);
  }

  return buffer;
}

/* pistol-like synthesized gunshot:
   sharp crack + low punch + noise tail */

function gunshotPistol(){

  if(!audioCtx) return;

  const now=audioCtx.currentTime;

  /* low punch */

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="sine";
  osc.frequency.setValueAtTime(110,now);
  osc.frequency.exponentialRampToValueAtTime(48,now+.12);

  gain.gain.setValueAtTime(.0001,now);
  gain.gain.exponentialRampToValueAtTime(.8,now+.006);
  gain.gain.exponentialRampToValueAtTime(.0001,now+.15);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+.16);

  /* sharp crack */

  const crack=audioCtx.createBufferSource();
  crack.buffer=noiseBuffer(.12);

  const filter=audioCtx.createBiquadFilter();
  filter.type="highpass";
  filter.frequency.value=1800;

  const cg=audioCtx.createGain();

  cg.gain.setValueAtTime(.9,now);
  cg.gain.exponentialRampToValueAtTime(.0001,now+.08);

  crack.connect(filter);
  filter.connect(cg);
  cg.connect(audioCtx.destination);

  crack.start(now);
  crack.stop(now+.13);

  /* short secondary body */

  const body=audioCtx.createOscillator();
  const bg=audioCtx.createGain();

  body.type="triangle";
  body.frequency.setValueAtTime(420,now);
  body.frequency.exponentialRampToValueAtTime(90,now+.09);

  bg.gain.setValueAtTime(.35,now);
  bg.gain.exponentialRampToValueAtTime(.0001,now+.1);

  body.connect(bg);
  bg.connect(audioCtx.destination);

  body.start(now);
  body.stop(now+.11);
}

function gunshotGeneric(id){

  if(id==="pistol"){
    gunshotPistol();
    return;
  }

  if(!audioCtx) return;

  const now=audioCtx.currentTime;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type=id==="shotgun"?"sawtooth":"square";

  osc.frequency.setValueAtTime(
    id==="shotgun"?75:130,
    now
  );

  osc.frequency.exponentialRampToValueAtTime(
    45,
    now+.12
  );

  gain.gain.setValueAtTime(.0001,now);
  gain.gain.exponentialRampToValueAtTime(
    id==="shotgun"?.95:.55,
    now+.005
  );
  gain.gain.exponentialRampToValueAtTime(.0001,now+.15);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+.17);

  const n=audioCtx.createBufferSource();
  n.buffer=noiseBuffer(id==="shotgun"?.24:.1);

  const ng=audioCtx.createGain();

  ng.gain.setValueAtTime(
    id==="shotgun"?.8:.45,
    now
  );

  ng.gain.exponentialRampToValueAtTime(
    .0001,
    now+(id==="shotgun"?.2:.08)
  );

  n.connect(ng);
  ng.connect(audioCtx.destination);

  n.start(now);
  n.stop(now+(id==="shotgun"?.25:.12));
}

function reloadSound(){

  if(!audioCtx) return;

  const now=audioCtx.currentTime;

  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();

  o.type="square";
  o.frequency.setValueAtTime(650,now);
  o.frequency.setValueAtTime(320,now+.08);

  g.gain.setValueAtTime(.08,now);
  g.gain.exponentialRampToValueAtTime(.0001,now+.13);

  o.connect(g);
  g.connect(audioCtx.destination);

  o.start(now);
  o.stop(now+.15);
}

function zombieGrowl(){

  if(!audioCtx) return;

  const now=audioCtx.currentTime;

  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();

  o.type="sawtooth";
  o.frequency.setValueAtTime(85,now);
  o.frequency.linearRampToValueAtTime(55,now+.4);

  g.gain.setValueAtTime(.0001,now);
  g.gain.linearRampToValueAtTime(.09,now+.04);
  g.gain.exponentialRampToValueAtTime(.0001,now+.45);

  o.connect(g);
  g.connect(audioCtx.destination);

  o.start(now);
  o.stop(now+.5);
}

/* =========================================================
   RAYCAST / DAMAGE
   ========================================================= */

const raycaster=new THREE.Raycaster();

function damageZombie(z,amount,headshot=false){

  if(!z || z.userData.dead) return;

  z.userData.hp-=amount;
  z.userData.hitFlash=.08;

  blood(
    z.position.clone().add(
      new THREE.Vector3(
        0,
        2.4,
        0
      )
    ),
    headshot?12:6
  );

  if(headshot){
    score+=35;
    showMessage("HEADSHOT +35");
  }else{
    score+=10;
  }

  showHit();

  if(z.userData.hp<=0){
    killZombie(z);
  }
}

function shootRay(direction){

  raycaster.set(
    camera.position,
    direction
  );

  const meshes=[];

  zombies.forEach(z=>{
    if(!z.userData.dead){
      z.traverse(o=>{
        if(o.isMesh) meshes.push(o);
      });
    }
  });

  const hits=raycaster.intersectObjects(
    meshes,
    false
  );

  if(hits.length){

    const hit=hits[0];
    const mesh=hit.object;
    const z=mesh.userData.zombie;

    if(z){

      const headshot=
        mesh.userData.part==="head";

      let damage=weapons[currentWeapon].damage;

      if(headshot) damage*=2;

      damageZombie(
        z,
        damage,
        headshot
      );
    }
  }
}

function shoot(){

  const w=weapons[currentWeapon];

  const now=performance.now();

  if(reloading) return;

  if(now-lastShot<w.fireRate) return;

  if(w.ammo<=0){

    reload();

    return;
  }

  lastShot=now;
  w.ammo--;

  recoil=.16;

  gunshotGeneric(w.id);
  muzzle();
  smoke();
  casing();

  const pellets=w.pellets || 1;

  for(let i=0;i<pellets;i++){

    const spread=w.spread;

    const dir=new THREE.Vector3(
      (Math.random()-.5)*spread,
      (Math.random()-.5)*spread,
      -1
    );

    dir.applyQuaternion(camera.quaternion);
    dir.normalize();

    shootRay(dir);
  }

  updateHUD();
}

/* =========================================================
   RELOAD
   ========================================================= */

function reload(){

  const w=weapons[currentWeapon];

  if(reloading) return;
  if(w.ammo>=w.magSize) return;
  if(w.reserve<=0) return;

  reloading=true;
  reloadEnd=performance.now()+w.reloadTime;

  reloadSound();
  showMessage("RELOADING...");
}

function finishReload(){

  const w=weapons[currentWeapon];

  const needed=w.magSize-w.ammo;
  const take=Math.min(
    needed,
    w.reserve
  );

  w.ammo+=take;
  w.reserve-=take;

  reloading=false;

  updateHUD();
}

/* =========================================================
   ZOMBIE DEATH
   ========================================================= */

function killZombie(z){

  if(z.userData.dead) return;

  z.userData.dead=true;
  z.userData.deathTimer=0;

  score+=100;

  showMessage(
    z.userData.type.toUpperCase()+" DOWN +100"
  );

  zombieGrowl();
}

  }

  if(e.code==="KeyR"){
    reload();
  }

  if(e.code==="Digit1") switchWeapon(0);
  if(e.code==="Digit2") switchWeapon(1);
  if(e.code==="Digit3") switchWeapon(2);
  if(e.code==="Digit4") switchWeapon(3);

  if(e.code==="KeyC" || e.code==="ControlLeft"){
    keys.crouch=true;
  }
});

document.addEventListener("keyup",e=>{

  keys[e.code]=false;

  if(e.code==="KeyC" || e.code==="ControlLeft"){
    keys.crouch=false;
  }
});

document.addEventListener("mousemove",e=>{

  if(!pointerLocked) return;
  if(consoleOpen) return;

  yaw-=e.movementX*.0022;
  pitch-=e.movementY*.0022;

  pitch=Math.max(
    -1.45,
    Math.min(1.45,pitch)
  );
});

renderer.domElement.addEventListener("mousedown",e=>{

  if(!pointerLocked) return;

  if(e.button===0){
    firing=true;
    shoot();
  }
});

document.addEventListener("mouseup",e=>{

  if(e.button===0){
    firing=false;
  }
});

/* =========================================================
   START
   ========================================================= */

document.getElementById("startBtn").addEventListener(
  "click",
  startGame
);

function startGame(){

  initAudio();

  document.getElementById(
    "startScreen"
  ).style.display="none";

  renderer.domElement.requestPointerLock?.();

  spawnInitialWave();

  updateHUD();
}

document.addEventListener(
  "pointerlockchange",
  ()=>{
    pointerLocked=
      document.pointerLockElement===renderer.domElement;
  }
);

/* =========================================================
   WEAPON SWITCH
   ========================================================= */

function switchWeapon(index){

  if(index<0 || index>=weapons.length) return;
  if(reloading) return;

  currentWeapon=index;

  buildWeapon();
  updateHUD();

  showMessage(
    weapons[index].name
  );
}

/* =========================================================
   MOVEMENT
   ========================================================= */

let bobTime=0;

function updatePlayer(dt){

  const forward=new THREE.Vector3(
    -Math.sin(yaw),
    0,
    -Math.cos(yaw)
  );

  const right=new THREE.Vector3(
    Math.cos(yaw),
    0,
    -Math.sin(yaw)
  );

  let move=new THREE.Vector3();

  if(keys.KeyW) move.add(forward);
  if(keys.KeyS) move.sub(forward);
  if(keys.KeyD) move.add(right);
  if(keys.KeyA) move.sub(right);

  const moving=move.length()>0;

  if(moving){
    move.normalize();
  }

  let sprint=
    keys.ShiftLeft ||
    keys.ShiftRight;

  if(stamina<=1){
    sprint=false;
  }

  if(keys.crouch){
    sprint=false;
  }

  let speed=5;

  if(keys.crouch){
    speed=2.2;
  }else if(sprint && moving){
    speed=8;
    stamina-=28*dt;
  }else{
    stamina+=18*dt;
  }

  stamina=Math.max(
    0,
    Math.min(100,stamina)
  );

  camera.position.addScaledVector(
    move,
    speed*dt
  );

  /* keep player above ground */

  camera.position.y =
    keys.crouch ? 1.05 : 1.7;

  /* head bob */

  if(moving){

    bobTime+=dt*(sprint?13:8);

    camera.position.y+=
      Math.sin(bobTime)*(
        keys.crouch?.025:.045
      );
  }

  camera.rotation.order="YXZ";
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;
}

/* =========================================================
   ZOMBIE AI
   ========================================================= */

let growlTimer=0;

function updateZombies(dt){

  let living=0;

  zombies.forEach(z=>{

    const d=z.userData;

    if(d.dead){

      d.deathTimer+=dt;

      z.rotation.z=
        Math.min(
          Math.PI/2,
          d.deathTimer*5
        );

      z.position.y=
        Math.max(
          0,
          0-d.deathTimer*.25
        );

      return;
    }

    living++;

    const toPlayer=
      new THREE.Vector3()
      .subVectors(
        camera.position,
        z.position
      );

    const distance=toPlayer.length();

    toPlayer.y=0;

    if(toPlayer.length()>0){
      toPlayer.normalize();
    }

    z.lookAt(
      camera.position.x,
      z.position.y,
      camera.position.z
    );

    if(distance>2.1){

      z.position.addScaledVector(
        toPlayer,
        d.speed*dt
      );

      const walkSpeed=
        d.speed>2 ? 13 : 8;

      d.armGroups.forEach((a,i)=>{
        a.rotation.x=
          Math.sin(
            performance.now()*.001*walkSpeed+i*Math.PI
          )*.5;
      });

      d.legGroups.forEach((l,i)=>{
        l.rotation.x=
          Math.sin(
            performance.now()*.001*walkSpeed+i*Math.PI
          )*.45;
      });

    }else{

      d.attackTimer-=dt;

      if(d.attackTimer<=0){

        d.attackTimer=.9;

        if(!god){
          health-=
            d.type==="tank" ? 18 :
            d.type==="fast" ? 12 : 9;

          showMessage("ZOMBIE ATTACK!");

          updateHUD();
        }
      }
    }

    if(distance<35){

      growlTimer-=dt;

      if(growlTimer<=0){
        growlTimer=4;
        zombieGrowl();
      }
    }

    if(d.hitFlash>0){
      d.hitFlash-=dt;
      z.scale.setScalar(
        d.scale*(1+d.hitFlash*2)
      );
    }else{
      z.scale.setScalar(d.scale);
    }
  });

  document.getElementById(
    "zombies"
  ).textContent=living;

  if(health<=0){
    gameOver();
  }
}

/* =========================================================
   CONSOLE
   ========================================================= */

let consoleOpen=false;

function toggleConsole(){

  consoleOpen=!consoleOpen;

  const el=document.getElementById("console");

  el.style.display=
    consoleOpen ? "block":"none";

  if(consoleOpen){

    document.exitPointerLock?.();

    document.getElementById(
      "consoleInput"
    ).focus();
  }else{

    renderer.domElement.requestPointerLock?.();
  }
}

const consoleInput=
  document.getElementById("consoleInput");

const consoleLog=
  document.getElementById("consoleLog");

function clog(t){

  consoleLog.textContent +=
    "\n> "+t;

  consoleLog.scrollTop=
    consoleLog.scrollHeight;
}

consoleInput.addEventListener(
  "keydown",
  e=>{

    if(e.key!=="Enter") return;

    const cmd=
      consoleInput.value
      .trim()
      .toLowerCase();

    consoleInput.value="";

    executeCommand(cmd);
  }
);

function executeCommand(cmd){

  if(!cmd) return;

  if(cmd==="help"){

    clog(
`help
status
ammo
heal
god
spawn zombie
spawn fast
spawn tank
clear
speed
day
night
give ammo
give medkit
weapon pistol
weapon smg
weapon shotgun
weapon rifle`
    );

    return;
  }

  if(cmd==="status"){
    clog(
      "HP="+Math.round(health)+
      " | WAVE="+wave+
      " | SCORE="+score+
      " | WEAPON="+weapons[currentWeapon].name
    );
    return;
  }

  if(cmd==="ammo"){
    weapons.forEach(w=>{
      w.reserve+=100;
      w.ammo=w.magSize;
    });

    clog("AMMO REFILLED");
    updateHUD();
    return;
  }

  if(cmd==="heal"){
    health=100;
    clog("HEALTH RESTORED");
    updateHUD();
    return;
  }

  if(cmd==="god"){
    god=!god;
    clog("GOD MODE: "+god);
    return;
  }

  if(cmd==="spawn zombie"){
    spawnZombie("normal",25);
    clog("NORMAL ZOMBIE SPAWNED");
    return;
  }

  if(cmd==="spawn fast"){
    spawnZombie("fast",25);
    clog("FAST ZOMBIE SPAWNED");
    return;
  }

  if(cmd==="spawn tank"){
    spawnZombie("tank",30);
    clog("TANK ZOMBIE SPAWNED");
    return;
  }

  if(cmd==="clear"){

    zombies.forEach(z=>{
      scene.remove(z);
    });

    zombies.length=0;

    clog("ZOMBIES CLEARED");
    return;
  }

  if(cmd==="speed"){

    weapons.forEach(w=>{
      w.fireRate=Math.max(
        45,
        w.fireRate*.65
      );
    });

    clog("WEAPON FIRE RATE BOOSTED");
    return;
  }

  if(cmd==="day"){

    scene.background.set(0x9fb8ca);
    scene.fog.color.set(0x9fb8ca);
    sun.intensity=2.8;

    clog("DAY MODE");
    return;
  }

  if(cmd==="night"){

    scene.background.set(0x07111f);
    scene.fog.color.set(0x07111f);
    sun.intensity=.35;

    clog("NIGHT MODE");
    return;
  }

  if(cmd==="give ammo"){

    weapons[currentWeapon].reserve+=
      weapons[currentWeapon].magSize*5;

    updateHUD();
    clog("AMMO GIVEN");
    return;
  }

  if(cmd==="give medkit"){

    health=Math.min(
      100,
      health+50
    );

    updateHUD();
    clog("MEDKIT USED");
    return;
  }

  if(cmd.startsWith("weapon ")){

    const name=cmd.split(" ")[1];

    const index=
      weapons.findIndex(
        w=>w.id===name
      );

    if(index>=0){

      switchWeapon(index);
      clog(
        "WEAPON: "+
        weapons[index].name
      );

    }else{

      clog(
        "UNKNOWN WEAPON"
      );
    }

    return;
  }

  clog("UNKNOWN COMMAND");
}

/* =========================================================
   HUD
   ========================================================= */

function updateHUD(){

  const w=weapons[currentWeapon];

  document.getElementById(
    "weaponName"
  ).textContent=w.name;

  document.getElementById(
    "ammo"
  ).textContent=
    w.ammo+" / "+w.reserve;

  document.getElementById(
    "healthFill"
  ).style.width=
    Math.max(0,health)+"%";

  document.getElementById(
    "staminaFill"
  ).style.width=
    stamina+"%";

  document.getElementById(
    "wave"
  ).textContent=wave;

  document.getElementById(
    "score"
  ).textContent=score;
}

function showMessage(text){

  const el=
    document.getElementById("message");

  el.textContent=text;
  el.style.opacity=1;

  clearTimeout(
    showMessage.timer
  );

  showMessage.timer=setTimeout(
    ()=>{
      el.style.opacity=0;
    },
    900
  );
}

function showHit(){

  const el=
    document.getElementById(
      "hitmarker"
    );

  el.style.opacity=1;

  clearTimeout(
    showHit.timer
  );

  showHit.timer=setTimeout(
    ()=>{
      el.style.opacity=0;
    },
    90
  );
}

/* =========================================================
   GAME OVER
   ========================================================= */

function gameOver(){

  health=100;
  stamina=100;

  zombies.forEach(z=>{
    scene.remove(z);
  });

  zombies.length=0;

  wave=1;
  score=0;

  showMessage(
    "YOU DIED — CITY RESET"
  );

  setTimeout(
    ()=>{
      spawnInitialWave();
      updateHUD();
    },
    1200
  );
}

/* =========================================================
   RESIZE
   ========================================================= */

addEventListener(
  "resize",
  ()=>{
    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);

/* =========================================================
   MAIN LOOP
   ========================================================= */

let lastTime=performance.now();

function animate(){

  requestAnimationFrame(animate);

  const now=performance.now();

  let dt=(now-lastTime)/1000;
  lastTime=now;

  dt=Math.min(dt,.05);

  if(!consoleOpen){

    updatePlayer(dt);
    updateZombies(dt);

    /* automatic weapons */

    if(firing &&
       weapons[currentWeapon].automatic){

      shoot();
    }

    /* reload */

    if(
      reloading &&
      now>=reloadEnd
    ){
      finishReload();
    }

    /* weapon recoil */

    recoil*=Math.pow(.001,dt);

    if(weaponModel){

      weaponModel.position.x=
        .48;

      weaponModel.position.y=
        -.42-recoil*.18;

      weaponModel.position.z=
        -1.0+recoil*.45;

      if(
        weaponSlide &&
        weapons[currentWeapon].id==="pistol"
      ){

        weaponSlide.position.z=
          -.28+
          Math.min(
            .18,
            recoil*1.5
          );
      }
    }

    effects.forEach(e=>{
      if(e.update){
        e.update(e,dt);
      }
    });

    ensureZombies();

    updateHUD();
  }

  renderer.render(
    scene,
    camera
  );
}

animate();

/* =========================================================
   FIRST UPDATE
   ========================================================= */

updateHUD();

  "ALFA ZOMBIE 3D V4.1 READY"
);
