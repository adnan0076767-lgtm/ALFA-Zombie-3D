<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ALFA ZOMBIE 3D V3 | SURVIVAL CITY</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#b7c4c7;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#hud{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
}

.topbar{
  position:absolute;
  top:15px;
  left:15px;
  right:15px;
  display:flex;
  justify-content:space-between;
}

.panel{
  background:rgba(12,18,21,.78);
  border:1px solid rgba(255,255,255,.25);
  border-radius:10px;
  padding:9px 13px;
  box-shadow:0 5px 20px rgba(0,0,0,.25);
  backdrop-filter:blur(7px);
}

.title{
  font-size:11px;
  letter-spacing:2px;
  color:#cbd8dc;
}

.value{
  font-size:21px;
  font-weight:900;
  margin-top:3px;
}

#healthBox{
  position:absolute;
  bottom:18px;
  left:18px;
  width:245px;
}

.hpOuter{
  height:13px;
  margin-top:7px;
  background:#171b1d;
  border:1px solid #555;
  border-radius:20px;
  overflow:hidden;
}

#hpBar{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#19a85b,#b7db3e);
  transition:.15s;
}

#ammoBox{
  position:absolute;
  right:18px;
  bottom:18px;
  text-align:right;
}

#ammo{
  font-size:38px;
  line-height:1;
  font-weight:900;
}

#crosshair{
  position:absolute;
  top:50%;
  left:50%;
  width:28px;
  height:28px;
  transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:#fff;
  box-shadow:0 0 5px #000;
}

#crosshair:before{
  width:2px;
  height:28px;
  left:13px;
}

#crosshair:after{
  width:28px;
  height:2px;
  top:13px;
}

#damageFlash{
  position:absolute;
  inset:0;
  background:rgba(220,0,0,.48);
  opacity:0;
  transition:.1s;
}

#hitMarker{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:28px;
  opacity:0;
  text-shadow:0 0 8px #000;
}

#message{
  position:absolute;
  top:17%;
  left:50%;
  transform:translateX(-50%);
  font-weight:900;
  letter-spacing:3px;
  text-shadow:0 2px 8px #000;
  opacity:0;
  transition:.2s;
}

#console{
  display:none;
  position:fixed;
  z-index:80;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:min(720px,92vw);
  height:min(450px,75vh);
  background:rgba(3,8,10,.97);
  border:1px solid #58717a;
  border-radius:12px;
  box-shadow:0 20px 80px #000;
}

.consoleHead{
  height:45px;
  display:flex;
  align-items:center;
  padding:0 15px;
  border-bottom:1px solid #26383e;
  color:#8fe9ff;
  font-weight:900;
  letter-spacing:2px;
}

#consoleLog{
  height:calc(100% - 90px);
  overflow:auto;
  padding:14px;
  color:#b7f7ff;
  font-family:Consolas,monospace;
  font-size:13px;
  white-space:pre-wrap;
}

#consoleInput{
  position:absolute;
  left:10px;
  right:10px;
  bottom:10px;
  height:36px;
  border:1px solid #38525b;
  border-radius:6px;
  outline:none;
  padding:0 10px;
  color:#fff;
  background:#071013;
  font-family:Consolas,monospace;
}

#start{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    linear-gradient(
      rgba(20,28,30,.32),
      rgba(5,8,10,.82)
    );
}

.startCard{
  width:min(690px,92vw);
  text-align:center;
  padding:42px 32px;
  border-radius:18px;
  background:rgba(10,15,17,.78);
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 20px 90px rgba(0,0,0,.55);
  backdrop-filter:blur(9px);
}

.startCard h1{
  font-size:clamp(40px,9vw,82px);
  letter-spacing:9px;
  text-shadow:0 5px 30px #000;
}

.startCard h2{
  margin-top:5px;
  color:#c6d4d8;
  letter-spacing:5px;
  font-size:13px;
}

.startCard p{
  margin-top:25px;
  color:#d1dadd;
  line-height:1.8;
  font-size:14px;
}

#startBtn{
  margin-top:28px;
  padding:15px 30px;
  border:1px solid #fff;
  border-radius:7px;
  background:#eef3f4;
  color:#101416;
  font-weight:900;
  letter-spacing:3px;
  cursor:pointer;
}

#mobileControls{
  display:none;
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
}

.mobileBtn{
  position:absolute;
  width:67px;
  height:67px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(10,17,20,.55);
  border:1px solid rgba(255,255,255,.3);
  color:#fff;
  font-weight:900;
  pointer-events:auto;
  user-select:none;
}

#fireBtn{
  right:25px;
  bottom:105px;
  width:90px;
  height:90px;
  background:rgba(170,20,20,.58);
}

#reloadBtn{
  right:34px;
  bottom:24px;
}

#upBtn{
  left:85px;
  bottom:145px;
}

#downBtn{
  left:85px;
  bottom:24px;
}

#leftBtn{
  left:10px;
  bottom:84px;
}

#rightBtn{
  left:160px;
  bottom:84px;
}

#hint{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  color:rgba(255,255,255,.6);
  font-size:10px;
  letter-spacing:1px;
}

@media(max-width:800px){

  #mobileControls{
    display:block;
  }

  #hint{
    display:none;
  }

  #healthBox{
    width:185px;
    left:8px;
    bottom:10px;
  }

  #ammoBox{
    right:8px;
    bottom:10px;
  }

  #ammo{
    font-size:29px;
  }

}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">

  <div class="topbar">

    <div class="panel">
      <div class="title">ALFA ZOMBIE 3D</div>
      <div class="value" id="wave">WAVE 1</div>
    </div>

    <div class="panel" style="text-align:right">
      <div class="title">INFECTED</div>
      <div class="value" id="zombies">0</div>
      <div class="title" style="margin-top:5px">
        SCORE <span id="score">0</span>
      </div>
    </div>

  </div>

  <div id="crosshair"></div>

  <div id="damageFlash"></div>

  <div id="hitMarker">✕</div>

  <div id="message"></div>

  <div id="healthBox" class="panel">

    <div class="title">VITAL STATUS</div>

    <div style="margin-top:5px;font-weight:900">
      HP <span id="hpText">100</span>

    id="consoleInput"

  <div id="upBtn" class="mobileBtn">▲</div>

  <div id="reloadBtn" class="mobileBtn">RELOAD</div>

</div>

<div id="start">

  <div class="startCard">

    <h1>ALFA</h1>

    <h2>
      ZOMBIE 3D // SURVIVAL CITY V3
    </h2>

    <p>
      The city is infected.<br>
      Keep moving. Keep shooting. Stay alive.
    </p>

    <button id="startBtn">
      ENTER THE CITY
    </button>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
"use strict";

/* =========================================================
   ALFA ZOMBIE 3D V3
========================================================= */

let scene;
let camera;
let renderer;
let clock;

let player;
let weapon;

let zombies=[];
let effects=[];
let particles=[];

let started=false;
let paused=false;

let health=100;
let ammo=12;
let reserveAmmo=96;

let score=0;
let wave=1;

let yaw=0;
let pitch=0;

let fireCooldown=0;
let reloadTimer=0;

let godMode=false;
let speedMultiplier=1;

const keys={};

const audio={
  ctx:null
};

/* =========================================================
   AUDIO ENGINE
========================================================= */

function initAudio(){

  if(audio.ctx) return;

  try{

    audio.ctx=
      new(window.AudioContext||window.webkitAudioContext)();

  }catch(e){

    console.warn("Audio unavailable");

  }

}

function osc(freq,duration,type="sine",volume=.04){

  if(!audio.ctx) return;

  const ctx=audio.ctx;

  const o=ctx.createOscillator();
  const g=ctx.createGain();

  o.type=type;

  o.frequency.setValueAtTime(
    freq,
    ctx.currentTime
  );

  g.gain.setValueAtTime(
    volume,
    ctx.currentTime
  );

  g.gain.exponentialRampToValueAtTime(
    .001,
    ctx.currentTime+duration
  );

  o.connect(g);
  g.connect(ctx.destination);

  o.start();
  o.stop(ctx.currentTime+duration);

}

function gunshot(){

  if(!audio.ctx) return;

  const ctx=audio.ctx;

  const buffer=ctx.createBuffer(
    1,
    ctx.sampleRate*.2,
    ctx.sampleRate
  );

  const data=buffer.getChannelData(0);

  for(let i=0;i<data.length;i++){

    const t=i/data.length;

    data[i]=
      (Math.random()*2-1)*
      Math.pow(1-t,2);

  }

  const source=ctx.createBufferSource();
  const filter=ctx.createBiquadFilter();
  const gain=ctx.createGain();

  filter.type="lowpass";
  filter.frequency.value=2600;

  gain.gain.value=.8;

  source.buffer=buffer;

  source.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);

  source.start();

  osc(82,.13,"sine",.28);

}

function reloadSound(){

  osc(170,.08,"square",.035);

  setTimeout(()=>{
    osc(310,.07,"metal",.035);
  },100);

  setTimeout(()=>{
    osc(470,.06,"square",.03);
  },240);

}

function zombieGrowl(){

  osc(55,.3,"sawtooth",.025);

}

/* =========================================================
   INIT
========================================================= */

function init(){

  scene=new THREE.Scene();

  /*
    BRIGHTER THEME
  */

  scene.background=
    new THREE.Color(0xaebdc1);

  scene.fog=
    new THREE.Fog(
      0xaebdc1,
      55,
      250
    );

  clock=new THREE.Clock();

  camera=
    new THREE.PerspectiveCamera(
      72,
      innerWidth/innerHeight,
      .05,
      700
    );

  renderer=
    new THREE.WebGLRenderer({
      antialias:true,
      powerPreference:"high-performance"
    });

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.8)
  );

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.shadowMap.enabled=true;

  renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;

  renderer.outputColorSpace=
    THREE.SRGBColorSpace;

  document
    .getElementById("game")
    .appendChild(renderer.domElement);

  createLighting();
  createWorld();
  createPlayer();
  createWeapon();
  createAtmosphere();

  events();

  animate();

}

/* =========================================================
   LIGHTING
========================================================= */

function createLighting(){

  const sky=
    new THREE.HemisphereLight(
      0xe8f4ff,
      0x596064,
      2.3
    );

  scene.add(sky);

  const sun=
    new THREE.DirectionalLight(
      0xfff3dc,
      3.2
    );

  sun.position.set(
    -80,
    130,
    60
  );

  sun.castShadow=true;

  sun.shadow.mapSize.width=2048;
  sun.shadow.mapSize.height=2048;

  sun.shadow.camera.left=-180;
  sun.shadow.camera.right=180;
  sun.shadow.camera.top=180;
  sun.shadow.camera.bottom=-180;

  scene.add(sun);

  /* city lamps */

  for(let x=-80;x<=80;x+=40){

    for(let z=-140;z<=140;z+=45){

      const lamp=
        new THREE.PointLight(
          0xffd48c,
          3.5,
          34,
          2
        );

      lamp.position.set(
        x,
        8,
        z
      );

      scene.add(lamp);

    }

  }

}

/* =========================================================
   WORLD
========================================================= */

function createWorld(){

  const ground=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        440,
        440
      ),
      new THREE.MeshStandardMaterial({
        color:0x737c7c,
        roughness:.95
      })
    );

  ground.rotation.x=-Math.PI/2;

  ground.receiveShadow=true;

  scene.add(ground);

  /* MAIN ROAD */

  const road=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        25,
        440
      ),
      new THREE.MeshStandardMaterial({
        color:0x303537,
        roughness:.92
      })
    );

  road.rotation.x=-Math.PI/2;

  road.position.y=.02;

  scene.add(road);

  /* SIDE ROADS */

  for(let z=-180;z<=180;z+=50){

    const side=
      new THREE.Mesh(
        new THREE.PlaneGeometry(
          440,
          13
        ),
        new THREE.MeshStandardMaterial({
          color:0x303537,
          roughness:.92
        })
      );

    side.rotation.x=-Math.PI/2;

    side.position.set(
      0,
      .025,
      z
    );

    scene.add(side);

  }

  /* ROAD LINES */

  const lineMat=
    new THREE.MeshStandardMaterial({
      color:0xe3d19b,
      roughness:.8
    });

  for(let z=-215;z<215;z+=13){

    const line=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .18,
          .025,
          6
        ),
        lineMat
      );

    line.position.set(
      0,
      .055,
      z
    );

    scene.add(line);

  }

  /* BUILDINGS */

  for(const x of [-65,-43,43,65]){

    for(
      let z=-180;
      z<=180;
      z+=42
    ){

      createBuilding(
        x+(Math.random()*8-4),
        z+(Math.random()*7-3.5),
        17+Math.random()*10,
        18+Math.random()*35,
        17+Math.random()*9
      );

    }

  }

  /* CARS */

  for(let i=0;i<22;i++){

    const car=createCar();

    const side=
      Math.random()<.5?-1:1;

    car.position.set(
      side*(7+Math.random()*12),
      0,
      -190+Math.random()*380
    );

    car.rotation.y=
      Math.random()*Math.PI*2;

    scene.add(car);

  }

  /* STREET SIGNS */

  for(let z=-160;z<=160;z+=40){

    createStreetLight(-14,z);
    createStreetLight(14,z);

  }

}

function createBuilding(
  x,
  z,
  w,
  h,
  d
){

  const mat=
    new THREE.MeshStandardMaterial({
      color:new THREE.Color(
        0.25+
        Math.random()*.12,
        0.28+
        Math.random()*.12,
        0.29+
        Math.random()*.12
      ),
      roughness:.92
    });

  const building=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,
        h,
        d
      ),
      mat
    );

  building.position.set(
    x,
    h/2,
    z
  );

  building.castShadow=true;
  building.receiveShadow=true;

  scene.add(building);

  /* windows */

  const windowMat=
    new THREE.MeshBasicMaterial({
      color:0xd7b36b
    });

  for(
    let y=4;
    y<h-3;
    y+=5
  ){

    for(
      const side of [-1,1]
    ){

      const win=
        new THREE.Mesh(
          new THREE.BoxGeometry(
            .06,
            1.7,
            2.2
          ),
          windowMat
        );

      win.position.set(
        x+side*(w/2+.035),
        y,
        z+(Math.random()-.5)*(d-4)
      );

      scene.add(win);

    }

  }

}

function createStreetLight(x,z){

  const poleMat=
    new THREE.MeshStandardMaterial({
      color:0x30383a,
      metalness:.65,
      roughness:.4
    });

  const pole=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .07,
        .1,
        7,
        10
      ),
      poleMat
    );

  pole.position.set(
    x,
    3.5,
    z
  );

  pole.castShadow=true;

  scene.add(pole);

  const bulb=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .18,
        10,
        8
      ),
      new THREE.MeshBasicMaterial({
        color:0xffe4a1
      })
    );

  bulb.position.set(
    x,
    7,
    z
  );

  scene.add(bulb);

}

function createCar(){

  const g=new THREE.Group();

  const body=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2.2,
        .7,
        4.3
      ),
      new THREE.MeshStandardMaterial({
        color:new THREE.Color(
          .12+Math.random()*.2,
          .13+Math.random()*.2,
          .14+Math.random()*.2
        ),
        roughness:.82,
        metalness:.2
      })
    );

  body.position.y=.65;

  body.castShadow=true;

  g.add(body);

  const cabin=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        1.75,
        .7,
        2.05
      ),
      body.material
    );

  cabin.position.set(
    0,
    1.28,
    -.15
  );

  cabin.castShadow=true;

  g.add(cabin);

  const glass=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        1.55,
        .45,
        1.7
      ),
      new THREE.MeshStandardMaterial({
        color:0x25343a,
        metalness:.3,
        roughness:.18
      })
    );

  glass.position.set(
    0,
    1.31,
    -.15
  );

  g.add(glass);

  const wheelMat=
    new THREE.MeshStandardMaterial({
      color:0x070808,
      roughness:1
    });

  for(const x of [-1.08,1.08]){

    for(const z of [-1.4,1.4]){

      const wheel=
        new THREE.Mesh(
          new THREE.CylinderGeometry(
            .37,
            .37,
            .24,
            16
          ),
          wheelMat
        );

      wheel.rotation.z=
        Math.PI/2;

      wheel.position.set(
        x,
        .4,
        z
      );

      g.add(wheel);

    }

  }

  return g;

}

/* =========================================================
   ATMOSPHERE
========================================================= */

function createAtmosphere(){

  const geo=
    new THREE.BufferGeometry();

  const count=1200;

  const positions=
    new Float32Array(
      count*3
    );

  for(let i=0;i<count;i++){

    positions[i*3]=
      (Math.random()-.5)*400;

    positions[i*3+1]=
      Math.random()*45;

    positions[i*3+2]=
      (Math.random()-.5)*400;

  }

  geo.setAttribute(
    "position",
    new THREE.BufferAttribute(
      positions,
      3
    )
  );

  const mat=
    new THREE.PointsMaterial({
      color:0xffffff,
      size:.12,
      transparent:true,
      opacity:.2
    });

  scene.add(
    new THREE.Points(
      geo,
      mat
    )
  );

}

/* =========================================================
   PLAYER
========================================================= */

function createPlayer(){

  player=
    new THREE.Object3D();

  player.position.set(
    0,
    1.7,
    100
  );

  scene.add(player);

  player.add(camera);

}

/* =========================================================
   UPGRADED PISTOL
========================================================= */

function createWeapon(){

  weapon=
    new THREE.Group();

  const metal=
    new THREE.MeshStandardMaterial({
      color:0x252a2d,
      metalness:.9,
      roughness:.22
    });

  const darkMetal=
    new THREE.MeshStandardMaterial({
      color:0x101315,
      metalness:.8,
      roughness:.3
    });

  const polymer=
    new THREE.MeshStandardMaterial({
      color:0x151819,
      roughness:.82
    });

  /* slide */

  const slide=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .27,
        .17,
        .86
      ),
      metal
    );

  slide.position.set(
    .34,
    -.22,
    -.55
  );

  weapon.add(slide);

  /* slide serrations */

  for(let i=0;i<5;i++){

    const serration=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .025,
          .1,
          .045
        ),
        darkMetal
      );

    serration.position.set(
      .34,
      -.13,
      -.29-i*.09
    );

    weapon.add(serration);

  }

  /* barrel */

  const barrel=

/* =========================================================
   REALISTIC HUMANOID ZOMBIE
========================================================= */

function createZombie(type="normal"){

  const z=
    new THREE.Group();

  z.userData.type=type;

  if(type==="tank"){

    z.userData.hp=260;
    z.userData.speed=.48;

  }else if(type==="fast"){

    z.userData.hp=70;
    z.userData.speed=1.45;

  }else{

    z.userData.hp=100;
    z.userData.speed=.78;

  }

  z.userData.attackTimer=0;
  z.userData.dead=false;

  const skinColor=
    type==="tank"
      ?0x50544e
      :type==="fast"
      ?0x747a70
      :0x646b63;

  const skin=
    new THREE.MeshStandardMaterial({
      color:skinColor,
      roughness:1
    });

  const shirt=
    new THREE.MeshStandardMaterial({
      color:
        type==="tank"
          ?0x34383a
          :0x252b2d,
      roughness:.95
    });

  const pants=
    new THREE.MeshStandardMaterial({
      color:0x202426,
      roughness:.95
    });

  const shoe=
    new THREE.MeshStandardMaterial({
      color:0x101213,
      roughness:1
    });

  /* body */

  const torso=
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        type==="tank"? .52:.4,
        type==="tank"?1.02:.92,
        6,
        12
      ),
      shirt
    );

  torso.position.y=1.35;

  torso.castShadow=true;

  z.add(torso);

  /* neck */

  const neck=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .16,
        .18,
        .23,
        12
      ),
      skin
    );

  neck.position.y=2.0;

  z.add(neck);

  /* head */

  const head=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        type==="tank"? .4:.34,
        18,
        14
      ),
      skin
    );

  head.scale.set(
    .92,
    1.08,
    .92
  );

  head.position.y=2.38;

  head.castShadow=true;

  z.add(head);

  /* eyes */

  const eyeMat=
    new THREE.MeshBasicMaterial({
      color:0xcfd8bd
    });

  for(const x of [-.115,.115]){

    const eye=
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .047,
          8,
          8
        ),
        eyeMat
      );

    eye.position.set(
      x,
      2.42,
      -.305
    );

    z.add(eye);

  }

  /* mouth */

  const mouth=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .2,
        .035,
        .018
      ),
      new THREE.MeshBasicMaterial({
        color:0x230d0d
      })
    );

  mouth.position.set(
    0,
    2.25,
    -.318
  );

  z.add(mouth);

  /* arms */

  z.userData.armL=
    new THREE.Group();

  z.userData.armR=
    new THREE.Group();

  for(
    const side of [-1,1]
  ){

    const arm=
      new THREE.Group();

    const upper=
      new THREE.Mesh(
        new THREE.CapsuleGeometry(
          .13,
          .57,
          5,
          9
        ),
        shirt
      );

    upper.position.y=-.29;

    upper.castShadow=true;

    arm.add(upper);

    const fore=
      new THREE.Mesh(
        new THREE.CapsuleGeometry(
          .115,
          .53,
          5,
          9
        ),
        skin
      );

    fore.position.y=-.82;

    fore.castShadow=true;

    arm.add(fore);

    const hand=
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .14,
          10,
          8
        ),
        skin
      );

    hand.position.y=-1.13;

    arm.add(hand);

    arm.position.set(
      side*.54,
      1.67,
      0
    );

    arm.rotation.z=
      side*.2;

    if(side<0){

      z.userData.armL=arm;

    }else{

      z.userData.armR=arm;

    }

    z.add(arm);

  }

  /* legs */

  z.userData.legL=
    new THREE.Group();

  z.userData.legR=
    new THREE.Group();

  for(
    const side of [-1,1]
  ){

    const leg=
      new THREE.Group();

    const thigh=
      new THREE.Mesh(
        new THREE.CapsuleGeometry(
          .17,
          .68,
          5,
          9
        ),
        pants
      );

    thigh.position.y=-.34;

    leg.add(thigh);

    const foot=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .26,
          .15,
          .48
        ),
        shoe
      );

    foot.position.set(
      0,
      -.77,
      -.09
    );

    leg.add(foot);

    leg.position.set(
      side*.21,
      .85,
      0
    );

    if(side<0){

      z.userData.legL=leg;

    }else{

      z.userData.legR=leg;

    }

    z.add(leg);

  }

  return z;

}

/* =========================================================
   SPAWN
========================================================= */

function spawnZombie(type="normal"){

  const z=
    createZombie(type);

  const angle=
    Math.random()*Math.PI*2;

  const distance=
    35+Math.random()*60;

  z.position.set(
    player.position.x+
      Math.cos(angle)*distance,
    0,
    player.position.z+
      Math.sin(angle)*distance
  );

  scene.add(z);

  zombies.push(z);

  updateZombieUI();

}

function spawnWave(){

  const amount=
    Math.min(
      4+wave*2,
      25
    );

  for(let i=0;i<amount;i++){

    setTimeout(()=>{

      if(!started) return;

      let type="normal";

      if(wave>=3 && Math.random()<.14){

        type="fast";

      }

      if(wave>=5 && Math.random()<.08){

        type="tank";

      }

      spawnZombie(type);

    },i*350);

  }

  showMessage(
    "WAVE "+wave
  );

}

/* =========================================================
   SHOOT
========================================================= */

function shoot(){

  if(!started || paused) return;

  if(reloadTimer>0) return;

  if(fireCooldown>0) return;

  if(ammo<=0){

    osc(100,.08,"square",.025);

    showMessage("EMPTY");

    return;

  }

  ammo--;

  fireCooldown=.15;

  updateHUD();

  weaponRecoil();

  muzzleFlash();

  gunshot();

  raycaster.setFromCamera(
    new THREE.Vector2(0,0),
    camera
  );

  const targets=[];

  zombies.forEach(z=>{

    z.traverse(obj=>{

      if(obj.isMesh){

        obj.userData.zombie=z;

        targets.push(obj);

      }

    });

  });

  const hits=
    raycaster.intersectObjects(
      targets,
      false
    );

  if(hits.length){

    const hit=hits[0];

    const z=
      hit.object.userData.zombie;

    if(z){

      let damage=50;

      const head=
        z.children.find(
          x=>x.geometry &&
          x.geometry.type==="SphereGeometry"
        );

      if(
        head &&
        hit.object===head
      ){

        damage=100;

        showMessage(
          "HEADSHOT +100"
        );

      }

      z.userData.hp-=damage;

      bloodEffect(
        hit.point
      );

      showHit();

      if(z.userData.hp<=0){

        killZombie(z);

      }

    }

  }

}

  setTimeout(()=>{

    weapon.position.z=-.72;

/* =========================================================
   KILL
========================================================= */

function killZombie(z){

  if(z.userData.dead) return;

  z.userData.dead=true;

  score+=100;

  updateHUD();

  /* fall animation */

  const fallStart=z.rotation.z;

  let t=0;

  const fall=setInterval(()=>{

    t+=.08;

    z.rotation.z=
      Math.min(
        Math.PI/2,
        fallStart+t*Math.PI/2
      );

    z.position.y=
      Math.max(
        0,
        1.1*t
      );

    if(t>=1){

      clearInterval(fall);

      scene.remove(z);

      const index=
        zombies.indexOf(z);

      if(index>=0){

        zombies.splice(
          index,
          1
        );

      }

      updateZombieUI();

      if(zombies.length===0){

        wave++;

        setTimeout(()=>{

          if(started){

            spawnWave();

          }

        },1000);

      }

    }

  },25);

}

function updateZombieUI(){

  document.getElementById(
    "zombies"
  ).textContent=zombies.length;

}

/* =========================================================
   ZOMBIE AI
========================================================= */

function updateZombies(dt){

  for(const z of zombies){

    if(z.userData.dead)
      continue;

    const dx=
      player.position.x-
      z.position.x;

    const dz=
      player.position.z-
      z.position.z;

    const dist=
      Math.hypot(
        dx,
        dz
      );

    if(dist>1.55){

      const speed=
        z.userData.speed*
        speedMultiplier*
        dt;

      z.position.x+=
        dx/dist*speed;

      z.position.z+=
        dz/dist*speed;

      z.rotation.y=
        Math.atan2(
          dx,
          dz
        );

      const walk=
        performance.now()*.009+
        z.id;

      z.userData.armL.rotation.x=
        Math.sin(walk)*.55;

      z.userData.armR.rotation.x=
        -Math.sin(walk)*.55;

      z.userData.legL.rotation.x=
        -Math.sin(walk)*.45;

      z.userData.legR.rotation.x=
        Math.sin(walk)*.45;

    }else{

      z.userData.attackTimer-=dt;

      if(z.userData.attackTimer<=0){

        z.userData.attackTimer=1;

        zombieGrowl();

        if(!godMode){

          health-=
            z.userData.type==="tank"
              ?14
              :z.userData.type==="fast"
              ?7
              :9;

          damageFlash();

          updateHUD();

          if(health<=0){

            gameOver();

          }

        }

      }

    }

  }

}

/* =========================================================
   EFFECTS
========================================================= */

function updateEffects(dt){

  for(
    let i=effects.length-1;
    i>=0;
    i--
  ){

    const e=effects[i];

    e.life-=dt;

    if(e.vx!==undefined){

      e.object.position.x+=
        e.vx*dt;

      e.object.position.y+=
        e.vy*dt;

      e.object.position.z+=
        e.vz*dt;

      e.vy-=4*dt;

    }

    e.object.scale.multiplyScalar(.97);

    if(e.life<=0){

      scene.remove(
        e.object
      );

      effects.splice(i,1);

    }

  }

}

/* =========================================================
   MOVEMENT
========================================================= */

function updatePlayer(dt){

  if(!started || paused)
    return;

  let forward=0;
  let side=0;

  if(keys.KeyW) forward++;
  if(keys.KeyS) forward--;

  if(keys.KeyD) side++;
  if(keys.KeyA) side--;

  const len=
    Math.hypot(
      forward,
      side
    );

  if(len>0){

    forward/=len;
    side/=len;

    const speed=
      6*
      speedMultiplier*
      dt;

    player.position.x+=
      (
        Math.sin(yaw)*forward+
        Math.cos(yaw)*side
      )*speed;

    player.position.z+=
      (
        Math.cos(yaw)*forward-
        Math.sin(yaw)*side
      )*speed;

  }

  player.position.x=
    Math.max(
      -190,
      Math.min(
        190,
        player.position.x
      )
    );

  player.position.z=
    Math.max(
      -205,
      Math.min(
        205,
        player.position.z
      )
    );

}

function consoleOpen(){

  ).style.display==="block";

  const el=

      "console"
    );

  if(consoleOpen()){

  }else{

    el.style.display="block";

    setTimeout(()=>{

      ).focus();
    },50);

  }

function consoleLog(text){

  const log=

    );

  log.textContent+=
    "\n> "+text;

  log.scrollTop=
    log.scrollHeight;

}

function runCommand(raw){

  const cmd=
    raw.trim().toLowerCase();

  if(!cmd)
    return;

  consoleLog(cmd);

  if(cmd==="help"){

    consoleLog(
`ALFA COMMANDS

help
status
ammo
heal
god
spawn zombie
spawn fast
spawn tank
clear
speed
night
day`
    );

  }else if(cmd==="status"){

    consoleLog(
      "HP "+health+
      " | AMMO "+ammo+
      " | ZOMBIES "+zombies.length+
      " | WAVE "+wave+
      " | SCORE "+score
    );

  }else if(cmd==="ammo"){

    ammo=12;
    reserveAmmo=999;

    updateHUD();

    consoleLog(
      "AMMO REFILLED"
    );

  }else if(cmd==="heal"){

    health=100;

    updateHUD();

    consoleLog(
      "HP RESTORED"
    );

  }else if(cmd==="god"){

    godMode=!godMode;

    consoleLog(
      "GOD MODE: "+
      (godMode?"ON":"OFF")
    );

  }else if(cmd==="spawn zombie"){

    spawnZombie("normal");

    consoleLog(
      "NORMAL ZOMBIE SPAWNED"
    );

  }else if(cmd==="spawn fast"){

    spawnZombie("fast");

    consoleLog(
      "FAST ZOMBIE SPAWNED"
    );

  }else if(cmd==="spawn tank"){

    spawnZombie("tank");

    consoleLog(
      "TANK ZOMBIE SPAWNED"
    );

  }else if(cmd==="clear"){

    zombies.forEach(
      z=>scene.remove(z)
    );

    zombies=[];

    updateZombieUI();

    consoleLog(
      "ALL ZOMBIES CLEARED"
    );

  }else if(cmd==="speed"){

    speedMultiplier=
      speedMultiplier===1
        ?2
        :1;

    consoleLog(
      "SPEED "+
      speedMultiplier+"X"
    );

  }else if(cmd==="night"){

    scene.background=
      new THREE.Color(
        0x4d5960
      );

    scene.fog.color=
      new THREE.Color(
        0x4d5960
      );

    consoleLog(
      "NIGHT MODE"
    );

  }else if(cmd==="day"){

    scene.background=
      new THREE.Color(
        0xaebdc1
      );

    scene.fog.color=
      new THREE.Color(
        0xaebdc1
      );

    consoleLog(
      "DAY MODE"
    );

  }else{

    consoleLog(
      "UNKNOWN COMMAND"
    );

  }

}

/* =========================================================
   INPUT
========================================================= */

function events(){

  window.addEventListener(
    "resize",
    ()=>{

      camera.aspect=
        innerWidth/innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        innerWidth,
        innerHeight
      );

    }
  );

  document.getElementById(
    "startBtn"
  ).addEventListener(
    "click",
    startGame
  );

  document.addEventListener(
    "keydown",
    e=>{

      keys[e.code]=true;

      if(e.code==="KeyR")
        reload();

      if(e.code==="Backquote"){

        e.preventDefault();

        toggleConsole();

      }

    }
  );

  document.addEventListener(
    "keyup",
    e=>{

      keys[e.code]=false;

    }
  );

  renderer.domElement.addEventListener(
    "click",
    ()=>{

      if(
        started &&
        !consoleOpen()
      ){

        renderer.domElement
          .requestPointerLock?.();

      }

    }
  );

  document.addEventListener(
    "mousemove",
    e=>{

      if(
        !started ||
        document.pointerLockElement !==
        renderer.domElement
      )
        return;

      yaw-=
        e.movementX*.0024;

      pitch-=
        e.movementY*.0024;

      pitch=
        Math.max(
          -1.3,
          Math.min(
            1.3,
            pitch
          )
        );

      player.rotation.y=
        yaw;

      camera.rotation.x=
        pitch;

    }
  );

  renderer.domElement.addEventListener(
    "mousedown",
    e=>{

      if(e.button===0)
        shoot();

    }
  );

  mobileEvents();

}

/* =========================================================
   MOBILE
========================================================= */

function holdButton(
  id,
  code
){

  const el=
    document.getElementById(id);

  const down=e=>{

    e.preventDefault();

    keys[code]=true;

  };

  const up=e=>{

    e.preventDefault();

    keys[code]=false;

  };

  el.addEventListener(
    "touchstart",
    down,
    {passive:false}
  );

  el.addEventListener(
    "touchend",
    up,
    {passive:false}
  );

  el.addEventListener(
    "touchcancel",
    up,
    {passive:false}
  );

}

function mobileEvents(){

  holdButton(
    "upBtn",
    "KeyW"
  );

  holdButton(
    "downBtn",
    "KeyS"
  );

  holdButton(
    "leftBtn",
    "KeyA"
  );

  holdButton(
    "rightBtn",
    "KeyD"
  );

  document.getElementById(
    "fireBtn"
  ).addEventListener(
    "touchstart",
    e=>{

      e.preventDefault();

      shoot();

    },
    {passive:false}
  );

  document.getElementById(
    "reloadBtn"
  ).addEventListener(
    "touchstart",
    e=>{

      e.preventDefault();

      reload();

    },
    {passive:false}
  );

}

/* =========================================================
   START / GAME OVER
========================================================= */

function startGame(){

  initAudio();

  if(audio.ctx &&
     audio.ctx.state==="suspended"){

    audio.ctx.resume();

  }

  document.getElementById(
    "start"
  ).style.display="none";

  started=true;
  paused=false;

  health=100;
  ammo=12;
  reserveAmmo=96;

  score=0;
  wave=1;

  yaw=0;
  pitch=0;

  player.position.set(
    0,
    1.7,
    100
  );

  player.rotation.y=0;
  camera.rotation.x=0;

  zombies.forEach(
    z=>scene.remove(z)
  );

  zombies=[];

  updateHUD();
  updateZombieUI();

  spawnWave();

  setTimeout(()=>{
    renderer.domElement
      .requestPointerLock?.();
  },150);

}

function gameOver(){

  started=false;

  document.exitPointerLock?.();

  document.querySelector(
    ".startCard h1"
  ).textContent="YOU DIED";

  document.querySelector(
    ".startCard h2"
  ).textContent=
    "FINAL SCORE "+score;

  document.querySelector(
    ".startCard p"
  ).innerHTML=
    "The city belongs to the infected.<br>Enter again and survive.";

  document.getElementById(
    "startBtn"
  ).textContent="RESTART";

  document.getElementById(
    "start"
  ).style.display="flex";

}

/* =========================================================
   MAIN LOOP
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  const dt=
    Math.min(
      clock.getDelta(),
      .05
    );

  if(started && !paused){

    fireCooldown=
      Math.max(
        0,
        fireCooldown-dt
      );

    if(reloadTimer>0){

      reloadTimer-=dt;

      if(reloadTimer<=0){

        const needed=
          12-ammo;

        const take=
          Math.min(
            needed,
            reserveAmmo
          );

        ammo+=take;
        reserveAmmo-=take;

        updateHUD();

      }

    }

    updatePlayer(dt);
    updateZombies(dt);
    updateEffects(dt);

  }

  renderer.render(
    scene,
    camera
  );

}

/* =========================================================
   BOOT
========================================================= */

init();

</script>

</body>
</html>
