<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ALFA ZOMBIE 3D V4.2 | CITY SURVIVAL</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
 width:100%;
 height:100%;
 overflow:hidden;
 background:#8ea7b8;
 font-family:Arial,Helvetica,sans-serif;
 user-select:none;
}

#game{
 position:fixed;
 inset:0;
}

canvas{
 display:block;
}

#hud{
 position:fixed;
 inset:0;
 color:#fff;
 text-shadow:0 2px 5px #000;
 pointer-events:none;
}

#topLeft{
 position:absolute;
 top:15px;
 left:16px;
 line-height:1.6;
 font-size:14px;
}

#topRight{
 position:absolute;
 top:15px;
 right:16px;
 text-align:right;
}

#weaponName{
 font-size:22px;
 font-weight:900;
 letter-spacing:2px;
}

#ammo{
 font-size:32px;
 font-weight:bold;
}

#crosshair{
 position:absolute;
 left:50%;
 top:50%;
 width:26px;
 height:26px;
 transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
 content:"";
 position:absolute;
 background:#fff;
 box-shadow:0 0 5px #000;
}

#crosshair:before{
 width:2px;
 height:26px;
 left:12px;
 top:0;
}

#crosshair:after{
 width:26px;
 height:2px;
 left:0;
 top:12px;
}

#hit{
 position:absolute;
 left:50%;
 top:50%;
 width:24px;
 height:24px;
 transform:translate(-50%,-50%);
 opacity:0;
}

#hit:before,
#hit:after{
 content:"";
 position:absolute;
 width:3px;
 height:28px;
 background:#fff;
 left:10px;
 top:-2px;
}

#hit:before{transform:rotate(45deg)}
#hit:after{transform:rotate(-45deg)}

#health{
 position:absolute;
 left:16px;
 bottom:18px;
 width:260px;
}

.bar{
 height:17px;
 width:100%;
 background:rgba(0,0,0,.5);
 border:2px solid rgba(255,255,255,.8);
 border-radius:8px;
 overflow:hidden;
 margin:4px 0 7px;
}

.fill{
 height:100%;
 width:100%;
}

#healthFill{background:#e53935}
#staminaFill{background:#20a9e8}

#message{
 position:absolute;
 left:50%;
 bottom:120px;
 transform:translateX(-50%);
 font-weight:bold;
 font-size:20px;
 opacity:0;
 transition:.15s;
}

/* WEAPON SELECTOR */

#weaponSelector{
 position:absolute;
 left:50%;
 bottom:18px;
 transform:translateX(-50%);
 display:flex;
 gap:7px;
 pointer-events:auto;
}

.weaponBtn{
 min-width:110px;
 padding:9px 12px;
 background:rgba(4,10,18,.78);
 border:1px solid rgba(255,255,255,.35);
 color:#fff;
 border-radius:8px;
 cursor:pointer;
 text-align:center;
}

.weaponBtn.active{
 border-color:#20d8ff;
 box-shadow:0 0 15px rgba(32,216,255,.55);
 background:rgba(10,70,90,.85);
}

.weaponBtn b{
 display:block;
 font-size:12px;
}

.weaponBtn span{
 display:block;
 font-size:10px;
 opacity:.7;
}

/* CONSOLE */

#console{
 position:fixed;
 z-index:20;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 width:min(700px,92vw);
 background:rgba(2,7,15,.97);
 border:1px solid #20d8ff;
 box-shadow:0 0 40px rgba(0,200,255,.3);
 padding:18px;
 display:none;
 color:#7eeeff;
}

#consoleLog{
 height:250px;
 overflow:auto;
 white-space:pre-wrap;
 font-family:monospace;
 font-size:13px;
 margin-bottom:10px;
}

#consoleInput{
 width:100%;
 padding:12px;
 background:#020617;
 color:#fff;
 border:1px solid #20d8ff;
 outline:none;
 font-family:monospace;
}

/* START */

#startScreen{
 position:fixed;
 inset:0;
 z-index:30;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 color:white;
 background:
 radial-gradient(circle at center,rgba(22,119,166,.3),transparent 40%),
 linear-gradient(#12283b,#050c14);
}

.startCard{
 width:min(650px,92vw);
 padding:34px;
 border-radius:18px;
 background:rgba(2,8,18,.9);
 border:1px solid rgba(50,220,255,.4);
 box-shadow:0 0 60px rgba(0,180,255,.2);
}

.startCard h1{
 font-size:clamp(28px,6vw,58px);
 letter-spacing:4px;
}

.startCard h2{
 margin-top:6px;
 color:#48dfff;
}

.startCard p{
 margin:18px 0;
 line-height:1.7;
 color:#bfd7e5;
}

#startBtn{
 border:0;
 padding:15px 32px;
 border-radius:9px;
 background:#159dcc;
 color:#fff;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
}

/* MOBILE */

#mobile{
 display:none;
 position:fixed;
 inset:0;
 pointer-events:none;
 z-index:10;
}

.mbtn{
 pointer-events:auto;
 position:absolute;
 width:65px;
 height:65px;
 border-radius:50%;
 background:rgba(0,0,0,.4);
 border:1px solid rgba(255,255,255,.5);
 color:#fff;
 font-weight:bold;
 touch-action:none;
}

#fire{
 right:22px;
 bottom:100px;
 width:90px;
 height:90px;
 background:rgba(180,20,20,.55);
}

#reload{
 right:25px;
 bottom:25px;
}

#switch{
 right:105px;
 bottom:25px;
}

@media(max-width:800px){

 #mobile{display:block}

 #weaponSelector{
  bottom:4px;
  width:96%;
  justify-content:center;
 }

 .weaponBtn{
  min-width:0;
  flex:1;
  padding:6px 3px;
 }

 .weaponBtn b{font-size:9px}
 .weaponBtn span{font-size:8px}

 #health{width:190px}
 #weaponName{font-size:15px}
 #ammo{font-size:25px}
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">

 <div id="topLeft">
  WAVE: <b id="wave">1</b><br>
  ZOMBIES: <b id="zombies">0</b><br>
  SCORE: <b id="score">0</b>
 </div>

 <div id="topRight">
  <div id="weaponName">PISTOL</div>
  <div id="ammo">12 / 72</div>
 </div>

 <div id="crosshair"></div>
 <div id="hit"></div>

 <div id="message"></div>

 <div id="health">
  HEALTH
  <div class="bar">
   <div id="healthFill" class="fill"></div>
  </div>

  STAMINA
  <div class="bar">
   <div id="staminaFill" class="fill"></div>
  </div>
 </div>

 <div id="weaponSelector">

  <button class="weaponBtn active" data-id="pistol">
   <b>1 • PISTOL</b>
   <span>12 ROUND</span>
  </button>

  <button class="weaponBtn" data-id="ak">
   <b>2 • AK-47</b>
   <span>30 ROUND</span>
  </button>

  <button class="weaponBtn" data-id="shotgun">
   <b>3 • SHOTGUN</b>
   <span>8 SHELL</span>
  </button>

  <button class="weaponBtn" data-id="smg">
   <b>4 • SMG</b>
   <span>30 ROUND</span>
  </button>

 </div>

</div>

<div id="console">
 <div id="consoleLog">ALFA COMMAND CONSOLE V4.2</div>
 <input id="consoleInput" placeholder="help" autocomplete="off">
</div>

<div id="mobile">

 <button class="mbtn" id="fire">FIRE</button>
 <button class="mbtn" id="reload">R</button>
 <button class="mbtn" id="switch">WEAPON</button>

</div>

<div id="startScreen">

 <div class="startCard">

  <h1>ALFA ZOMBIE 3D</h1>
  <h2>V4.2 WEAPON & CHARACTER UPGRADE</h2>

  <p>
   REALISTIC CITY SURVIVAL
   <br>
   PISTOL • AK-47 • SHOTGUN • SMG
   <br><br>
   WASD = MOVE • SHIFT = RUN
   <br>
   MOUSE = AIM / FIRE • R = RELOAD
   <br>
   1 / 2 / 3 / 4 = CHANGE WEAPON
   <br>
   ` = COMMAND CONSOLE
  </p>

  <button id="startBtn">
   CLICK / TAP TO START
  </button>

 </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
"use strict";

/* =========================================================
   CORE
========================================================= */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x9db6c8);
scene.fog=new THREE.Fog(0x9db6c8,45,190);

const camera=new THREE.PerspectiveCamera(
 72,
 innerWidth/innerHeight,
 .05,
 500
);

camera.position.set(0,1.7,8);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;

document.getElementById("game").appendChild(renderer.domElement);

/* =========================================================
   LIGHT
========================================================= */

scene.add(
 new THREE.HemisphereLight(
  0xdcefff,
  0x4d5960,
  2
 )
);

const sun=new THREE.DirectionalLight(
  0xffffff,
  2.8
);

sun.position.set(-50,80,30);
sun.castShadow=true;
sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;
sun.shadow.camera.left=-120;
sun.shadow.camera.right=120;
sun.shadow.camera.top=120;
sun.shadow.camera.bottom=-120;

scene.add(sun);

/* =========================================================
   MATERIALS
========================================================= */

const M={

 road:new THREE.MeshStandardMaterial({
  color:0x353b40,
  roughness:1
 }),

 sidewalk:new THREE.MeshStandardMaterial({
  color:0x858c90,
  roughness:1
 }),

 buildingA:new THREE.MeshStandardMaterial({
  color:0x66737b,
  roughness:.9
 }),

 buildingB:new THREE.MeshStandardMaterial({
  color:0x9b9186,
  roughness:.9
 }),

 glass:new THREE.MeshStandardMaterial({
  color:0x17435a,
  metalness:.2,
  roughness:.2
 }),

 window:new THREE.MeshStandardMaterial({
  color:0xd9ecff,
  emissive:0x527b98,
  emissiveIntensity:.4
 }),

 black:new THREE.MeshStandardMaterial({
  color:0x101214,
  roughness:.55,
  metalness:.35
 }),

 metal:new THREE.MeshStandardMaterial({
  color:0x565e63,
  roughness:.32,
  metalness:.85
 }),

 darkMetal:new THREE.MeshStandardMaterial({
  color:0x1b1e21,
  roughness:.3,
  metalness:.8
 }),

 rubber:new THREE.MeshStandardMaterial({
  color:0x101010,
  roughness:1
 }),

 skin:new THREE.MeshStandardMaterial({
  color:0x66745d,
  roughness:1
 }),

 skinDark:new THREE.MeshStandardMaterial({
  color:0x4c5947,
  roughness:1
 }),

 shirt:new THREE.MeshStandardMaterial({
  color:0x344654,
  roughness:1
 }),

 pants:new THREE.MeshStandardMaterial({
  color:0x252c32,
  roughness:1
 }),

 mouth:new THREE.MeshStandardMaterial({
  color:0x120808,
  roughness:1
 }),

 teeth:new THREE.MeshStandardMaterial({
  color:0xd6cfb8,
  roughness:.8
 }),

 eye:new THREE.MeshStandardMaterial({
  color:0xf1f1f1,
  emissive:0x551111,
  emissiveIntensity:.5
 }),

 wood:new THREE.MeshStandardMaterial({
  color:0x573a22,
  roughness:.85
 }),

 woodDark:new THREE.MeshStandardMaterial({
  color:0x3d2818,
  roughness:.9
 })

};

function box(w,h,d,mat){

 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  mat
 );

 m.castShadow=true;
 m.receiveShadow=true;

 return m;
}

function cyl(r1,r2,h,mat,s=12){

 const m=new THREE.Mesh(
  new THREE.CylinderGeometry(r1,r2,h,s),
  mat
 );

 m.castShadow=true;
 m.receiveShadow=true;

 return m;
}

function sphere(r,mat){

 const m=new THREE.Mesh(
  new THREE.SphereGeometry(r,20,16),
  mat
 );

 m.castShadow=true;
 m.receiveShadow=true;

 return m;
}

/* =========================================================
   CITY
========================================================= */

const ground=box(300,.2,300,M.sidewalk);
ground.position.y=-.15;
scene.add(ground);

const road=box(22,.12,280,M.road);
road.position.y=.01;
scene.add(road);

const crossRoad=box(280,.12,18,M.road);
crossRoad.position.set(0,.02,-35);
scene.add(crossRoad);

for(let z=-135;z<140;z+=12){

 const line=box(
  .22,.025,6,
  new THREE.MeshStandardMaterial({
   color:0xdadada
  })
 );

 line.position.set(0,.09,z);
 scene.add(line);
}

for(const x of [-15,15]){

 const s=box(7,.5,280,M.sidewalk);
 s.position.set(x,.15,0);
 scene.add(s);
}

for(const z of [-47,-23]){

 const s=box(280,.5,5,M.sidewalk);
 s.position.set(0,.15,z);
 scene.add(s);
}

/* =========================================================
   BUILDINGS
========================================================= */

function building(x,z,w,h,d,material){

 const g=new THREE.Group();

 const body=box(w,h,d,material);
 body.position.y=h/2;
 g.add(body);

 const roof=box(w+.3,.35,d+.3,M.darkMetal);
 roof.position.y=h+.17;
 g.add(roof);

 const columns=Math.max(
  2,
  Math.floor(w/3)
 );

 const rows=Math.max(
  2,
  Math.floor(h/3)
 );

 for(let ix=0;ix<columns;ix++){

  const px=
   -w/2+1.3+
   ix*((w-2.6)/(columns-1));

  for(let iy=0;iy<rows;iy++){

   const py=2+iy*2.7;

   if(py>h-1)continue;

   for(const side of [-1,1]){

    const win=box(
     1.25,
     1.2,
     .08,
     M.window
    );

    win.position.set(
     px,
     py,
     side*(d/2+.05)
    );

    g.add(win);
   }
  }
 }

 const door=box(
  1.6,
  2.6,
  .12,
  M.darkMetal
 );

 door.position.set(
  0,
  1.3,
  d/2+.08
 );

 g.add(door);

 g.position.set(x,0,z);

 scene.add(g);

 return g;
}

building(-32,-20,15,17,15,M.buildingA);
building(32,-20,15,23,15,M.buildingB);
building(-34,20,18,13,17,M.buildingB);
building(34,20,18,19,17,M.buildingA);
building(-34,65,18,27,18,M.buildingA);
building(34,65,18,15,18,M.buildingB);
building(-34,108,20,20,20,M.buildingB);
building(34,108,20,29,20,M.buildingA);
building(-34,-88,18,21,18,M.buildingA);
building(34,-88,18,16,18,M.buildingB);

/* =========================================================
   CARS
========================================================= */

function car(x,z,color,rot=0){

 const g=new THREE.Group();

 const body=box(
  3.8,.85,6.2,
  new THREE.MeshStandardMaterial({
   color,
   roughness:.65,
   metalness:.25
  })
 );

 body.position.y=.9;
 g.add(body);

 const hood=box(
  3.45,.38,1.6,
  new THREE.MeshStandardMaterial({
   color,
   roughness:.65
  })
 );

 hood.position.set(0,1.45,2);
 g.add(hood);

 const cabin=box(3.1,1.25,2.9,M.glass);
 cabin.position.set(0,1.75,-.35);
 g.add(cabin);

 const roof=box(3.05,.14,2.8,M.black);
 roof.position.set(0,2.4,-.35);
 g.add(roof);

 for(const side of [-1,1]){
  for(const zz of [-2.1,2.1]){

   const wheel=cyl(
    .57,.57,.35,
    M.rubber,
    18
   );

   wheel.rotation.z=Math.PI/2;
   wheel.position.set(side*1.72,.62,zz);
   g.add(wheel);

   const hub=cyl(
    .22,.22,.37,
    M.metal,
    16
   );

   hub.rotation.z=Math.PI/2;
   hub.position.set(side*1.72,.62,zz);
   g.add(hub);
  }
 }

 for(const side of [-1,1]){

  const light=sphere(
   .19,
   new THREE.MeshStandardMaterial({
    color:0xfff0bc,
    emissive:0xffc84c,
    emissiveIntensity:1
   })
  );

  light.position.set(side*1.2,1.15,3.15);
  g.add(light);
 }

 g.position.set(x,0,z);
 g.rotation.y=rot;

 scene.add(g);
}

/* clearly visible */

car(-6,-12,0x263e68,.04);
car(7,28,0x922b2b,-.04);
car(-6,72,0x72777a,.03);
car(7,100,0x315f43,-.05);

/* =========================================================
   ZOMBIE HUMAN MODEL
========================================================= */

const zombies=[];

function zombie(type,pos){

 let scale=1;
 let hp=100;
 let speed=1.2;
 let skin=M.skin;
 let shirt=M.shirt;

 if(type==="fast"){
  scale=.92;
  hp=80;
  speed=2.3;

  shirt=new THREE.MeshStandardMaterial({
   color:0x653131,
   roughness:1
  });
 }

 if(type==="tank"){
  scale=1.3;
  hp=300;
  speed=.65;

  skin=M.skinDark;

  shirt=new THREE.MeshStandardMaterial({
   color:0x252b2a,
   roughness:1
  });
 }

 const root=new THREE.Group();

 root.position.copy(pos);

 /* PELVIS */

 const pelvis=box(
  .95*scale,
  .65*scale,
  .65*scale,
  M.pants
 );

 pelvis.position.y=1.0*scale;
 root.add(pelvis);

 /* ABDOMEN */

 const abdomen=box(
  1.05*scale,
  .85*scale,
  .62*scale,
  shirt
 );

 abdomen.position.y=1.62*scale;
 root.add(abdomen);

 /* CHEST */

 const chest=box(
  1.42*scale,
  .9*scale,
  .7*scale,
  shirt
 );

 chest.position.y=2.25*scale;
 chest.scale.set(1,.95,1);
 root.add(chest);

 /* SHOULDERS */

 for(const side of [-1,1]){

  const shoulder=sphere(
   .32*scale,
   shirt
  );

  shoulder.position.set(
   side*.78*scale,
   2.55*scale,
   0
  );

  root.add(shoulder);
 }

 /* NECK */

 const neck=cyl(
  .2*scale,
  .25*scale,
  .35*scale,
  skin,
  14
 );

 neck.position.y=3.0*scale;
 root.add(neck);

 /* HEAD - DISTINCT HUMAN SHAPE */

 const head=sphere(
  .56*scale,
  skin
 );

 head.position.set(
  0,
  3.62*scale,
  0
 );

 head.scale.set(
  1,
  1.05,
  .92
 );

 head.userData.part="head";
 head.userData.zombie=root;

 root.add(head);

 /* JAW */

 const jaw=sphere(
  .38*scale,
  skin
 );

 jaw.position.set(
  0,
  3.38*scale,
  .27*scale
 );

 jaw.scale.set(
  1,
  .65,
  .65
 );

 root.add(jaw);

 /* EYES */

 for(const side of [-1,1]){

  const eye=sphere(
   .11*scale,
   M.eye
  );

  eye.position.set(
   side*.2*scale,
   3.78*scale,
   .49*scale
  );

  eye.userData.part="eye";
  eye.userData.zombie=root;

  root.add(eye);

  const pupil=sphere(
   .045*scale,
   M.mouth
  );

  pupil.position.set(
   side*.2*scale,
   3.78*scale,
   .585*scale
  );

  root.add(pupil);
 }

 /* NOSE */

 const nose=box(
  .15*scale,
  .23*scale,
  .28*scale,
  skin
 );

 nose.position.set(
  0,
  3.57*scale,
  .53*scale
 );

 root.add(nose);

 /* MOUTH */

 const mouth=box(
  .52*scale,
  .17*scale,
  .12*scale,
  M.mouth
 );

 mouth.position.set(
  0,
  3.29*scale,
  .49*scale
 );

 root.add(mouth);

 /* TEETH */

 for(let i=-2;i<=2;i++){

  const tooth=box(
   .075*scale,
   .085*scale,
   .035*scale,
   M.teeth
  );

  tooth.position.set(
   i*.095*scale,
   3.33*scale,
   .56*scale
  );

  root.add(tooth);
 }

 /* EARS */

 for(const side of [-1,1]){

  const ear=sphere(
   .18*scale,
   skin
  );

  ear.position.set(
   side*.54*scale,
   3.62*scale,
   0
  );

  root.add(ear);
 }

 /* ARMS */

 const arms=[];

 for(const side of [-1,1]){

  const arm=new THREE.Group();

  const upper=cyl(
   .21*scale,
   .25*scale,
   .9*scale,
   skin,
   14
  );

  upper.position.y=-.45*scale;
  arm.add(upper);

  const elbow=sphere(
   .23*scale,
   skin
  );

  elbow.position.y=-.9*scale;
  arm.add(elbow);

  const fore=cyl(
   .17*scale,
   .21*scale,
   .85*scale,
   skin,
   14
  );

  fore.position.y=-1.3*scale;
  arm.add(fore);

  const hand=sphere(
   .22*scale,
   skin
  );

  hand.position.y=-1.78*scale;
  arm.add(hand);

  arm.position.set(
   side*.91*scale,
   2.55*scale,
   0
  );

  root.add(arm);
  arms.push(arm);
 }

 /* LEGS */

 const legs=[];

 for(const side of [-1,1]){

  const leg=new THREE.Group();

  const thigh=cyl(
   .24*scale,
   .29*scale,
   .85*scale,
   M.pants,
   14
  );

  thigh.position.y=-.48*scale;
  leg.add(thigh);

  const knee=sphere(
   .23*scale,
   M.pants
  );

  knee.position.y=-.9*scale;
  leg.add(knee);

  const shin=cyl(

let audio=null;

function initAudio(){

 if(audio)return;

 audio=
  new(
   window.AudioContext||
   window.webkitAudioContext
  )();

 if(audio.state==="suspended")
  audio.resume();
}

function noise(seconds){

 const buffer=audio.createBuffer(
  1,
  audio.sampleRate*seconds,
  audio.sampleRate
 );

 const data=buffer.getChannelData(0);

 for(let i=0;i<data.length;i++)
  data[i]=Math.random()*2-1;

 return buffer;
}

/* PISTOL CRACK */

function pistolSound(){

 if(!audio)return;

 const t=audio.currentTime;

 const o=audio.createOscillator();
 const g=audio.createGain();

 o.type="sine";

 o.frequency.setValueAtTime(
  125,t
 );

 o.frequency.exponentialRampToValueAtTime(
  48,t+.14
 );

 g.gain.setValueAtTime(
  .0001,t
 );

 g.gain.exponentialRampToValueAtTime(
  .75,t+.005
 );

 g.gain.exponentialRampToValueAtTime(
  .0001,t+.16
 );

 o.connect(g);
 g.connect(audio.destination);

 o.start(t);
 o.stop(t+.17);

 const n=audio.createBufferSource();

 n.buffer=noise(.1);

 const filter=audio.createBiquadFilter();

 filter.type="highpass";
 filter.frequency.value=1800;

 const ng=audio.createGain();

 ng.gain.setValueAtTime(.8,t);
 ng.gain.exponentialRampToValueAtTime(
  .0001,
  t+.08
 );

 n.connect(filter);
 filter.connect(ng);
 ng.connect(audio.destination);

 n.start(t);
 n.stop(t+.11);
}

/* =========================================================
   SHOOTING
========================================================= */

const raycaster=new THREE.Raycaster();

function damage(z,amount,head){

 if(z.userData.dead)return;

 z.userData.hp-=amount;

 blood(
  z.position.clone().add(
   new THREE.Vector3(
    0,
    head?3.5:2.2,
    0
   )
  ),
  head?12:6
 );

 if(head){
  score+=50;
  message("HEADSHOT +50");
 }else{
  score+=10;
 }

 showHit();

 if(z.userData.hp<=0)
  kill(z);
}

function rayShot(dir){

 raycaster.set(
  camera.position,
  dir
 );

 const targets=[];

 zombies.forEach(z=>{

  if(!z.userData.dead){

   z.traverse(o=>{

    if(o.isMesh)
     targets.push(o);

   });
  }
 });

 const hits=
  raycaster.intersectObjects(
   targets,
   false
  );

 if(!hits.length)return;

 const hit=hits[0].object;
 const z=hit.userData.zombie;

 if(!z)return;

 const head=
  hit.userData.part==="head";

 let dmg=
  weapons[current].damage;

 if(head)dmg*=2;

 damage(z,dmg,head);
}

function shoot(){

 const w=weapons[current];

 const now=performance.now();

 if(reloading)return;

 if(now-lastShot<w.rate)return;

 if(w.ammo<=0){

  reload();
  return;
 }

 lastShot=now;
 w.ammo--;

 recoil=.18;

 fireSound();
 muzzleFlash();
 casing();

 for(let i=0;i<(w.pellets||1);i++){

  const dir=new THREE.Vector3(
   (Math.random()-.5)*w.spread,
   (Math.random()-.5)*w.spread,
   -1
  );

  dir.applyQuaternion(
   camera.quaternion
  );

  dir.normalize();

  rayShot(dir);
 }

 updateHUD();
}

/* =========================================================
   RELOAD
========================================================= */

function reload(){

 const w=weapons[current];

 if(reloading)return;
 if(w.ammo>=w.mag)return;
 if(w.reserve<=0)return;

 reloading=true;

 reloadEnd=
  performance.now()+
  w.reload;

 reloadSound();

 message("RELOADING...");
}

function finishReload(){

 const w=weapons[current];

 const needed=
  w.mag-w.ammo;

 const take=
  Math.min(
   needed,
   w.reserve
  );

 w.ammo+=take;
 w.reserve-=take;

 reloading=false;

 updateHUD();
}

 z.userData.dead=true;
 z.userData.death=0;

 score+=100;

 message(
  z.userData.type.toUpperCase()+
  " DOWN +100"
 );
}

  if(e.code==="Digit3")
   switchWeapon(2);

  if(e.code==="Digit4")

 }
);

 "keyup",
 e=>{
  keys[e.code]=false;
 }
);

document.addEventListener(
 "mousemove",
 e=>{

  if(!pointerLocked||consoleOpen)
   return;

  yaw-=e.movementX*.0022;
  pitch-=e.movementY*.0022;

  pitch=Math.max(
   -1.45,
   Math.min(1.45,pitch)
  );
 }
);

 "mousedown",
 e=>{

  if(!pointerLocked)return;

  if(e.button===0){

   firing=true;
   shoot();
  }
 }
);

 "mouseup",
 e=>{

  if(e.button===0)
   firing=false;

);

/* =========================================================
   MOVEMENT
========================================================= */

let bob=0;

function playerUpdate(dt){

 const forward=new THREE.Vector3(
  -Math.sin(yaw),
  0,
  -Math.cos(yaw)
 );

 const right=new THREE.Vector3(
  Math.cos(yaw),
  0,
  -Math.sin(yaw)
 );

 const move=new THREE.Vector3();

 if(keys.KeyW)
  move.add(forward);

 if(keys.KeyS)
  move.sub(forward);

 if(keys.KeyD)
  move.add(right);

 if(keys.KeyA)
  move.sub(right);

 const moving=
  move.length()>0;

 if(moving)
  move.normalize();

 let sprint=
  keys.ShiftLeft||
  keys.ShiftRight;

 if(stamina<=1)
  sprint=false;

 let speed=5;

 if(sprint&&moving){

  speed=8;
  stamina-=28*dt;

 }else{

  stamina+=18*dt;
 }

 stamina=
  Math.max(
   0,
   Math.min(100,stamina)
  );

 camera.position.addScaledVector(
  move,
  speed*dt
 );

 camera.position.y=1.7;

 if(moving){

  bob+=dt*(sprint?13:8);

  camera.position.y+=
   Math.sin(bob)*.04;
 }

 camera.rotation.order="YXZ";
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;
}

/* =========================================================
   ZOMBIE AI
========================================================= */

function zombieUpdate(dt){

 let alive=0;

 zombies.forEach(z=>{

  const d=z.userData;

  if(d.dead){

   d.death+=dt;

   z.rotation.z=
    Math.min(
     Math.PI/2,
     d.death*5
    );

   z.position.y=
    Math.max(
     0,
     -d.death*.25
    );

   return;
  }

  alive++;

  const dir=
   new THREE.Vector3()
   .subVectors(
    camera.position,
    z.position
   );

  const dist=dir.length();

  dir.y=0;

  if(dir.length()>0)
   dir.normalize();

  z.lookAt(
   camera.position.x,
   z.position.y,
   camera.position.z
  );

  if(dist>2.2){

   z.position.addScaledVector(
    dir,
    d.speed*dt
   );

   const t=
    performance.now()*.001*
    (d.speed>2?13:8);

   d.arms.forEach((a,i)=>{
    a.rotation.x=
     Math.sin(t+i*Math.PI)*.5;
   });

   d.legs.forEach((l,i)=>{
    l.rotation.x=
     Math.sin(t+i*Math.PI)*.45;
   });

  }else{

   d.attack-=dt;

   if(d.attack<=0){

    d.attack=.9;

    if(!god){

     health-=
      d.type==="tank"?18:
      d.type==="fast"?12:
      9;

     message(
      "ZOMBIE ATTACK!"
     );
    }
   }
  }
 });

 document.getElementById(
  "zombies"
 ).textContent=alive;

 if(health<=0){

  health=100;
  stamina=100;

  zombies.forEach(z=>
   scene.remove(z)
  );

  zombies.length=0;

  message(
   "CITY RESET"
  );

  setTimeout(
   firstWave,
   1000
  );
 }
}

/* =========================================================
   WEAPON SWITCH
========================================================= */

function switchWeapon(index){

 if(index<0||index>=weapons.length)
  return;

 if(reloading)
  return;

 current=index;

 buildWeapon();

 updateHUD();

 message(
  weapons[current].name
 );

 document
  .querySelectorAll(".weaponBtn")
  .forEach((b,i)=>{
   b.classList.toggle(
    "active",
    i===current
   );
  });
}

document
 .querySelectorAll(".weaponBtn")
 .forEach(btn=>{

  btn.addEventListener(
   "click",
   ()=>{

    initAudio();

    const id=
     btn.dataset.id;

    const index=
     weapons.findIndex(
      w=>w.id===id
     );

    switchWeapon(index);
   }
  );
 });

/* =========================================================
   CONSOLE
========================================================= */

let consoleOpen=false;

const consoleEl=
 document.getElementById(
  "console"
 );

const consoleLog=
 document.getElementById(
  "consoleLog"
 );

const consoleInput=
 document.getElementById(
  "consoleInput"
 );

function toggleConsole(){

 consoleOpen=!consoleOpen;

 consoleEl.style.display=
  consoleOpen?"block":"none";

 if(consoleOpen){

  document.exitPointerLock?.();

  consoleInput.focus();

 }else{

  renderer.domElement
   .requestPointerLock?.();
 }
}

function logConsole(t){

 consoleLog.textContent+=
  "\n> "+t;

 consoleLog.scrollTop=
  consoleLog.scrollHeight;
}

consoleInput.addEventListener(
 "keydown",
 e=>{

  if(e.key!=="Enter")
   return;

  const cmd=
   consoleInput.value
   .trim()
   .toLowerCase();

  consoleInput.value="";

  command(cmd);
 }
);

function command(cmd){

 if(cmd==="help"){

  logConsole(
`help
status
ammo
heal
god
spawn zombie
spawn fast
spawn tank
clear
give ammo
weapon pistol
weapon ak
weapon shotgun
weapon smg
day
night`
  );

  return;
 }

 if(cmd==="status"){

  logConsole(
   "HP="+Math.round(health)+
   " | WAVE="+wave+
   " | SCORE="+score+
   " | "+weapons[current].name
  );

  return;
 }

 if(cmd==="ammo"){

  weapons.forEach(w=>{
   w.ammo=w.mag;
   w.reserve+=100;
  });

  updateHUD();
  logConsole("ALL AMMO REFILLED");

  return;
 }

 if(cmd==="give ammo"){

  weapons[current].reserve+=150;

  updateHUD();

  logConsole("AMMO GIVEN");

  return;
 }

 if(cmd==="heal"){

  health=100;
  updateHUD();

  logConsole("HEALTH RESTORED");

  return;
 }

 if(cmd==="god"){

  god=!god;

  logConsole(
   "GOD MODE: "+god
  );

  return;
 }

 if(cmd==="spawn zombie"){

  spawn("normal",25);
  logConsole("NORMAL ZOMBIE SPAWNED");

  return;
 }

 if(cmd==="spawn fast"){

  spawn("fast",25);
  logConsole("FAST ZOMBIE SPAWNED");

  return;
 }

 if(cmd==="spawn tank"){

  spawn("tank",30);
  logConsole("TANK ZOMBIE SPAWNED");

  return;
 }

 if(cmd==="clear"){

  zombies.forEach(z=>
   scene.remove(z)
  );

  zombies.length=0;

  logConsole("ZOMBIES CLEARED");

  return;
 }

 if(cmd.startsWith("weapon ")){

  const name=
   cmd.split(" ")[1];

  const i=
   weapons.findIndex(
    w=>w.id===name
   );

  if(i>=0){

   switchWeapon(i);

   logConsole(
    "WEAPON = "+
    weapons[i].name
   );

  }else{

   logConsole(
    "WEAPON NOT FOUND"
   );
  }

  return;
 }

 if(cmd==="day"){

  scene.background.set(
   0x9db6c8
  );

  scene.fog.color.set(
   0x9db6c8
  );

  sun.intensity=2.8;

  logConsole("DAY MODE");

  return;
 }

 if(cmd==="night"){

  scene.background.set(
   0x07111f
  );

  scene.fog.color.set(
   0x07111f
  );

  sun.intensity=.35;

  logConsole("NIGHT MODE");

  return;
 }

 logConsole(
  "UNKNOWN COMMAND"
 );
}

 );
}

========================================================= */

addEventListener(

 ()=>{

   innerWidth,
   innerHeight
  );
 }
);

/* =========================================================
   LOOP
========================================================= */

let last=performance.now();

function animate(){

 requestAnimationFrame(animate);

 const now=performance.now();

 let dt=
  (now-last)/1000;

 last=now;

 dt=Math.min(dt,.05);

 if(!consoleOpen){

  playerUpdate(dt);

  zombieUpdate(dt);

  if(
   firing &&
   weapons[current].automatic
  ){
   shoot();
  }

  if(
   reloading &&
   now>=reloadEnd
  ){
   finishReload();
  }

  recoil*=Math.pow(.001,dt);

  if(weaponModel){

   weaponModel.position.x=.5;

   weaponModel.position.y=
    -.42-recoil*.2;

   weaponModel.position.z=
    -1+recoil*.45;

   if(
    weaponSlide &&
    weapons[current].id==="pistol"
   ){

    weaponSlide.position.z=
     -.25+
     Math.min(
      .18,
      recoil*1.4
     );
   }
  }

  effects.forEach(e=>{

   if(e.update)
    e.update(e,dt);

  });

  waveCheck();

  updateHUD();
 }

 renderer.render(
  scene,
  camera
 );
}

updateHUD();

animate();

console.log(
 "ALFA ZOMBIE 3D V4.2 READY"
);

</script>
